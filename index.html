<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>Mentoria Black — Gestão Financeira V65 FINAL</title><style>html,body{margin:0;background:#050505;color:#eee;font-family:system-ui,-apple-system,sans-serif}#v60Boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:#aaa}#v60Boot b{color:#d9ad37;display:block;margin-bottom:8px}</style></head><body><div id="v60Boot"><div><b>MENTORIA BLACK — V65 FINAL</b>Carregando a base funcional V60 e as correções V65…</div></div><script>
(async()=>{
 const base="https://raw.githubusercontent.com/trybulosomaster-max/Mentoria-Black/9841e59c244fe941f8fd8fd20c7b82c4277f97c7/index.html";
 try{
   const r=await fetch(base,{cache:'no-store'});
   if(!r.ok)throw new Error('Não foi possível carregar a base V59.');
   let html=await r.text();
   html=html.replace(/<script\s+src=["']\.\/v60\.js[^>]*><\/script>/gi,'');
   html=html.replace(/<\/body>/i,"<script>\n/* =========================================================\n   MENTORIA BLACK \u2014 V60\n   Camada funcional sobre a V59.\n   Preserva os m\u00f3dulos existentes e adiciona:\n   - Sa\u00fade Financeira: M\u00eas, Ano, M\u00eas\u00d7M\u00eas, Ano\u00d7Ano, Hist\u00f3rico/Geral\n   - Evolu\u00e7\u00e3o financeira, alertas, prioridades e conquistas\n   - Taxa de Constru\u00e7\u00e3o Financeira\n   - Reserva de Emerg\u00eancia: mesma l\u00f3gica de per\u00edodos + evolu\u00e7\u00e3o\n   - Relat\u00f3rios com a mesma metodologia e motor \u00fanico de impress\u00e3o\n   - Dashboard somente com acesso r\u00e1pido \u00e0 Sa\u00fade Financeira\n   - Reserva n\u00e3o duplicada em Patrim\u00f4nio\n   - Nenhuma migra\u00e7\u00e3o/schema do Supabase\n========================================================= */\n(function(){\n'use strict';\nif(window.__MB_V60__) return;\nwindow.__MB_V60__ = true;\n\nconst N = x => Number.isFinite(Number(x)) ? Number(x) : 0;\nconst money60 = x => typeof money === 'function' ? money(x) :\n  `R$ ${N(x).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;\nconst pct60 = x => `${N(x).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}%`;\nconst esc60 = x => typeof esc === 'function' ? esc(x) :\n  String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\nconst clamp60 = (x,a=0,b=100)=>Math.min(b,Math.max(a,N(x)));\nconst key60 = (y,m)=>`${y}-${String(m).padStart(2,'0')}`;\nconst monthName60 = m => (MONTHS && MONTHS[m-1]) || '';\nconst txDate60 = t => String(t.transaction_date || t.date || '').slice(0,10);\nconst txType60 = t => String(t.transaction_type || t.type || '').toLowerCase();\nconst activeTx60 = () => (DATA.transactions||[]).filter(t=>t.status!=='cancelado' && txDate60(t));\nconst ledgerKey60 = () => `mb_v56_reserve_ledger_${USER?.id||'local'}`;\n\nfunction ledger60(){\n  try{\n    const x=JSON.parse(localStorage.getItem(ledgerKey60())||'[]');\n    return Array.isArray(x)?x:[];\n  }catch{return []}\n}\nfunction reserveEntries60(){\n  return ledger60().map(x=>({\n    date:String(x.date||'').slice(0,10),\n    amount:N(x.amount),\n    type:String(x.type||'aporte').toLowerCase(),\n    description:String(x.description||'')\n  })).filter(x=>x.date);\n}\nfunction reserveCurrent60(){\n  return reserveEntries60().reduce((s,x)=>s+(x.type==='retirada'?-x.amount:x.amount),0);\n}\nfunction fixedExpenseRows60(){\n  return activeTx60().filter(t=>{\n    const cat=typeof topCategory==='function'?topCategory(t.category):t.category;\n    return String(cat).toLowerCase()==='gastos fixos' &&\n      ['despesa','expense','investimento','investment'].includes(txType60(t));\n  });\n}\nfunction fixedExpenseAmount60(rows){return rows.reduce((s,t)=>s+N(t.amount),0)}\n\nfunction periodBounds60(mode,y,m){\n  if(mode==='month'){\n    const a=key60(y,m);\n    return {start:`${a}-01`,end:new Date(y,m,0).toISOString().slice(0,10)};\n  }\n  if(mode==='year'){\n    return {start:`${y}-01-01`,end:`${y}-12-31`};\n  }\n  if(mode==='month-compare'){\n    const p=new Date(y,m-2,1);\n    return {start:`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-01`,\n      end:new Date(y,m,0).toISOString().slice(0,10)};\n  }\n  if(mode==='year-compare'){\n    return {start:`${y-1}-01-01`,end:`${y}-12-31`};\n  }\n  return {start:'0000-01-01',end:'9999-12-31'};\n}\nfunction rowsBetween60(start,end){\n  return activeTx60().filter(t=>txDate60(t)>=start && txDate60(t)<=end);\n}\nfunction summarize60(rows){\n  let income=0,expense=0,investment=0,resgate=0;\n  rows.forEach(t=>{\n    const ty=txType60(t),v=Math.abs(N(t.amount));\n    if(['receita','income'].includes(ty)) income+=v;\n    else if(['resgate','redemption'].includes(ty)) resgate+=v;\n    else if(['investimento','investment'].includes(ty)) investment+=v;\n    else if(['despesa','expense'].includes(ty)) expense+=v;\n  });\n  const out=expense+investment;\n  return {income,expense,investment,resgate,out,balance:income+resgate-out};\n}\nfunction planFor60(y,m){\n  try{\n    const old=monthlyPlan();\n    if(Number(FILTERS.year)===y && Number(FILTERS.month)===m) return old||{};\n  }catch{}\n  const arr=(DATA.monthly||[]).filter(x=>Number(x.year)===y && Number(x.month)===m);\n  return arr[0]||{};\n}\nfunction periodData60(mode){\n  const y=N(FILTERS.year)||new Date().getFullYear(),m=N(FILTERS.month)||new Date().getMonth()+1;\n  if(mode==='month') return {mode,y,m,label:`${monthName60(m)} de ${y}`,rows:rowsBetween60(...Object.values(periodBounds60(mode,y,m)))};\n  if(mode==='year') return {mode,y,m,label:`Ano de ${y}`,rows:rowsBetween60(...Object.values(periodBounds60(mode,y,m)))};\n  if(mode==='month-compare'){\n    const prev=new Date(y,m-2,1), cur={y,m}, py=prev.getFullYear(),pm=prev.getMonth()+1;\n    return {mode,y,m,label:`${monthName60(m)}/${y} \u00d7 ${monthName60(pm)}/${py}`,\n      current:rowsBetween60(...Object.values(periodBounds60('month',y,m))),\n      previous:rowsBetween60(...Object.values(periodBounds60('month',py,pm)))};\n  }\n  if(mode==='year-compare'){\n    return {mode,y,m,label:`${y} \u00d7 ${y-1}`,\n      current:rowsBetween60(`${y}-01-01`,`${y}-12-31`),\n      previous:rowsBetween60(`${y-1}-01-01`,`${y-1}-12-31`)};\n  }\n  return {mode:'history',y,m,label:'Hist\u00f3rico / Geral',rows:rowsBetween60('0000-01-01','9999-12-31')};\n}\n\nfunction reserveFixedBase60(y,m){\n  // Mesma regra da V58/V59: m\u00e9dia dos seis meses completos anteriores.\n  const vals=[];\n  for(let i=1;i<=6;i++){\n    const d=new Date(y,m-1-i,1), yy=d.getFullYear(), mm=d.getMonth()+1;\n    const rows=rowsBetween60(`${yy}-${String(mm).padStart(2,'0')}-01`,new Date(yy,mm,0).toISOString().slice(0,10));\n    vals.push(fixedExpenseAmount60(rows));\n  }\n  const known=vals.filter(v=>v>0);\n  return {avg:known.length?known.reduce((a,b)=>a+b,0)/known.length:0,known:known.length,values:vals};\n}\nfunction reserveMetrics60(mode){\n  const y=N(FILTERS.year)||new Date().getFullYear(),m=N(FILTERS.month)||new Date().getMonth()+1;\n  const s=(()=>{try{return JSON.parse(localStorage.getItem(`mb_v50_reserve_${USER?.id||'local'}`)||'{}')}catch{return {}}})();\n  const targetMode=s.targetMode==='custom'?'custom':'fixed';\n  const custom=N(s.customTarget);\n  const months=Math.max(.5,N(s.months||6));\n  const base=reserveFixedBase60(y,m);\n  const target=targetMode==='custom'?custom:base.avg*months;\n  const cur=reserveCurrent60();\n  const coverage=base.avg>0?cur/base.avg:0;\n  const progress=target>0?clamp60(cur/target*100):0;\n  const entries=reserveEntries60();\n  const inPeriod=mode==='history'?entries:\n    entries.filter(e=>e.date>=periodBounds60('month',y,m).start && e.date<=periodBounds60('month',y,m).end);\n  const aportes=inPeriod.filter(e=>e.type!=='retirada').reduce((a,e)=>a+e.amount,0);\n  const retiradas=inPeriod.filter(e=>e.type==='retirada').reduce((a,e)=>a+e.amount,0);\n  return {targetMode,custom,months,base,target,cur,coverage,progress,aportes,retiradas,net:aportes-retiradas,\n    entries,inPeriod,deadline:String(s.deadline||'')};\n}\n\nfunction construction60(rows){\n  const s=summarize60(rows);\n  const reserve=reserveEntries60().filter(e=>{\n    if(!rows.length)return false;\n    const min=rows.map(txDate60).sort()[0], max=rows.map(txDate60).sort().slice(-1)[0];\n    return e.date>=min && e.date<=max;\n  });\n  const reserveNet=reserve.reduce((a,e)=>a+(e.type==='retirada'?-e.amount:e.amount),0);\n  const directed=s.investment+Math.max(0,reserveNet);\n  const rate=s.income>0?directed/s.income*100:0;\n  let label=rate<5?'Baixa':rate<15?'Em forma\u00e7\u00e3o':rate<25?'Boa':'Forte';\n  return {rate,directed,income:s.income,invest:s.investment,reserve:reserveNet,label};\n}\n\nfunction score60(rows){\n  const s=summarize60(rows);\n  const fixed=fixedExpenseAmount60(rows);\n  const income=s.income;\n  const budget=income>0?clamp60((1-Math.max(0,s.expense-income*.42)/Math.max(1,income*.42))*100):(s.balance>=0?70:35);\n  const invest=income>0?clamp60(s.investment/income*100):(s.investment>0?70:35);\n  const reserve=reserveMetrics60('month');\n  const reserveScore=reserve.target>0?clamp60(reserve.cur/reserve.target*100):0;\n  const commitment=income>0?clamp60((1-Math.max(0,fixed-income*.45)/Math.max(1,income*.45))*100):65;\n  const goals=(DATA.goals||[]).filter(g=>!(/reserva|emerg[e\u00ea]ncia|caixinha/i.test(String(g.name||''))));\n  const goal=goals.length?clamp60(goals.reduce((a,g)=>a+(N(g.target)>0?clamp60(N(g.current)/N(g.target)*100):100),0)/goals.length):70;\n  // Nota calculada a partir dos indicadores brutos; n\u00e3o \u00e9 m\u00e9dia simples de notas.\n  const raw=.28*budget+.22*invest+.20*reserveScore+.15*commitment+.15*goal;\n  const rate=construction60(rows);\n  const label=raw<40?'Cr\u00edtica':raw<60?'Aten\u00e7\u00e3o':raw<75?'Regular':raw<90?'Boa':'Excelente';\n  return {score:Math.round(clamp60(raw)),label,budget,invest,reserveScore,commitment,goal,construction:rate,s};\n}\n\nfunction delta60(a,b){\n  if(!b)return {value:a,pct:null};\n  return {value:a-b,pct:(a-b)/Math.abs(b)*100};\n}\nfunction evolution60(mode){\n  const y=N(FILTERS.year),m=N(FILTERS.month);\n  const labels=[],income=[],out=[],construction=[];\n  if(mode==='year' || mode==='history'){\n    const start=mode==='history'?Math.max(2000,y-5):y;\n    const end=mode==='history'?y:y;\n    for(let yy=start;yy<=end;yy++){\n      const rows=rowsBetween60(`${yy}-01-01`,`${yy}-12-31`), s=summarize60(rows);\n      labels.push(String(yy));income.push(s.income);out.push(s.out);construction.push(construction60(rows).rate);\n    }\n  }else{\n    for(let i=11;i>=0;i--){\n      const d=new Date(y,m-1-i,1),yy=d.getFullYear(),mm=d.getMonth()+1;\n      const rows=rowsBetween60(`${yy}-${String(mm).padStart(2,'0')}-01`,new Date(yy,mm,0).toISOString().slice(0,10));\n      const s=summarize60(rows);\n      labels.push(`${String(mm).padStart(2,'0')}/${yy}`);income.push(s.income);out.push(s.out);construction.push(construction60(rows).rate);\n    }\n  }\n  return {labels,income,out,construction};\n}\n\nfunction alerts60(rows,h){\n  const a=[];\n  const s=h.s;\n  if(s.income===0) a.push(['Aten\u00e7\u00e3o','N\u00e3o h\u00e1 receitas no per\u00edodo selecionado.']);\n  if(s.expense>s.income && s.income>0) a.push(['Aten\u00e7\u00e3o','As despesas superaram as receitas do per\u00edodo.']);\n  if(h.invest<10) a.push(['Constru\u00e7\u00e3o','A taxa de investimento ainda est\u00e1 abaixo de 10% da receita.']);\n  if(h.construction.rate<10) a.push(['Constru\u00e7\u00e3o','A taxa de constru\u00e7\u00e3o financeira est\u00e1 baixa neste per\u00edodo.']);\n  if(h.reserveScore<50) a.push(['Prote\u00e7\u00e3o','A reserva ainda est\u00e1 abaixo de metade da meta definida.']);\n  if(h.commitment<60) a.push(['Estrutura','Os Gastos Fixos est\u00e3o pressionando a margem financeira.']);\n  if(!a.length) a.push(['Positivo','N\u00e3o foram identificados alertas cr\u00edticos neste per\u00edodo.']);\n  return a;\n}\nfunction priorities60(h){\n  const list=[];\n  if(h.reserveScore<75)list.push(['1','Fortalecer a Reserva de Emerg\u00eancia','Aumentar o colch\u00e3o financeiro at\u00e9 a meta definida.']);\n  if(h.construction.rate<20)list.push([String(list.length+1),'Aumentar a constru\u00e7\u00e3o financeira','Elevar investimentos e aportes direcionados sem contar despesas de consumo.']);\n  if(h.commitment<75)list.push([String(list.length+1),'Reduzir press\u00e3o dos Gastos Fixos','Preservar margem para investimentos e metas.']);\n  if(h.goal<75)list.push([String(list.length+1),'Acelerar metas','Direcionar recursos para as metas que ainda est\u00e3o abaixo do objetivo.']);\n  if(!list.length)list.push(['1','Manter consist\u00eancia','Sua estrutura est\u00e1 saud\u00e1vel; o foco passa a ser preservar o ritmo.']);\n  return list.slice(0,4);\n}\nfunction achievements60(h){\n  const x=[];\n  if(h.invest>=15)x.push('Investidor consistente');\n  if(h.construction.rate>=20)x.push('Construtor financeiro');\n  if(h.reserveScore>=100)x.push('Reserva protegida');\n  if(h.goal>=90)x.push('Metas em dia');\n  if(h.s.balance>=0)x.push('M\u00eas no azul');\n  return x.length?x:['Primeiro marco','Continue construindo sua base financeira.'];\n}\n\nfunction modeSelect60(id,current){\n  return `<select id=\"${id}\">\n    <option value=\"month\" ${current==='month'?'selected':''}>M\u00eas</option>\n    <option value=\"year\" ${current==='year'?'selected':''}>Ano</option>\n    <option value=\"month-compare\" ${current==='month-compare'?'selected':''}>M\u00eas \u00d7 M\u00eas</option>\n    <option value=\"year-compare\" ${current==='year-compare'?'selected':''}>Ano \u00d7 Ano</option>\n    <option value=\"history\" ${current==='history'?'selected':''}>Hist\u00f3rico / Geral</option>\n  </select>`;\n}\nfunction periodControls60(mode,prefix){\n  return `<div class=\"filters v60-filters\">\n    <div class=\"filter\"><label>Ano</label><select id=\"${prefix}Year\">${yearOptions(FILTERS.year)}</select></div>\n    <div class=\"filter\"><label>M\u00eas</label><select id=\"${prefix}Month\">${monthOptions(FILTERS.month)}</select></div>\n    <div class=\"filter\"><label>Vis\u00e3o</label>${modeSelect60(prefix+'Mode',mode)}</div>\n  </div>`;\n}\nfunction bindPeriod60(prefix,rerender){\n  const y=$(prefix+'Year'),m=$(prefix+'Month'),mode=$(prefix+'Mode');\n  if(y)y.onchange=()=>{FILTERS.year=N(y.value);rerender()};\n  if(m)m.onchange=()=>{FILTERS.month=N(m.value);rerender()};\n  if(mode)mode.onchange=()=>{rerender(mode.value)};\n}\n\nfunction healthPage60(mode='month'){\n  const d=periodData60(mode);\n  let rows=d.rows||d.current||[];\n  const h=score60(rows);\n  const current=d.current?score60(d.current):null, previous=d.previous?score60(d.previous):null;\n  const comp=current&&previous?delta60(current.score,previous.score):null;\n  const evo=evolution60(mode);\n  const alerts=alerts60(rows,h), priorities=priorities60(h), achievements=achievements60(h);\n  return `<div class=\"v60-page\">\n    ${pageHead('Sa\u00fade Financeira','Vis\u00e3o integrada de desempenho, prote\u00e7\u00e3o e constru\u00e7\u00e3o financeira.')}\n    ${periodControls60(mode,'v60Health')}\n    <div class=\"kpis\">\n      ${kpi('Sa\u00fade financeira',`${h.score}/100`,h.label)}\n      ${kpi('Or\u00e7amento',`${Math.round(h.budget)}/100`,'controle financeiro')}\n      ${kpi('Investimentos',`${Math.round(h.invest)}/100`,'percentual da receita')}\n      ${kpi('Reserva',`${Math.round(h.reserveScore)}/100`,'progresso da meta')}\n      ${kpi('Constru\u00e7\u00e3o',pct60(h.construction.rate),h.construction.label)}\n      ${kpi('Metas',`${Math.round(h.goal)}/100`,'evolu\u00e7\u00e3o das metas')}\n    </div>\n    ${comp?`<section class=\"card\"><h2>Compara\u00e7\u00e3o do per\u00edodo</h2><div class=\"desc\">A nota \u00e9 recalculada para cada per\u00edodo; n\u00e3o \u00e9 uma m\u00e9dia simples de notas.</div><div class=\"statline\"><span>Varia\u00e7\u00e3o da sa\u00fade financeira</span><strong class=\"${comp.value>=0?'positive':'negative'}\">${comp.value>=0?'+':''}${comp.value.toFixed(0)} pontos ${comp.pct==null?'':`(${comp.pct>=0?'+':''}${comp.pct.toFixed(1)}%)`}</strong></div></section>`:''}\n    <div class=\"grid\">\n      <section class=\"card s8\">\n        <h2>Evolu\u00e7\u00e3o financeira</h2><div class=\"desc\">Receitas, sa\u00eddas e taxa de constru\u00e7\u00e3o financeira.</div>\n        <div class=\"chartbox\"><canvas id=\"v60HealthChart\"></canvas></div>\n      </section>\n      <section class=\"card s4\">\n        <h2>Leitura financeira</h2>\n        <div class=\"notice\" style=\"margin-top:10px;line-height:1.7\">\n          ${esc60(h.label)}: ${h.score}/100. Receita ${money60(h.s.income)}, sa\u00eddas ${money60(h.s.out)} e constru\u00e7\u00e3o financeira de ${pct60(h.construction.rate)}.\n        </div>\n        <h3 style=\"margin:18px 0 8px\">Prioridade</h3>\n        ${priorities.slice(0,2).map(x=>`<div class=\"statline\"><span>${x[0]}. ${esc60(x[1])}</span><strong>\u2192</strong></div>`).join('')}\n      </section>\n      <section class=\"card s6\">\n        <h2>Alertas financeiros</h2>${alerts.map(x=>`<div class=\"statline\"><span><b>${esc60(x[0])}</b><br><span class=\"small muted\">${esc60(x[1])}</span></span></div>`).join('')}\n      </section>\n      <section class=\"card s6\">\n        <h2>Prioridade financeira</h2>${priorities.map(x=>`<div class=\"statline\"><span><b>${x[0]}.</b> ${esc60(x[1])}<br><span class=\"small muted\">${esc60(x[2])}</span></span></div>`).join('')}\n      </section>\n      <section class=\"card s6\">\n        <h2>Conquistas financeiras</h2><div class=\"row\" style=\"margin-top:10px\">${achievements.map(x=>`<span class=\"tag ok\">${esc60(x)}</span>`).join('')}</div>\n      </section>\n      <section class=\"card s6\">\n        <h2>Taxa de Constru\u00e7\u00e3o Financeira</h2>\n        <div class=\"desc\">Recursos direcionados \u00e0 constru\u00e7\u00e3o patrimonial \u00f7 receita. N\u00e3o inclui despesas comuns nem metas de consumo.</div>\n        <div style=\"font-size:38px;font-weight:900;margin:10px 0\">${pct60(h.construction.rate)}</div>\n        <div class=\"statline\"><span>Valor direcionado</span><strong>${money60(h.construction.directed)}</strong></div>\n        <div class=\"statline\"><span>Base de receita</span><strong>${money60(h.construction.income)}</strong></div>\n        <div class=\"statline\"><span>Investimentos</span><strong>${money60(h.construction.invest)}</strong></div>\n        <div class=\"statline\"><span>Reserva l\u00edquida</span><strong>${money60(h.construction.reserve)}</strong></div>\n      </section>\n    </div>\n  </div>`;\n}\n\nfunction reservePage60(mode='month'){\n  const r=reserveMetrics60(mode), y=N(FILTERS.year),m=N(FILTERS.month);\n  const history=r.entries.slice().sort((a,b)=>a.date.localeCompare(b.date));\n  const last=history.slice(-12);\n  const labels=last.map(x=>x.date.slice(0,7)), balances=[];\n  let running=0; history.forEach(x=>running+=x.type==='retirada'?-x.amount:x.amount);\n  const byMonth={}; history.forEach(x=>{const k=x.date.slice(0,7);byMonth[k]=(byMonth[k]||0)+(x.type==='retirada'?-x.amount:x.amount)});\n  let cur=0;Object.keys(byMonth).sort().slice(-12).forEach(k=>{cur+=byMonth[k];balances.push(cur)});\n  return `${pageHead('Reserva de Emerg\u00eancia','Acompanhamento completo da reserva, com evolu\u00e7\u00e3o e compara\u00e7\u00e3o.')}\n    ${periodControls60(mode,'v60Reserve')}\n    <div class=\"kpis\">\n      ${kpi('Reserva atual',money60(r.cur),'saldo da carteira')}\n      ${kpi('Aportes',money60(r.aportes),'per\u00edodo')}\n      ${kpi('Retiradas',money60(r.retiradas),'per\u00edodo')}\n      ${kpi('Evolu\u00e7\u00e3o l\u00edquida',money60(r.net),'per\u00edodo')}\n      ${kpi('Cobertura',`${r.coverage.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})} meses`,'pela m\u00e9dia de Gastos Fixos')}\n      ${kpi('Progresso',pct60(r.progress),'da meta')}\n    </div>\n    <div class=\"grid\">\n      <section class=\"card s8\"><h2>Evolu\u00e7\u00e3o da Reserva</h2><div class=\"chartbox\"><canvas id=\"v60ReserveChart\"></canvas></div></section>\n      <section class=\"card s4\">\n        <h2>Meta da Reserva</h2>\n        <div class=\"statline\"><span>Modo</span><strong>${r.targetMode==='custom'?'Valor personalizado':'Por Gastos Fixos'}</strong></div>\n        <div class=\"statline\"><span>Meta</span><strong>${money60(r.target)}</strong></div>\n        <div class=\"statline\"><span>Base mensal</span><strong>${money60(r.base.avg)}</strong></div>\n        <div class=\"statline\"><span>Meses</span><strong>${r.months}</strong></div>\n        ${r.base.known<6?`<div class=\"notice\" style=\"margin-top:10px\">Dados insuficientes: apenas ${r.base.known} de 6 meses anteriores possuem Gastos Fixos reconhecidos.</div>`:''}\n        <button class=\"btn gold\" style=\"margin-top:12px\" onclick=\"openV50Reserve()\">Configurar meta</button>\n      </section>\n      <section cla
