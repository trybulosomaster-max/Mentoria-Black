<style>

d-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase}.kpi .value{font-size:22px;font-weight:800;margin-top:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #222}th{color:#999;font-size:10px;text-transform:uppercase}td{font-size:13px}.positive{color:var(--ok)}.negative{color:#d89595}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #333;border-radius:10px}.bar{height:9px;background:#222;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:#101010;border:1px solid #383838;border-radius:14px;padding:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.msg{min-height:20px;color:#aaa;margin-top:8px}.toast{position:fixed;right:15px;bottom:15px;background:#151515;border:1px solid #444;padding:12px;border-radius:10px;z-index:30}.small{font-size:11px}.statline{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.chart{width:100%;overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 7px;border:1px solid #444;border-radius:99px;font-size:10px}.search{max-width:330px}.dangerbox{border-color:#633}.successbox{border-color:#465b3d}@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.span8,.span6,.span4{grid-column:span 12}}@media(max-width:600px){.wrap{padding:13px}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:10px}.nav{padding-bottom:8px}}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 12px}.filter label{margin-top:0}.chartbox{height:300px;position:relative}.chartbox canvas{width:100%!important;height:100%!important}.subtle{color:var(--muted);font-size:12px}.color-input{height:42px;padding:4px}.period-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.period-summary .pill{color:#ddd}.warn{color:#e4c17b}.oktext{color:var(--ok)}
.category-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.cat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #222;border-radius:8px;background:#0b0b0b}.cat-name{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}.compare-table td,.compare-table th{padding:8px}.reserve-progress{height:10px;background:#222;border-radius:99px;overflow:hidden}.reserve-progress i{display:block;height:100%;border-radius:99px;background:#93aa83}.hint{font-size:11px;color:#888;line-height:1.45}
@media(max-width:600px){.category-legend{grid-template-columns:1fr}}@media(max-width:900px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.filters{grid-template-columns:1fr}.chartbox{height:260px}table{min-width:720px}}

<body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand">MENTORIA BLACK</div><h1>Gestão Financeira</h1><p>Planejamento, execução, patrimônio e análise em um só lugar.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><div class="row" style="margin-top:15px"><button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" id="signup">Criar conta</button><button class="btn" type="button" id="reset">Recuperar senha</button></div><div id="authMsg" class="msg"></div></form></div></section>

<script>
const SUPABASE_URL="https://mwjqfzbpjmwiscvtxvfc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Bz8zOgsayn5KRDKBa0_u_A_TbvV_RuK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0), pct=v=>(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%', esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
let USER=null, TAB='dashboard', DATA={accounts:[],cards:[],categories:[],transactions:[],budgets:[],goals:[],recurring:[],assets:[],liabilities:[],monthly:[],strategy:[],rules:[],imports:[]};
let FILTERS={year:new Date().getFullYear(),month:new Date().getMonth()+1,txType:'',txCategory:'',search:''};
const CATEGORY_ORDER=['Gastos Fixos','Investimentos','Conforto','Metas','Lazer','Conhecimento'];
const ACCOUNT_TYPES={checking:'Conta corrente',savings:'Conta poupança',investment:'Conta de investimentos',cash:'Carteira / dinheiro'};
const TX_TYPES={receita:'Receita',despesa:'Despesa',transferencia:'Transferência',investimento:'Investimento',resgate:'Resgate'};
const MONTHS_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function localToday(){const d=new Date();return {year:d.getFullYear(),month:d.getMonth()+1,date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}}
function ymKey(y,m){return `${y}-${String(m).padStart(2,'0')}`}
function monthLabel(y,m){return `${MONTHS_PT[m-1]} de ${y}`}
function selectedYm(){return ymKey(FILTERS.year,FILTERS.month)}
function periodTx(realizedOnly=false){return DATA.transactions.filter(t=>String(t.transaction_date).slice(0,7)===selectedYm() && t.status!=='cancelado' && (!realizedOnly||t.status==='realizado'))}
function availableYears(){const now=new Date().getFullYear(),ys=new Set();for(let y=2000;y<=now+20;y++)ys.add(y);DATA.transactions.forEach(t=>{const y=Number(String(t.transaction_date).slice(0,4));if(y)ys.add(y)});DATA.monthly.forEach(p=>{const y=Number(p.year);if(y)ys.add(y)});DATA.strategy.forEach(p=>{const y=Number(p.year);if(y)ys.add(y)});return [...ys].filter(Boolean).sort((a,b)=>b-a)}
function yearOptions(selected){return availableYears().map(y=>`<option value="${y}" ${Number(selected)===y?'selected':''}>${y}</option>`).join('')}
function monthOptions(selected){return MONTHS_PT.map((m,i)=>`<option value="${i+1}" ${Number(selected)===i+1?'selected':''}>${m}</option>`).join('')}
function periodFilters(prefix=''){return `<div class="filters"><div class="filter"><label>Ano</label><select id="${prefix}Year"><option>Carregando...</option></select></div><div class="filter"><label>Mês</label><select id="${prefix}Month">${monthOptions(FILTERS.month)}</select></div></div>`}
function selectedPlan(){return DATA.monthly.find(x=>Number(x.year)===FILTERS.year&&Number(x.month)===FILTERS.month)||null}
function strategyForPlan(p){
 const s=DATA.strategy.find(x=>Number(x.year)===FILTERS.year&&Number(x.month)===FILTERS.month)||{};
 const revenue=Number(p?.revenue ?? s?.revenue ?? 0);
 const vals={fixed_expenses:Number(p?.fixed_expenses ?? s?.fixed_expenses_value ?? 0),investments:Number(p?.investments ?? s?.investments_value ?? 0),comfort:Number(p?.comfort ?? s?.comfort_value ?? 0),goals:Number(p?.goals ?? s?.goals_value ?? 0),leisure:Number(p?.leisure ?? s?.leisure_value ?? 0),knowledge:Number(p?.knowledge ?? s?.knowledge_value ?? 0)};
 const pctOf=k=>revenue>0?vals[k]/revenue*100:Number(s?.[k+'_pct']||0);
 return {revenue,vals,fixed_expenses_pct:pctOf('fixed_expenses'),investments_pct:pctOf('investments'),comfort_pct:pctOf('comfort'),goals_pct:pctOf('goals'),leisure_pct:pctOf('leisure'),knowledge_pct:pctOf('knowledge')};
}
function chartDestroy(id){if(window.__charts?.[id]){window.__charts[id].destroy();delete window.__charts[id]}}
function makeChart(id,type,data,options={}){window.__charts=window.__charts||{};chartDestroy(id);const el=$(id);if(!el||typeof Chart==='undefined')return;window.__charts[id]=new Chart(el,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#ddd'}},tooltip:{callbacks:{label:c=>money(c.parsed.y??c.parsed??0)}}},scales:type==='pie'?{}:{x:{ticks:{color:'#999'},grid:{color:'#222'}},y:{ticks:{color:'#999',callback:v=>money(v)},grid:{color:'#222'}}},...options}})}

const tabs=[['dashboard','Dashboard'],['transactions','Lançamentos'],['planning','Planejamento'],['accounts','Contas'],['cards','Cartões'],['categories','Categorias'],['goals','Metas'],['recurring','Recorrências'],['wealth','Patrimônio'],['reports','Relatórios']];
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}$('closeModal').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function nav(){ $('nav').innerHTML=tabs.map(([id,label])=>`<button class="btn ${TAB===id?'active':''}" data-tab="${id}">${label}</button>`).join('');$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()}) }
async function load(){
 const specs=[
  ['accounts','created_at'],['cards','created_at'],['categories','created_at'],['transactions','transaction_date'],['budgets','created_at'],['goals','created_at'],['recurring','created_at'],['assets','created_at'],['liabilities','created_at'],['monthly_plans','created_at'],['strategy_plans','created_at'],['rules','created_at'],['imports','imported_at']
 ];
 for(const [name,orderCol] of specs){
  let q=sb.from(name).select('*').eq('user_id',USER.id).order(orderCol,{ascending:false});
  const {data,error}=await q;if(error)throw error;
  const key=name==='monthly_plans'?'monthly':name==='strategy_plans'?'strategy':name;
  DATA[key]=data||[];
 }
}

function layout(title,actions,body){return `<div class="row" style="justify-content:space-between;margin:10px 0 12px"><div><h2 style="margin:0">${title}</h2></div><div class="actions">${actions||''}</div></div>${body}`}
function btn(label,onclick,cls='btn'){return `<button class="${cls}" onclick="${onclick}">${label}</button>`}
function accountOptions(){return DATA.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}${a.institution?' — '+esc(a.institution):''}</option>`).join('')}
function cardOptions(){return DATA.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function safeColor(c){return /^#[0-9a-fA-F]{6}$/.test(String(c||''))?c:'#c9a227'}
function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function topCategoryName(name){const direct=DATA.categories.find(c=>normName(c.name)===normName(name));if(direct?.parent){const parent=DATA.categories.find(c=>normName(c.name)===normName(direct.parent));return parent?.name||direct.parent}const text=String(name||'');const parts=text.split(' / ');if(parts.length>1){const parent=DATA.categories.find(c=>normName(c.name)===normName(parts[0]));return parent?.name||parts[0]}return direct?.name||name||'Sem categoria'}
function categoryColor(name){const c=DATA.categories.find(x=>normName(x.name)===normName(name));if(c)return safeColor(c.color);const top=topCategoryName(name);const p=DATA.categories.find(x=>normName(x.name)===normName(top));return safeColor(p?.color)}
function categoryOptions(excludeId=''){return DATA.categories.filter(c=>c.id!==excludeId).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}${c.parent?' / '+esc(c.parent):''}</option>`).join('')}
function categoryLegend(entries,total){if(!entries.length)return '';return `<div class="category-legend">${entries.map(([name,value])=>{const p=total?value/total*100:0;return `<div class="cat-item"><span class="cat-name"><i class="dot" style="background:${categoryColor(name)}"></i>${esc(name)}</span><strong>${money(value)} <span class="muted">(${pct(p)})</span></strong></div>`}).join('')}</div>`}
function dashboard(){
 const tx=periodTx(true), income=tx.filter(t=>t.transaction_type==='receita').reduce((a,t)=>a+Number(t.amount),0), expense=tx.filter(t=>['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount),0), invest=tx.filter(t=>t.transaction_type==='investimento').reduce((a,t)=>a+Number(t.amount),0), fixed=tx.filter(t=>topCategoryName(t.category)==='Gastos Fixos'&&t.transaction_type==='despesa').reduce((a,t)=>a+Number(t.amount),0), assets=DATA.assets.reduce((a,x)=>a+Number(x.current_value),0), debt=DATA.liabilities.reduce((a,x)=>a+Number(x.balance),0), net=assets+DATA.accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance),0)-debt;
 const bycat={};tx.filter(t=>t.transaction_type==='despesa').forEach(t=>{const k=topCategoryName(t.category);bycat[k]=(bycat[k]||0)+Number(t.amount)});const rows=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);const reserve=DATA.goals.find(g=>/reserva\s+de\s+emerg[eê]ncia/i.test(g.name||''));const reserveTarget=Number(reserve?.target||0),reserveCurrent=Number(reserve?.current||0),reservePct=reserveTarget?Math.min(100,reserveCurrent/reserveTarget*100):0;
 return layout('Dashboard',btn('+ Lançamento','openTransaction()','btn primary'),`${periodFilters('dash')}<div class="period-summary"><span class="pill">${monthLabel(FILTERS.year,FILTERS.month)}</span><span class="subtle">Todos os indicadores abaixo respeitam o período selecionado.</span></div><div class="kpis">${kpi('Receitas',money(income),'período selecionado')}${kpi('Despesas',money(expense),'inclui investimentos')}${kpi('Saldo',money(income-expense),income-expense>=0?'positivo':'atenção')}${kpi('Investimentos',money(invest),'período selecionado')}${kpi('Gastos fixos',money(fixed),'despesas da categoria')}${kpi('Patrimônio líquido',money(net),'estimativa atual')}</div><div class="grid"><section class="card span8"><h2>Despesas por categoria</h2><p class="muted">${monthLabel(FILTERS.year,FILTERS.month)}</p>${rows.length?`<div class="chartbox"><canvas id="dashCategoryChart"></canvas></div>${categoryLegend(rows,expense)}`:'<div class="empty">Ainda não há despesas neste período.</div>'}</section><section class="card span4"><h2>Reserva de emergência</h2>${reserve?`<div class="statline"><span>Acumulado</span><strong>${money(reserveCurrent)}</strong></div><div class="statline"><span>Objetivo</span><strong>${money(reserveTarget)}</strong></div><div class="reserve-progress"><i style="width:${reservePct}%"></i></div><p class="hint">${pct(reservePct)} do objetivo alcançado.</p>${btn('Editar reserva',`openGoal('${reserve.id}')`)} `:`<p class="muted">Crie uma meta chamada <b>Reserva de emergência</b> para acompanhar sua reserva aqui.</p>${btn('Configurar reserva',`openGoal()`,'btn primary')}`}<hr style="border-color:#222;margin:14px 0"><h2>Visão rápida</h2><p class="muted">Indicadores operacionais</p><div class="statline"><span>Contas</span><strong>${DATA.accounts.length}</strong></div><div class="statline"><span>Cartões</span><strong>${DATA.cards.length}</strong></div><div class="statline"><span>Metas</span><strong>${DATA.goals.length}</strong></div><div class="statline"><span>Recorrências ativas</span><strong>${DATA.recurring.filter(x=>x.active).length}</strong></div><div class="statline"><span>Despesas lançadas</span><strong>${rows.length?Object.values(bycat).length:0}</strong></div></section><section class="card span12"><h2>Evolução mensal — ${FILTERS.year}</h2><p class="muted">Receitas, despesas e investimentos ao longo do ano.</p><div class="chartbox"><canvas id="dashTrendChart"></canvas></div></section><section class="card span12"><h2>Últimos lançamentos do período</h2>${transactionTable(tx.slice(0,8))}</section></div>`)
}

function kpi(l,v,s){return `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="muted small">${s}</div></div>`}
function transactionTable(arr){if(!arr.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';return `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Conta/Cartão</th><th>Valor</th><th></th></tr></thead><tbody>${arr.map(t=>{const rel=t.account_id?DATA.accounts.find(a=>a.id===t.account_id)?.name:t.card_id?DATA.cards.find(c=>c.id===t.card_id)?.name:'';return `<tr><td>${fmtDate(t.transaction_date)}</td><td>${esc(t.description)}</td><td>${esc(t.category)}${t.subcategory?' / '+esc(t.subcategory):''}</td><td>${esc(TX_TYPES[t.transaction_type]||t.transaction_type)}</td><td>${esc(rel||'')}</td><td class="${['receita','resgate'].includes(t.transaction_type)?'positive':'negative'}">${money(t.amount)}</td><td>${btn('Editar',`openTransaction('${t.id}')`)} ${btn('Excluir',`deleteRow('transactions','${t.id}')`,'btn danger')}</td></tr>`}).join('')}</tbody></table></div>`}
function transactions(){return layout('Lançamentos',btn('+ Novo lançamento','openTransaction()','btn primary'),`${periodFilters('tx')}<div class="card"><div class="row"><input class="search" id="txSearch" placeholder="Buscar descrição/categoria" value="${esc(FILTERS.search)}"><select id="txType"><option value="">Todos os tipos</option>${Object.entries(TX_TYPES).map(([k,v])=>`<option value="${k}" ${FILTERS.txType===k?'selected':''}>${v}</option>`).join('')}</select><select id="txCategory"><option value="">Todas as categorias</option>${categoryOptions()}</select></div><div id="txList" style="margin-top:12px"></div></div>`)}
function refreshTx(){const q=($('txSearch')?.value||'').toLowerCase(),typ=$('txType')?.value||'',cat=$('txCategory')?.value||'';FILTERS.search=q;FILTERS.txType=typ;FILTERS.txCategory=cat;let arr=DATA.transactions.filter(t=>String(t.transaction_date).slice(0,7)===selectedYm()&&t.status!=='cancelado'&&(!typ||t.transaction_type===typ)&&(!cat||t.category===cat)&&(!q||`${t.description} ${t.category} ${t.subcategory||''}`.toLowerCase().includes(q)));if($('txList'))$('txList').innerHTML=transactionTable(arr)}

function addMonths(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function recurrenceNextDate(date,frequency,interval){if(frequency==='weekly')return addDays(date,7*interval);if(frequency==='yearly'){const d=new Date(date+'T12:00:00');d.setFullYear(d.getFullYear()+interval);return d.toISOString().slice(0,10)}return addMonths(date,interval)}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
async function materializeRecurring(){const today=localToday().date;for(const r of DATA.recurring.filter(x=>x.active&&x.auto_post)){let next=r.next_date;let guard=0;while(next&&next<=today&&guard<120){if(r.end_date&&next>r.end_date)break;const exists=DATA.transactions.some(t=>t.transaction_date===next&&t.description===r.name&&Number(t.amount)===Number(r.amount)&&t.user_id===USER.id);if(!exists){const row={user_id:USER.id,transaction_date:next,description:r.name,category:r.category,subcategory:r.subcategory||null,amount:Number(r.amount||0),transaction_type:r.type,status:next>today?'pendente':'realizado',payment_method:r.card_id?'Cartão de crédito':'Conta',account_id:r.account_id||null,card_id:r.card_id||null,note:r.note||null};const ins=await sb.from('transactions').insert(row);if(ins.error)break}next=recurrenceNextDate(next,r.frequency,r.interval||1);guard++}if(next!==r.next_date){await sb.from('recurring').update({next_date:next}).eq('id',r.id).eq('user_id',USER.id)}}}
function wealth(){const assets=DATA.assets.reduce((a,x)=>a+Number(x.current_value),0),liab=DATA.liabilities.reduce((a,x)=>a+Number(x.balance),0),cash=DATA.accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance),0);return layout('Patrimônio',btn('+ Ativo','openAsset()','btn primary')+btn('+ Passivo','openLiability()'),`<div class="kpis">${kpi('Disponível em contas',money(cash),'saldo informado')}${kpi('Ativos',money(assets),'valor atual')}${kpi('Passivos',money(liab),'saldo devedor')}${kpi('Patrimônio líquido',money(cash+assets-liab),'estimativa')}</div><div class="grid">${simpleTable('Ativos',DATA.assets,[['Ativo',x=>esc(x.name)],['Tipo',x=>esc(x.asset_type)],['Instituição',x=>esc(x.institution||'')],['Valor atual',x=>money(x.current_value)]],x=>btn('Excluir',`deleteRow('assets','${x.id}')`,'btn danger'))}${simpleTable('Passivos',DATA.liabilities,[['Dívida',x=>esc(x.name)],['Tipo',x=>esc(x.liability_type)],['Saldo',x=>money(x.balance)],['Parcela',x=>money(x.monthly_payment)]],x=>btn('Excluir',`deleteRow('liabilities','${x.id}')`,'btn danger'))}</div>`)}
function openAsset(){modal('Novo ativo',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required></div><div><label>Tipo</label><input name="asset_type" value="investment"></div><div><label>Instituição</label><input name="institution"></div><div><label>Custo</label><input name="cost_basis" type="number" step="0.01"></div><div><label>Valor atual</label><input name="current_value" type="number" step="0.01"></div><div><label>Quantidade</label><input name="quantity" type="number" step="0.00000001"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;['cost_basis','current_value','quantity'].forEach(k=>o[k]=o[k]?Number(o[k]):0);const r=await sb.from('assets').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Ativo salvo.')}}
function openLiability(){modal('Novo passivo',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required></div><div><label>Tipo</label><input name="liability_type" value="loan"></div><div><label>Principal</label><input name="principal" type="number" step="0.01"></div><div><label>Saldo</label><input name="balance" type="number" step="0.01"></div><div><label>Taxa</label><input name="interest_rate" type="number" step="0.0001"></div><div><label>Parcela mensal</label><input name="monthly_payment" type="number" step="0.01"></div><div><label>Vencimento</label><input name="due_date" type="date"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;['principal','balance','interest_rate','monthly_payment'].forEach(k=>o[k]=Number(o[k]||0));const r=await sb.from('liabilities').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Passivo salvo.')}}
function reports(){const tx=periodTx(true), income=tx.filter(t=>t.transaction_type==='receita').reduce((a,t)=>a+Number(t.amount),0), expense=tx.filter(t=>['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount),0);const by={};tx.filter(t=>t.transaction_type==='despesa').forEach(t=>by[t.category]=(by[t.category]||0)+Number(t.amount));const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);return layout('Relatórios',`<span class="pill">${tx.length} lançamentos</span>`,`${periodFilters('rep')}<div class="kpis">${kpi('Receita',money(income),'período selecionado')}${kpi('Despesas',money(expense),'inclui investimentos')}${kpi('Saldo',money(income-expense),'receita - despesas')}${kpi('Taxa de poupança',pct(income?(income-expense)/income*100:0),'indicador')}</div><div class="grid"><section class="card span6"><h2>Despesas por categoria</h2>${rows.length?`<div class="chartbox"><canvas id="reportCategoryChart"></canvas></div>`:'<div class="empty">Sem despesas no período.</div>'}</section><section class="card span6"><h2>Planejado × realizado</h2>${planCompare()}</section><section class="card span12"><h2>Fluxo mensal — ${FILTERS.year}</h2><div class="chartbox"><canvas id="reportTrendChart"></canvas></div></section></div>`)}

function planCompare(){const p=selectedPlan();if(!p)return '<div class="empty">Cadastre o planejamento do mês para comparar.</div>';const map={"Gastos Fixos":'fixed_expenses',"Investimentos":'investments',"Conforto":'comfort',"Metas":'goals',"Lazer":'leisure',"Conhecimento":'knowledge'};const tx=periodTx(true).filter(t=>['despesa','investimento'].includes(t.transaction_type));const rows=CATEGORY_ORDER.map(cat=>{const planned=Number(p[map[cat]]||0),actual=tx.filter(t=>topCategoryName(t.category)===cat).reduce((a,t)=>a+Number(t.amount),0),exec=planned?actual/planned*100:0;return {cat,planned,actual,exec}});const planned=rows.reduce((a,x)=>a+x.planned,0),actual=rows.reduce((a,x)=>a+x.actual,0),exec=planned?actual/planned*100:0;return `<div class="statline"><span>Planejado</span><strong>${money(planned)}</strong></div><div class="statline"><span>Realizado</span><strong>${money(actual)}</strong></div><div class="statline"><span>Execução</span><strong>${pct(exec)}</strong></div><div class="bar"><i style="width:${Math.min(100,exec)}%"></i></div><div class="tablewrap" style="margin-top:12px"><table class="compare-table"><thead><tr><th>Categoria</th><th>Planejado</th><th>Realizado</th><th>Execução</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="cat-name"><i class="dot" style="background:${categoryColor(x.cat)}"></i>${esc(x.cat)}</span></td><td>${money(x.planned)}</td><td>${money(x.actual)}</td><td>${x.planned?pct(x.exec):'—'}</td></tr>`).join('')}</tbody></table></div>`}

function render(){nav();let html=TAB==='dashboard'?dashboard():TAB==='transactions'?transactions():TAB==='planning'?planning():TAB==='accounts'?accounts():TAB==='cards'?cards():TAB==='categories'?categories():TAB==='goals'?goals():TAB==='recurring'?recurring():TAB==='wealth'?wealth():reports();$('view').innerHTML=html;bindPeriodFilters();if(TAB==='transactions'){refreshTx();$('txSearch').oninput=refreshTx;$('txType').onchange=refreshTx;$('txCategory').onchange=refreshTx}drawCharts()}
function bindPeriodFilters(){[['dashYear','dashMonth'],['txYear','txMonth'],['planYear','planMonth'],['repYear','repMonth']].forEach(([y,m])=>{const ys=$(y),ms=$(m);if(ys){ys.innerHTML=yearOptions(FILTERS.year);ys.value=FILTERS.year;ys.onchange=()=>{FILTERS.year=Number(ys.value);render()}}if(ms){ms.value=FILTERS.month;ms.onchange=()=>{FILTERS.month=Number(ms.value);render()}}})}
function drawCharts(){
 if(TAB==='dashboard'){
  const tx=periodTx(true),by={};tx.filter(t=>t.transaction_type==='despesa').forEach(t=>by[t.category]=(by[t.category]||0)+Number(t.amount));const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);if(entries.length)makeChart('dashCategoryChart','bar',{labels:entries.map(x=>x[0]),datasets:[{label:'Despesas',data:entries.map(x=>x[1]),backgroundColor:entries.map(x=>categoryColor(x[0])),borderRadius:6}]},{plugins:{legend:{display:false}}});
  const labels=MONTHS_PT.map((_,i)=>i+1),income=[],expense=[],investment=[];labels.forEach(m=>{const t=DATA.transactions.filter(x=>String(x.transaction_date).slice(0,7)===ymKey(FILTERS.year,m)&&x.status==='realizado');income.push(t.filter(x=>x.transaction_type==='receita').reduce((a,x)=>a+Number(x.amount),0));expense.push(t.filter(x=>x.transaction_type==='despesa').reduce((a,x)=>a+Number(x.amount),0));investment.push(t.filter(x=>x.transaction_type==='investimento').reduce((a,x)=>a+Number(x.amount),0))});makeChart('dashTrendChart','line',{labels:MONTHS_PT.map(x=>x.slice(0,3)),datasets:[{label:'Receitas',data:income,borderColor:'#c9a227',backgroundColor:'rgba(201,162,39,.12)',tension:.3},{label:'Despesas',data:expense,borderColor:'#d89595',backgroundColor:'rgba(216,149,149,.08)',tension:.3},{label:'Investimentos',data:investment,borderColor:'#93aa83',backgroundColor:'rgba(147,170,131,.08)',tension:.3}]});
 }
 if(TAB==='planning'){const p=selectedPlan()||{},s=strategyForPlan(p),data=[s.vals.fixed_expenses,s.vals.investments,s.vals.comfort,s.vals.goals,s.vals.leisure,s.vals.knowledge];makeChart('planChart','bar',{labels:CATEGORY_ORDER,datasets:[{label:'Valor planejado',data,backgroundColor:data.map((_,i)=>categoryColor(CATEGORY_ORDER[i])),borderRadius:6}]},{plugins:{legend:{display:false}}})}
 if(TAB==='reports'){const tx=periodTx(true),by={};tx.filter(t=>t.transaction_type==='despesa').forEach(t=>by[t.category]=(by[t.category]||0)+Number(t.amount));const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);if(entries.length)makeChart('reportCategoryChart','bar',{labels:entries.map(x=>x[0]),datasets:[{label:'Despesas',data:entries.map(x=>x[1]),backgroundColor:entries.map(x=>categoryColor(x[0])),borderRadius:6}]},{indexAxis:'y',plugins:{legend:{display:false}}});const inc=[],exp=[];for(let m=1;m<=12;m++){const t=DATA.transactions.filter(x=>String(x.transaction_date).slice(0,7)===ymKey(FILTERS.year,m)&&x.status==='realizado');inc.push(t.filter(x=>x.transaction_type==='receita').reduce((a,x)=>a+Number(x.amount),0));exp.push(t.filter(x=>x.transaction_type==='despesa').reduce((a,x)=>a+Number(x.amount),0))}makeChart('reportTrendChart','line',{labels:MONTHS_PT.map(x=>x.slice(0,3)),datasets:[{label:'Receitas',data:inc,borderColor:'#c9a227',tension:.3},{label:'Despesas',data:exp,borderColor:'#d89595',tension:.3}]})}
}

async function reload(){await load();await materializeRecurring();await load();render()}
async function deleteRow(table,id){if(!confirm('Excluir este registro?'))return;const row=(DATA[table]||[]).find(x=>x.id===id);if(['categories','accounts','cards'].includes(table)&&row){let blockers=[];if(table==='categories'){const n=normName(row.name);const childCount=DATA.categories.filter(c=>c.id!==id&&normName(c.parent)===n).length;const txCount=DATA.transactions.filter(t=>normName(t.category)===n).length;const recCount=DATA.recurring.filter(r=>normName(r.category)===n).length;if(childCount||txCount||recCount)blockers.push(`${childCount} subcategoria(s), ${txCount} lançamento(s) e ${recCount} recorrência(s)`)}if(table==='accounts'){const txCount=DATA.transactions.filter(t=>t.account_id===id).length;const recCount=DATA.recurring.filter(r=>r.account_id===id).length;if(txCount||recCount)blockers.push(`${txCount} lançamento(s) e ${recCount} recorrência(s)`)}if(table==='cards'){const txCount=DATA.transactions.filter(t=>t.card_id===id).length;const recCount=DATA.recurring.filter(r=>r.card_id===id).length;if(txCount||recCount)blockers.push(`${txCount} lançamento(s) e ${recCount} recorrência(s)`)}if(blockers.length){toast('Não é possível excluir: existem registros vinculados ('+blockers.join('; ')+').');return}}const r=await sb.from(table).delete().eq('id',id).eq('user_id',USER.id);if(r.error){toast(r.error.message);return}await reload();toast('Registro excluído.')}
window.openTransaction=openTransaction;window.openAccount=openAccount;window.openCard=openCard;window.openCategory=openCategory;window.openGoal=openGoal;window.openRecurring=openRecurring;window.toggleRecurring=toggleRecurring;window.openAsset=openAsset;window.openLiability=openLiability;window.deleteRow=deleteRow;
$('loginForm').onsubmit=async e=>{e.preventDefault();$('authMsg').textContent='Entrando...';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').textContent=error.message;return}USER=data.user;await start()};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authMsg').textContent='Preencha e-mail e senha.';return}const {data,error}=await sb.auth.signUp({email,password});if(error){$('authMsg').textContent=error.message;return}$('authMsg').textContent=data.session?'Conta criada.':'Conta criada. Confirme o e-mail para entrar.';if(data.session){USER=data.user;await start()}};
$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authMsg').textContent='Digite seu e-mail.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});$('authMsg').textContent=error?error.message:'Link enviado para seu e-mail.'};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=async()=>{try{await reload();toast('Dados atualizados.')}catch(e){toast(e.message)}};$('print').onclick=()=>window.print();
async function start(){try{await load();await materializeRecurring();await load();const td=localToday();if(!availableYears().includes(FILTERS.year))FILTERS.year=td.year;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=USER.email||'';render()}catch(e){$('authMsg').textContent='Erro ao carregar seus dados: '+e.message;console.error(e)}}
(async()=>{const {data}=await sb.auth.getSession();if(data.session){USER=data.session.user;await start()}})();
</script></body></html>
