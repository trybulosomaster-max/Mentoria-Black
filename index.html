(function(){
'use strict';


const V56KEY=()=>`mb_v50_reserve_${USER?.id||'local'}`;
const LEDGERKEY=()=>`mb_v56_reserve_ledger_${USER?.id||'local'}`;
const readS=()=>{try{return JSON.parse(localStorage.getItem(V56KEY())||'{}')||{}}catch{return {}}};
const saveS=s=>{try{localStorage.setItem(V56KEY(),JSON.stringify(s||{}))}catch{}};
const readL=()=>{try{const x=JSON.parse(localStorage.getItem(LEDGERKEY())||'[]');return Array.isArray(x)?x:[]}catch{return []}};
const saveL=x=>{try{localStorage.setItem(LEDGERKEY(),JSON.stringify(x||[]))}catch{}};
const num=x=>Number.isFinite(Number(x))?Number(x):0;
const clamp=(x,a=0,b=100)=>Math.min(b,Math.max(a,num(x)));
const escV=x=>typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const moneyV=x=>typeof money==='function'?money(x):`R$ ${num(x).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
const pctV=x=>typeof pct==='function'?pct(x):`${num(x).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}%`;

function migrateReserveGoals(){
  const s=readS();
  const done=Array.isArray(s.v56MigratedGoalIds)?s.v56MigratedGoalIds:[];
  const goals=Array.isArray(DATA?.goals)?DATA.goals:[];
  const matches=goals.filter(g=>/reserva|emerg[eê]ncia|caixinha/i.test(String(g.name||'')) && !done.includes(g.id));
  if(!matches.length) return;
  const ledger=readL();
  matches.forEach(g=>{
    const current=num(g.current);
    if(current>0){
      ledger.push({id:`migrated-${g.id}`,date:new Date().toISOString().slice(0,10),description:'Saldo migrado da antiga Meta de Reserva de Emergência',amount:current,type:'aporte',source:'migration'});
    }
    done.push(g.id);
  });
  saveL(ledger); saveS({...s,v56MigratedGoalIds:done});
}

function ledger(){migrateReserveGoals();return readL()}
function reserveCurrent(){return ledger().reduce((a,x)=>a+(x.type==='retirada'?-num(x.amount):num(x.amount)),0)}
function fixedExpenses(){
  const rows=window.periodTx?window.periodTx():periodTx();
  return rows.filter(t=>typeof topCategory==='function'&&topCategory(t.category,t.transaction_type)==='Gastos Fixos'&&['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+num(t.amount),0);
}
function targetInfo(){
  const s=readS();
  const mode=s.targetMode==='custom'?'custom':'fixed';
  const months=Math.max(.5,num(s.months||6));
  const fx=fixedExpenses();
  const custom=Math.max(0,num(s.customTarget));
  const target=mode==='custom'?custom:fx*months;
  return {mode,months,fx,custom,target};
}
function coverage(){const fx=fixedExpenses(),cur=reserveCurrent();return fx>0?cur/fx:0}
function remaining(){return Math.max(0,targetInfo().target-reserveCurrent())}
function progress(){const t=targetInfo().target;return t>0?clamp(reserveCurrent()/t*100):0}
function deadline(){return String(readS().deadline||'')}
function monthlyContribution(){const d=deadline();if(!d)return 0;const end=new Date(d+'T12:00:00');if(Number.isNaN(end.getTime()))return 0;const today=new Date();const months=Math.max(1,(end.getFullYear()-today.getFullYear())*12+(end.getMonth()-today.getMonth()));return remaining()/months}

  </form>`);
  const f=$('v56ReserveLaunchForm'),m=$('v56LaunchMsg');
  f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const amount=typeof parseMoney==='function'?parseMoney(fd.get('amount')):num(fd.get('amount'));if(!amount||amount<=0){m.textContent='Informe um valor maior que zero.';return}const x={id:'r-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),date:fd.get('date')||new Date().toISOString().slice(0,10),description:fd.get('description'),amount,type:fd.get('type')||'aporte',source:'user'};const arr=readL();arr.push(x);saveL(arr);closeModal();render();toast('Lançamento da reserva salvo.')};
}
window.openV56ReserveLaunch=openReserveLaunch;

/* Reserva: média dos 6 meses completos anteriores ao período selecionado */
(function(){
  'use strict';
  

  const n58=x=>Number.isFinite(Number(x))?Number(x):0;
  const money58=x=>typeof money==='function'?money(x):`R$ ${n58(x).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const pct58=x=>typeof pct==='function'?pct(x):`${n58(x).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}%`;
  const esc58=x=>typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function selectedYM58(){
    return {
      y:Number(FILTERS?.year)||new Date().getFullYear(),
      m:Number(FILTERS?.month)||new Date().getMonth()+1
    };
  }

  function previousMonth58(y,m,offset){
    const d=new Date(y,m-1-offset,1);
    return {y:d.getFullYear(),m:d.getMonth()+1};
  }

  function monthKey58(y,m){
    return `${y}-${String(m).padStart(2,'0')}`;
  }

  function fixedForMonth58(y,m){
    const key=monthKey58(y,m);
    const rows=(Array.isArray(DATA?.transactions)?DATA.transactions:[]).map(normalizeTransaction);
    return rows
      .filter(t=>MBFinance.period(t).key===key&&!isCancelled(t))
      .filter(t=>typeof topCategory==='function' && topCategory(t.category,t.transaction_type)==='Gastos Fixos')
      .filter(t=>isExpense(t)||isInvestment(t))
      .reduce((sum,t)=>sum+t.amount,0);
  }

  function fixedAverage58(){
    const {y,m}=selectedYM58();
    let total=0;
    for(let i=1;i<=6;i++){
      const p=previousMonth58(y,m,i);
      total+=fixedForMonth58(p.y,p.m);
    }
    return total/6;
  }

  window.MB_V58_FIXED_AVERAGE=fixedAverage58;

  const oldReserveCurrent=window.MB_V56_RESERVE_CURRENT;

  function settings58(){
    try{
      return JSON.parse(localStorage.getItem(`mb_v50_reserve_${USER?.id||'local'}`)||'{}')||{};
    }catch{return {}}
  }

  function current58(){
    return typeof oldReserveCurrent==='function'?n58(oldReserveCurrent()):0;
  }

  function targetInfo58(){
    const s=settings58();
    const mode=s.targetMode==='custom'?'custom':'fixed';
    const months=Math.max(.5,n58(s.months||6));
    const fx=fixedAverage58();
    const custom=Math.max(0,n58(s.customTarget));
    const target=mode==='custom'?custom:fx*months;
    return {mode,months,fx,custom,target};
  }

  function coverage58(){
    const fx=fixedAverage58(),cur=current58();
    return fx>0?cur/fx:0;
  }

  function progress58(){
    const t=targetInfo58().target;
    return t>0?Math.min(100,Math.max(0,current58()/t*100)):0;
  }

  function remaining58(){
    return Math.max(0,targetInfo58().target-current58());
  }

  function deadline58(){
    return String(settings58().deadline||'');
  }

  function monthlyContribution58(){
    const d=deadline58();
    if(!d)return 0;
    const end=new Date(d+'T12:00:00');
    if(Number.isNaN(end.getTime()))return 0;
    const today=new Date();
    const months=Math.max(1,(end.getFullYear()-today.getFullYear())*12+(end.getMonth()-today.getMonth()));
    return remaining58()/months;
  }

  window.MB_V58_TARGET_INFO=targetInfo58;
  window.MB_V58_FIXED_EXPENSES=fixedAverage58;
  window.MB_V56_TARGET_INFO=targetInfo58;
  window.MB_V56_RESERVE_COVERAGE=coverage58;
  window.MB_V56_RESERVE_PROGRESS=progress58;

  const previousHealth=window.MB_V50_HEALTH;
  window.MB_V50_HEALTH=function(){
    const base=typeof previousHealth==='function'?previousHealth():{};
    const t=targetInfo58(),cur=current58(),cov=coverage58();
    const reserveScore=t.target>0?Math.min(100,Math.max(0,cur/t.target*100)):0;
    const h={
      ...base,
      cov,
      mt:t.mode==='fixed'?t.months:(t.fx>0?t.target/t.fx:0),
      fixed:t.fx,
      reserveScore
    };
    h.score=Math.round(Math.min(100,Math.max(0,
      n58(h.budgetScore)*.25+
      n58(h.investScore)*.25+
      reserveScore*.20+
      n58(h.commitmentScore)*.15+
      n58(h.goalScore)*.15
    )));
    h.label=h.score<40?'Crítica':h.score<60?'Atenção':h.score<75?'Regular':h.score<90?'Boa':'Excelente';
    return h;
  };

  function reservePage58(){
    const t=targetInfo58(),cur=current58(),falta=remaining58(),prog=progress58(),cov=coverage58(),d=deadline58(),aporte=monthlyContribution58();
    const periodText=(typeof selectedKey==='function'&&typeof monthLabelKey==='function')?monthLabelKey(selectedKey()):'';
    const yh=typeof yearOptions==='function'?yearOptions():`<option>${FILTERS.year}</option>`;
    const mh=typeof monthOptions==='function'?monthOptions():`<option>${MONTHS[FILTERS.month-1]}</option>`;
    const k=(a,b,c)=>typeof kpi==='function'?kpi(a,b,c):`<div class="kpi"><div class="lab">${a}</div><div class="val">${b}</div><div class="sub">${c}</div></div>`;
    const entries=typeof ledger==='function'?ledger().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))):[];
    const rows=entries.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${entries.map(x=>`<tr><td>${x.date?new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${esc58(x.description)}</td><td>${x.type==='retirada'?'Retirada':'Aporte'}</td><td>${x.type==='retirada'?'− ':''}${money58(x.amount)}</td><td><div class="actions"><button class="btn" onclick="editV56ReserveLaunch('${x.id}')">Editar</button><button class="btn danger" onclick="deleteV56ReserveLaunch('${x.id}')">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum lançamento na reserva. Use “＋ Lançamento” para adicionar.</div>`;
    const targetLabel=t.mode==='custom'?'meta personalizada':`${t.months} ${t.months===1?'mês':'meses'} de cobertura`;
    return pageHead('Reserva de Emergência','Acompanhamento completo da sua reserva.',`<button class="btn" onclick="openV50Reserve()">Configurar</button><button class="btn gold" onclick="openV56ReserveLaunch()">＋ Lançamento</button>`)+
      `<div class="filters"><div class="filter"><label>Ano</label><select id="v56ReserveYear">${yh}</select></div><div class="filter"><label>Mês</label><select id="v56ReserveMonth">${mh}</select></div><div class="filter"><label>Período</label><div class="tag">${periodText}</div></div></div>
      <div class="kpis">${k('Reserva atual',money58(cur),'valor acumulado / disponível')}${k('Gastos Fixos',money58(t.fx),t.mode==='fixed'?'média dos 6 meses completos anteriores':'referência mensal')}${k('Meta',money58(t.target),targetLabel)}${k('Falta',money58(falta),'para atingir a meta')}${k('Cobertura',cov.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' meses','cobertura atual')}${k('Progresso',pct58(prog),'da meta')}</div>
      <div class="grid"><section class="card s8"><h2>Reserva de emergência</h2><div class="desc">Os lançamentos desta página formam exclusivamente o saldo da sua reserva.</div><div style="font-size:38px;font-weight:900;margin:16px 0">${money58(cur)}</div><div class="statline"><span>Cobertura</span><strong>${cov.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})} meses</strong></div><div class="bar"><i style="width:${Math.min(100,prog)}%;background:var(--gold)"></i></div><div class="statline"><span>Progresso</span><strong>${pct58(prog)}</strong></div><div class="statline"><span>Gastos Fixos mensais</span><strong>${money58(t.fx)}</strong></div><div class="small muted" style="margin-top:8px">Base calculada pela média dos 6 meses completos anteriores ao período selecionado.</div><div class="statline"><span>Meta em dinheiro</span><strong>${money58(t.target)}</strong></div>${t.mode==='custom'?`<div class="statline"><span>Equivalência da meta</span><strong>${t.fx>0?(t.target/t.fx).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}):'0,0'} meses</strong></div>`:''}<div class="statline"><span>Falta</span><strong>${money58(falta)}</strong></div>${d?`<div class="small muted" style="margin-top:10px">Prazo desejado: ${new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}${aporte?` • aporte aproximado: ${money58(aporte)}/mês`:''}</div>`:''}</section>
      <section class="card s4"><h2>Como a reserva é calculada</h2><div class="desc">${t.mode==='custom'?'A meta foi definida diretamente por você.':'A meta considera a média dos Gastos Fixos dos 6 meses completos anteriores ao período selecionado.'}</div><div class="notice" style="line-height:1.6">${t.mode==='custom'?`Sua meta personalizada é de <b>${money58(t.target)}</b>. Isso equivale a aproximadamente <b>${t.fx>0?(t.target/t.fx).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}):'0,0'} meses</b> da média mensal de Gastos Fixos.`:`Com média de <b>${money58(t.fx)}</b> de Gastos Fixos mensais e uma meta de <b>${t.months} ${t.months===1?'mês':'meses'}</b>, sua reserva necessária é de <b>${money58(t.target)}</b>. O mês selecionado não entra na média.`}</div><button class="btn gold" style="margin-top:12px" onclick="openV50Reserve()">Configurar meta</button></section></div>
      <section class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><div><h2>Lançamentos da reserva</h2><div class="desc">Apenas os lançamentos desta seção alteram o saldo da Reserva de Emergência.</div></div><button class="btn gold" onclick="openV56ReserveLaunch()">＋ Lançamento</button></div>${rows}</section>`;
  }

  window.MB_V56_RESERVE_PAGE=reservePage58;


  document.title='Mentoria Black — Gestão Financeira V58';
  const footer=document.querySelector('.footer');

    }
    if(!existing.has('health-v53')){
      const b=document.createElement('button');
      b.className='btn '+(TAB==='health-v53'?'active':'');
      b.dataset.tab='health-v53';
      b.textContent='Saúde Financeira';
      b.onclick=()=>{TAB='health-v53';render()};
      const reserve=navEl.querySelector('[data-tab="reserve-v52"]');
      if(reserve && reserve.nextSibling) navEl.insertBefore(b,reserve.nextSibling);
      else navEl.appendChild(b);
    }
  }

  function setupPeriodControls60(yearId,monthId){
    const y=document.getElementById(yearId),m=document.getElementById(monthId);
    if(y) y.onchange=()=>{FILTERS.year=Number(y.value);render()};
    if(m) m.onchange=()=>{FILTERS.month=Number(m.value);render()};
  }

  window.nav = function(){
    if(typeof window.__MB_BASE_NAV60__==='function') window.__MB_BASE_NAV60__();
    installNavigation60();
    const active=TAB;
    document.querySelectorAll('#nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));
  };

  window.__MB_BASE_NAV60__ = function(){
    const tabs=[['dashboard','Dashboard'],['transactions','Lançamentos'],['planning','Planejamento'],['accounts','Contas'],['cards','Cartões'],['categories','Categorias'],['goals','Metas'],['recurring','Recorrências'],['wealth','Patrimônio'],['reports','Relatórios']];
    const navEl=document.getElementById('nav');
    if(!navEl) return;
    navEl.innerHTML=tabs.map(([id,label])=>`<button class="btn ${TAB===id?'active':''}" data-tab="${id}">${label}</button>`).join('');
    navEl.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
  };

  window.render = function(){
    if(TAB==='reserve-v52'){
      window.__MB_BASE_NAV60__();
      installNavigation60();
      const view=document.getElementById('view');
      if(view) view.innerHTML = typeof window.MB_V56_RESERVE_PAGE==='function' ? window.MB_V56_RESERVE_PAGE() : '<div class="empty">Reserva de Emergência indisponível.</div>';
      setupPeriodControls60('v56ReserveYear','v56ReserveMonth');
      return;
    }
    if(TAB==='health-v53'){
      window.__MB_BASE_NAV60__();
      installNavigation60();
      const view=document.getElementById('view');
      if(view) view.innerHTML = typeof window.MB_V53_HEALTH_PAGE==='function' ? window.MB_V53_HEALTH_PAGE() : '<div class="empty">Saúde Financeira indisponível.</div>';
      setupPeriodControls60('v53HealthYear','v53HealthMonth');
      return;
    }
    if(typeof baseRender60==='function') baseRender60();
  };

  function dashboardGoalsSummary(){
    if(!window.MBGoals||!window.MBGoalsV82)return '';
    const statusMap={completed:['Meta alcançada','goal-status-completed'],ahead:['Adiantada','goal-status-ahead'],on_track:['No ritmo','goal-status-track'],behind:['Atrasada','goal-status-behind'],no_forecast:['Sem previsão','goal-status-forecast']};
    const current=new Date(), now=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`;
    const all=window.MBGoalsV82.projectGoalsForView(DATA.goals||[],DATA.transactions||[],DATA.recurring||[],{now});
    const active=all.filter(goal=>!goal.isCompleted);
    const completed=all.filter(goal=>goal.isCompleted);
    const rank=goal=>goal.status==='behind'?0:goal.deadline?1:goal.status==='on_track'?2:3;
    active.sort((a,b)=>rank(a)-rank(b)||String(a.deadline||'9999-12-31').localeCompare(String(b.deadline||'9999-12-31')));
    const dateLabel=value=>value?new Date(value+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'numeric'}):null;
    const row=goal=>{
      const [status,statusClass]=statusMap[goal.status]||statusMap.no_forecast;
      const when=goal.estimatedCompletionDate?`previsão: ${dateLabel(goal.estimatedCompletionDate)}`:goal.deadline?`prazo: ${dateLabel(goal.deadline)}`:'sem prazo';
      return `<div class="dashboard-goal-row"><div class="name">${esc(goal.goal.name||'Meta sem nome')}</div><div class="copy">Realizado: ${money(goal.realizedTotal)} / ${money(goal.target)} • ${pct(goal.progressRealPct)}</div><div class="copy">Cobertura prevista: ${money(goal.projectedCovered)} • ${pct(goal.progressProjectedPct)}</div><div class="small muted">Programado: ${money(goal.programmed)} • Projetado: ${money(goal.projected)} • Falta: ${money(goal.remainingReal)}</div><div class="meta"><span class="tag ${statusClass}">${status}</span><span>${when}</span></div></div>`;
    };
    const budget=window.MBGoals.budget();
    const budgetText=budget.goalBudgetStatus==='sufficient'?'Seu orçamento comporta as metas atuais.':budget.goalBudgetStatus==='insufficient'?`Faltam ${money(Math.abs(budget.goalBudgetGap))}/mês para financiar as metas nos prazos definidos.`:'Defina o orçamento de Metas no Planejamento.';
    const rows=active.slice(0,3).map(row).join('')||'<div class="empty" style="min-height:90px">Nenhuma meta em andamento.</div>';
    const completedLine=completed.length?`<div class="dashboard-goals-completed">✓ Meta${completed.length>1?'s':''} alcançada${completed.length>1?'s':''}: ${completed.slice(0,2).map(goal=>esc(goal.goal.name||'Meta')).join(' • ')}</div>`:'';
    return `<section class="card s6"><div class="row" style="justify-content:space-between"><div><h2>Metas</h2><div class="desc">Progresso automático dos objetivos mais relevantes.</div></div><button class="btn" onclick="TAB='goals';render()">Ver todas as metas</button></div><div class="dashboard-goals">${rows}</div>${completedLine}<div class="dashboard-goals-budget"><div class="statline"><span>Orçamento mensal</span><strong>${money(budget.budgetForGoals)}</strong></div><div class="statline"><span>Necessidade mensal</span><strong>${money(budget.requiredForActiveGoals)}</strong></div><div class="statline"><span>Diferença</span><strong>${money(budget.goalBudgetGap)}</strong></div><div class="small muted" style="margin-top:9px">${budgetText}</div></div></section>`;
  }

  function dashboardPlanningSummary(){
    if(!window.MBPlanningV82||typeof window.MBPlanningV82.projectPlanningPeriod!=='function')return '';
    const current=new Date(),now=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`;
    const projection=window.MBPlanningV82.projectPlanningPeriod(
      typeof monthlyPlan==='function'?monthlyPlan():null,
      DATA.transactions||[],DATA.recurring||[],
      {year:FILTERS.year,month:FILTERS.month,now}
    );
    const movement=(bucket,category)=>category==='Investimentos'?Number(bucket.investment||0):Number(bucket.consumptionByCategory?.[category]||0);
    const planned=category=>category==='Investimentos'?Number(projection.planned.investment||0):Number(projection.planned.consumptionByCategory?.[category]||0);
    const line=(label,value)=>`<div class="statline"><span>${label}</span><strong>${money(value)}</strong></div>`;
    const rows=(Array.isArray(CAT_ORDER)?CAT_ORDER:[]).map(category=>`<tr><td><span class="dot" style="background:${typeof categoryColor==='function'?categoryColor(category):'var(--gold)'}"></span>${esc(category)}</td><td>${money(planned(category))}</td><td>${money(movement(projection.realized,category))}</td><td>${money(movement(projection.scheduledMaterialized,category))}</td><td>${money(movement(projection.projectedVirtual,category))}</td><td>${money(movement(projection.forecast,category))}</td></tr>`).join('');
    const notice=!projection.period.planFound?'<div class="notice">Sem planejamento cadastrado neste mês; os movimentos canônicos continuam disponíveis.</div>':projection.unclassified.length?`<div class="notice">${projection.unclassified.length} lançamento(s) sem classificação canônica foram excluídos dos valores.</div>`:'';
    const totalSection=`<section class="card s6 dashboard-planning-v82"><h2>Planejamento do mês</h2><div class="desc"><b>Realizado</b> já ocorreu • <b>Programado</b> está persistido • <b>Projetado</b> é virtual • <b>Previsão</b> = Programado + Projetado.</div>${notice}${line('Planejado',projection.planned.totalOut)}${line('Realizado',projection.realized.totalOut)}${line('Programado',projection.scheduledMaterialized.totalOut)}${line('Projetado',projection.projectedVirtual.totalOut)}${line('Previsão',projection.forecast.totalOut)}</section>`;
    const investmentSection=`<section class="card s6 v60-invest-card"><h2>Investimentos</h2><div class="desc">Acompanhamento separado das despesas de consumo.</div>${line('Planejado',projection.planned.investment)}${line('Realizado',projection.realized.investment)}${line('Programado',projection.scheduledMaterialized.investment)}${line('Projetado',projection.projectedVirtual.investment)}${line('Previsão',projection.forecast.investment)}</section>`;
    const categorySection=`<section class="card s12 dashboard-planning-categories-v82"><h2>Planejamento por envelope</h2><div class="tablewrap"><table><thead><tr><th>Envelope</th><th>Planejado</th><th>Realizado</th><th>Programado</th><th>Projetado</th><th>Previsão</th></tr></thead><tbody><tr><td><span class="dot" style="background:var(--ok)"></span>Receitas</td><td>${money(projection.planned.revenue)}</td><td>${money(projection.realized.income)}</td><td>${money(projection.scheduledMaterialized.income)}</td><td>${money(projection.projectedVirtual.income)}</td><td>${money(projection.forecast.income)}</td></tr>${rows}<tr><td><strong>Total de saídas</strong></td><td><strong>${money(projection.planned.totalOut)}</strong></td><td><strong>${money(projection.realized.totalOut)}</strong></td><td><strong>${money(projection.scheduledMaterialized.totalOut)}</strong></td><td><strong>${money(projection.projectedVirtual.totalOut)}</strong></td><td><strong>${money(projection.forecast.totalOut)}</strong></td></tr></tbody></table></div></section>`;
    return totalSection+investmentSection+categorySection;
  }

  window.dashboard = function(){
    let html = typeof baseDashboard60==='function' ? baseDashboard60() : '';

    // A Dashboard não contém cards de Saúde Financeira, Reserva detalhada ou Inteligência Black.
    html = html.replace(/<section class="card s6 v50-reserve-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s6 v50-health-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s12 v50-ai-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s4 v50-reserve-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s4"><h2>Reserva de emergência<\/h2>[\s\S]*?<\/section>/g,'');

    // KPIs únicos e coerentes com a regra financeira consolidada.
    const ts = typeof periodTx==='function' ? periodTx() : [];
    const total = typeof totals==='function' ? totals(ts) : {income:0,expense:0,invest:0,balance:0};
    const now=new Date().toISOString().slice(0,10);
    const financial=window.MBDashboardFinancialV82?.projectDashboardPeriod(DATA.transactions||[],DATA.recurring||[],{year:FILTERS.year,month:FILTERS.month,now});
    const reserve = typeof window.MB_V56_RESERVE_CURRENT==='function' ? window.MB_V56_RESERVE_CURRENT() : 0;
    const patrimonio = typeof netWorth==='function' ? netWorth() : 0;
    const kpiBlock = html.match(/<div class="kpis">[\s\S]*?(?=<div class="grid">)/);
    if(kpiBlock){
      const realized=financial?.realized||{income:total.income,consumptionExpense:total.expense,investment:total.invest,availableBalance:total.balance};const forecast=financial?.forecast||{};
      const replacement=`<div class="kpis">${kpi('Receitas',money(realized.income),'realizado')}${kpi('Despesas',money(realized.consumptionExpense),'consumo realizado')}${kpi('Saldo',money(realized.availableBalance),realized.availableBalance>=0?'realizado':'atenção')}${kpi('Investimentos',money(realized.investment),'realizado')}${kpi('Reserva de Emergência',money(reserve),'valor acumulado / disponível')}${kpi('Patrimônio Líquido',money(patrimonio),'estimativa atual')}</div>${financial?`<section class="card s12 dashboard-financial-v82"><div class="desc">Previsão separada: Programado + Projetado; não compõe o saldo realizado.</div><div class="statline"><span>Programado</span><strong>${money(financial.scheduled.availableBalanceEffect)}</strong></div><div class="statline"><span>Projetado</span><strong>${money(financial.projected.availableBalanceEffect)}</strong></div><div class="statline"><span>Previsão</span><strong>${money(forecast.availableBalanceEffect)}</strong></div></section>`:''}`;
      html=html.replace(kpiBlock[0],replacement);
    }

    // Evolução anual das receitas — única implementação final.
    if(!html.includes('v15RevenueYear')){
      const revenueCard=`<section class="card s12"><div class="row" style="justify-content:space-between"><div><h2>Evolução das receitas</h2><div class="desc">Receitas previstas + realizadas em cada mês de ${FILTERS.year}. Canceladas são excluídas.</div></div><strong class="positive">${money(typeof revenueYear==='function'?revenueYear(FILTERS.year).reduce((a,b)=>a+b,0):0)}</strong></div><div class="chartbox"><canvas id="v15RevenueYear"></canvas></div></section>`;
      const anchor='<section class="card s6"><h2>Cartões de crédito</h2>';
      if(html.includes(anchor)) html=html.replace(anchor,revenueCard+anchor);
      else html=html.replace('<div class="grid">','<div class="grid">'+revenueCard);
    }

    if(!html.includes('dashboard-goals')){
      const goalsSection=dashboardGoalsSummary();
      const anchor='<section class="card s6"><h2>Cartões de crédito</h2>';
      if(goalsSection&&html.includes(anchor)) html=html.replace(anchor,goalsSection+anchor);
      else if(goalsSection) html=html.replace('<div class="grid">','<div class="grid">'+goalsSection);
    }

    // Planejamento V82: um único motor compartilhado com a página Planejamento.
    const planningSection=dashboardPlanningSummary();
    const planningAnchor='<section class="card s12"><h2>Últimos lançamentos do período</h2>';
    if(planningSection&&html.includes(planningAnchor)) html=html.replace(planningAnchor,planningSection+planningAnchor);
    else if(planningSection) html=html.replace('<div class="grid">','<div class="grid">'+planningSection);
    return html;
  };

  document.title='Mentoria Black — Gestão Financeira V81 ESCUDO FINAL';
  const footer=document.querySelector('.footer');
  if(footer) footer.textContent='Mentoria Black — Gestão Financeira V81 ESCUDO FINAL';
})();

</script>
