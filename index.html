<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mentoria Black — Gestão Financeira V11</title>
<style>
:root{color-scheme:dark;--gold:#d7a93a;--bg:#070707;--text:#f4f4f4}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#v11-loader{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#15120a 0,#070707 48%,#050505 100%);padding:24px;box-sizing:border-box}
.v11-loading{text-align:center;width:min(520px,100%)}
.v11-loading .mb-logo{width:145px;height:145px;margin:auto;display:block}
.v11-loading h1{font-family:Georgia,"Times New Roman",serif;color:#d7a93a;letter-spacing:.08em;margin:10px 0 3px;font-size:28px}
.v11-loading p{margin:0;color:#999;font-size:12px;letter-spacing:.18em}.v11-bar{width:170px;height:3px;background:#222;border-radius:99px;margin:20px auto 0;overflow:hidden}.v11-bar i{display:block;height:100%;width:45%;background:#d7a93a;animation:v11load 1.15s ease-in-out infinite}@keyframes v11load{0%{transform:translateX(-130%)}100%{transform:translateX(430%)}}
</style>
</head>
<body>
<div id="v11-loader"><div class="v11-loading">
<svg class="mb-logo" viewBox="0 0 240 240" role="img" aria-label="Mentoria Black">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7218"/><stop offset=".42" stop-color="#f5cf62"/><stop offset=".72" stop-color="#c49324"/><stop offset="1" stop-color="#ffe18a"/></linearGradient></defs>
<path d="M83 57c-7-13-17-21-29-25 5 13 12 23 24 30-11-1-22 4-29 13 14-1 25-5 34-13" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
<path d="M157 57c7-13 17-21 29-25-5 13-12 23-24 30 11-1 22 4 29 13-14-1-25-5-34-13" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
<circle cx="120" cy="119" r="66" fill="none" stroke="url(#g)" stroke-width="3"/>
<path d="M77 57 86 30l17 18 17-32 17 32 17-18 9 27H77Z" fill="url(#g)"/>
<path d="M69 151c-17 8-27 20-31 34 15-3 28-10 37-21M171 151c17 8 27 20 31 34-15-3-28-10-37-21" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
<text x="120" y="140" text-anchor="middle" fill="url(#g)" font-family="Georgia,Times New Roman,serif" font-size="68" font-weight="700" letter-spacing="-5">MB</text>
</svg>
<h1>MENTORIA BLACK</h1><p>GESTÃO FINANCEIRA • V11</p><div class="v11-bar"><i></i></div>
</div></div>
<script>
const BASE="https://raw.githubusercontent.com/trybulosomaster-max/Mentoria-Black/35ffc3bcef4835c03cc8cfcb966867dd6b634f8a/index.html";
const BRAND=String.raw`<div class="v11-brand"><svg class="v11-brand-mark" viewBox="0 0 240 240" role="img" aria-label="Mentoria Black"><defs><linearGradient id="v11g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7218"/><stop offset=".42" stop-color="#f5cf62"/><stop offset=".72" stop-color="#c49324"/><stop offset="1" stop-color="#ffe18a"/></linearGradient></defs><circle cx="120" cy="119" r="66" fill="none" stroke="url(#v11g)" stroke-width="3"/><path d="M77 57 86 30l17 18 17-32 17 32 17-18 9 27H77Z" fill="url(#v11g)"/><text x="120" y="140" text-anchor="middle" fill="url(#v11g)" font-family="Georgia,Times New Roman,serif" font-size="68" font-weight="700" letter-spacing="-5">MB</text><path d="M69 151c-17 8-27 20-31 34 15-3 28-10 37-21M171 151c17 8 27 20 31 34-15-3-28-10-37-21" fill="none" stroke="url(#v11g)" stroke-width="3" stroke-linecap="round"/></svg><div><div class="v11-brand-title">MENTORIA BLACK</div><div class="v11-brand-sub"><i></i>GESTÃO FINANCEIRA<i></i></div></div></div>`;
const CSS=String.raw`<style>
.v11-brand{display:flex;align-items:center;gap:10px}.v11-brand-mark{width:58px;height:58px;display:block;flex:0 0 58px}.v11-brand-title{font:700 24px Georgia,"Times New Roman",serif;letter-spacing:.055em;color:#d7a93a;line-height:1}.v11-brand-sub{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:9px;letter-spacing:.2em;color:#eee}.v11-brand-sub i{display:block;width:22px;height:1px;background:#d7a93a}@media(max-width:600px){.v11-brand-mark{width:50px;height:50px;flex-basis:50px}.v11-brand-title{font-size:18px}.v11-brand-sub{font-size:8px;gap:7px;letter-spacing:.15em}.v11-brand-sub i{width:16px}}
.v11-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99999;background:#151515;border:1px solid #5a4818;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px #000;color:#fff;max-width:min(92vw,520px);font-size:14px;line-height:1.35}.v11-toast b{color:#f2cb58}.v11-invalid{border-color:#b94b4b!important;box-shadow:0 0 0 1px #b94b4b!important}.v11-required-note{color:#d88989!important;font-size:12px;margin-top:5px}.v11-money-preview{color:#999;font-size:12px;margin-top:5px}.v11-hidden{display:none!important}
</style>`;
function brl(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0)}
function parseMoney(v){if(typeof v==='number')return v;let s=String(v??'').trim().replace(/R\$/gi,'').replace(/\s/g,'');if(!s)return 0;let neg=s.startsWith('-');s=s.replace(/-/g,'');if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}else if(/\.\d{1,2}$/.test(s)){}else if(s.includes('.')){s=s.replace(/\./g,'')}let n=Number(s);return neg?-n:n}
function toast(msg){let old=document.querySelector('.v11-toast');if(old)old.remove();let d=document.createElement('div');d.className='v11-toast';d.innerHTML=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
function labelFor(el){let p=el.closest('label');if(p)return p.innerText.trim();let id=el.id;if(id){let l=document.querySelector('label[for="'+CSS.escape(id)+'"]');if(l)return l.innerText.trim()}let prev=el.parentElement?.previousElementSibling;return prev?.innerText?.trim()||''}
function isReceipt(form){let sel=form.querySelector('select');let text=[...form.querySelectorAll('select')].map(x=>x.value).join(' ').toLowerCase();return text.includes('receita')||text.includes('income')}
function findMoneyInputs(){return [...document.querySelectorAll('input')].filter(i=>/valor|total|lançamento|compra|parcela|amount|value/i.test((i.name||'')+' '+(i.id||'')+' '+labelFor(i)))}
function setupMoney(){findMoneyInputs().forEach(i=>{if(i.dataset.v11Money)return;i.dataset.v11Money='1';i.inputMode='decimal';i.addEventListener('blur',()=>{let n=parseMoney(i.value);if(i.value.trim())i.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})});i.addEventListener('focus',()=>{let n=parseMoney(i.value);if(n)i.value=String(n).replace('.',',')})})}
function setupValidation(){document.addEventListener('click',e=>{let b=e.target.closest('button,input[type=submit]');if(!b)return;let form=b.closest('form');if(!form)return;setTimeout(()=>{
  let bad=[];let receipt=isReceipt(form);
  form.querySelectorAll('input,select,textarea').forEach(el=>{if(el.disabled||el.type==='hidden'||el.type==='button'||el.type==='submit')return;let required=el.required;if(!required){let l=labelFor(el);required=/categoria|conta|cartão|cartao|descrição|descricao|valor total|valor por/i.test(l)&&!(/subcategoria|observação|observacao|repetir até|forma de pagamento/i.test(l));}if(receipt&&/categoria/i.test(labelFor(el)))required=false;if(required&&!String(el.value||'').trim())bad.push(labelFor(el)||el.name||'campo obrigatório');});
  if(bad.length){e.preventDefault();e.stopImmediatePropagation();bad.slice(0,8).forEach(x=>{let el=[...form.querySelectorAll('input,select,textarea')].find(y=>(labelFor(y)||y.name||'')===x);if(el)el.classList.add('v11-invalid')});toast('<b>Não foi possível salvar.</b><br>Preencha: '+bad.slice(0,6).join(', ')+(bad.length>6?' e outros campos obrigatórios.':''));return false;}
 },0)},true)}
function patchReceiptCategory(){document.querySelectorAll('form').forEach(f=>{if(f.dataset.v11Receipt)return;f.dataset.v11Receipt='1';let selects=[...f.querySelectorAll('select')];let type=selects.find(s=>/tipo|type/i.test(labelFor(s)));if(!type)type=selects.find(s=>[...s.options].some(o=>/receita|despesa/i.test(o.text)));if(type)type.addEventListener('change',()=>{if(/receita/i.test(type.value+' '+type.selectedOptions?.[0]?.text))f.querySelectorAll('select').filter(s=>/categoria/i.test(labelFor(s))).forEach(s=>{s.removeAttribute('required')})})})}
function patchDateRefresh(){let last='';setInterval(()=>{let vals=[...document.querySelectorAll('select')].filter(s=>/^(ano|mês|mes)$/i.test(labelFor(s))).map(s=>s.value).join('|');if(vals&&vals!==last){if(last){sessionStorage.setItem('v11_period_changed','1');location.reload()}last=vals}},1500)}
function patchBrand(){let target=document.querySelector('.top-brand');if(!target)return;let old=target.querySelector('.brand-mark');if(old){let holder=document.createElement('div');holder.innerHTML=BRAND;target.insertBefore(holder.firstElementChild,old);old.remove()}else if(!target.querySelector('.v11-brand')){target.insertAdjacentHTML('afterbegin',BRAND)}}
function patchHeader(){document.title='Mentoria Black — Gestão Financeira V11';let h=document.querySelector('#v10-loader');if(h)h.remove();patchBrand()}
function v11(){document.head.insertAdjacentHTML('beforeend',CSS);setupMoney();setupValidation();patchReceiptCategory();patchHeader();setInterval(()=>{setupMoney();patchReceiptCategory();patchBrand()},1000);patchDateRefresh();toast('Mentoria Black <b>V11</b> carregada com correções de estabilidade.');}
fetch(BASE,{cache:'no-store'}).then(r=>r.text()).then(html=>{html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>Mentoria Black — Gestão Financeira V11</title>');html=html.replace('</head>',CSS+'</head>');html=html.replace(/<\/body>/i,'<script>('+v11.toString()+')();<\/script></body>');document.open();document.write(html);document.close()}).catch(err=>{document.querySelector('#v11-loader').innerHTML='<div class="v11-loading"><h1>MENTORIA BLACK</h1><p>Não foi possível carregar a versão anterior.</p></div>';console.error(err)});
</script>
</body></html>
