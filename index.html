<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>Mentoria Black — Gestão Financeira V10</title>
<style>
:root{color-scheme:dark;--gold:#d7a93a;--bg:#070707;--text:#f4f4f4;--muted:#9b9b9b}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#v10-loader{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#15120a 0,#070707 45%,#050505 100%);padding:24px}
.v10-loading{width:min(520px,100%);text-align:center}.v10-loading .logo{width:180px;height:180px;margin:auto;display:block}
.v10-loading h1{font-family:Georgia,"Times New Roman",serif;color:#d7a93a;letter-spacing:.08em;margin:12px 0 4px;font-size:30px}
.v10-loading p{margin:0;color:#999}.v10-loading .bar{width:180px;height:3px;background:#222;border-radius:10px;margin:22px auto 0;overflow:hidden}.v10-loading .bar i{display:block;height:100%;width:45%;background:#d7a93a;animation:v10load 1.2s ease-in-out infinite}
@keyframes v10load{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}
</style>
</head>
<body>
<div id="v10-loader">
  <div class="v10-loading">
    <svg class="logo" viewBox="0 0 220 220" aria-label="Mentoria Black" role="img">
      <defs><linearGradient id="v10gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6412"/><stop offset=".35" stop-color="#f7d66b"/><stop offset=".62" stop-color="#c89a27"/><stop offset="1" stop-color="#ffe28a"/></linearGradient></defs>
      <g fill="none" stroke="url(#v10gold)" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="110" cy="103" r="59" stroke-width="3"/>
        <path d="M70 47 Q110 13 150 47" stroke-width="3"/>
        <path d="M80 41 L80 28 M110 32 L110 12 M140 41 L140 28" stroke-width="3"/>
        <path d="M80 41 Q69 29 58 43 Q67 48 80 54 M140 41 Q151 29 162 43 Q153 48 140 54" stroke-width="2.5"/>
        <path d="M51 116 C34 103 26 111 36 122 C45 132 54 128 61 119 C44 124 36 137 45 145" stroke-width="2.4"/>
        <path d="M169 116 C186 103 194 111 184 122 C175 132 166 128 159 119 C176 124 184 137 175 145" stroke-width="2.4"/>
        <path d="M61 119 C49 98 35 98 30 109 M159 119 C171 98 185 98 190 109" stroke-width="2"/>
        <path d="M72 158 C54 165 48 175 37 177 M148 158 C166 165 172 175 183 177" stroke-width="2"/>
        <path d="M98 161 L110 173 L122 161" stroke-width="2"/>
      </g>
      <path d="M74 47 L82 20 L97 36 L110 8 L123 36 L138 20 L146 47 Z" fill="url(#v10gold)"/>
      <text x="110" y="119" text-anchor="middle" fill="url(#v10gold)" font-family="Georgia,Times New Roman,serif" font-size="64" font-weight="700" letter-spacing="-4">MB</text>
    </svg>
    <h1>MENTORIA BLACK</h1><p>GESTÃO FINANCEIRA • V10</p><div class="bar"><i></i></div>
  </div>
</div>
<script>
const V10_BASE="https://raw.githubusercontent.com/trybulosomaster-max/Mentoria-Black/35ffc3bcef4835c03cc8cfcb966867dd6b634f8a/index.html";
const V10_LOGO=String.raw`<svg class="brand-mark" viewBox="0 0 220 220" aria-label="Logo Mentoria Black" role="img">
<defs><linearGradient id="mbGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6412"/><stop offset=".35" stop-color="#f7d66b"/><stop offset=".62" stop-color="#c89a27"/><stop offset="1" stop-color="#ffe28a"/></linearGradient></defs>
<g fill="none" stroke="url(#mbGold)" stroke-linecap="round" stroke-linejoin="round">
<circle cx="110" cy="103" r="59" stroke-width="3"/>
<path d="M70 47 Q110 13 150 47" stroke-width="3"/>
<path d="M80 41 L80 28 M110 32 L110 12 M140 41 L140 28" stroke-width="3"/>
<path d="M80 41 Q69 29 58 43 Q67 48 80 54 M140 41 Q151 29 162 43 Q153 48 140 54" stroke-width="2.5"/>
<path d="M51 116 C34 103 26 111 36 122 C45 132 54 128 61 119 C44 124 36 137 45 145" stroke-width="2.4"/>
<path d="M169 116 C186 103 194 111 184 122 C175 132 166 128 159 119 C176 124 184 137 175 145" stroke-width="2.4"/>
<path d="M61 119 C49 98 35 98 30 109 M159 119 C171 98 185 98 190 109" stroke-width="2"/>
<path d="M72 158 C54 165 48 175 37 177 M148 158 C166 165 172 175 183 177" stroke-width="2"/>
<path d="M98 161 L110 173 L122 161" stroke-width="2"/>
</g>
<path d="M74 47 L82 20 L97 36 L110 8 L123 36 L138 20 L146 47 Z" fill="url(#mbGold)"/>
<text x="110" y="119" text-anchor="middle" fill="url(#mbGold)" font-family="Georgia,Times New Roman,serif" font-size="64" font-weight="700" letter-spacing="-4">MB</text>
</svg>`;

const V10_CSS=String.raw`
/* V10 visual layer */
:root{--gold:#d7a93a;--gold2:#f2cb58;--panel:#0d0d0d}
.brand-mark{width:64px;height:64px;flex:0 0 64px;display:block;filter:drop-shadow(0 0 5px rgba(215,169,58,.12))}
.brand-copy .brand-title{font-family:Georgia,"Times New Roman",serif;color:#d7a93a;font-weight:700;letter-spacing:.055em}
.brand-copy .brand-sub{color:#f0f0f0}
.top-brand .brand-copy .brand-title{font-size:25px}
.v10-badge{display:inline-flex;align-items:center;justify-content:center;border:1px solid #5a4818;color:#d7a93a;border-radius:999px;padding:3px 8px;font-size:9px;letter-spacing:.12em;margin-left:8px;vertical-align:middle}
.v10-section-note{color:#888;font-size:11px;line-height:1.45}
.chart-note{color:#8d8d8d}
.category-legend .cat-item{border-color:#242424}
.category-legend .cat-item strong{white-space:nowrap}
.card-credit-row{padding:10px 0;border-bottom:1px solid #202020}
.card-credit-row:last-child{border-bottom:0}
.card-credit-meta{display:flex;justify-content:space-between;gap:12px;align-items:center}
.card-credit-bar{height:6px;background:#242424;border-radius:99px;overflow:hidden;margin-top:7px}
.card-credit-bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.installment-preview{font-size:13px}
.installment-chip{display:inline-block;border:1px solid #3a3a3a;border-radius:999px;padding:4px 8px;margin:3px 4px 3px 0;color:#eee}
.plan-health{padding:10px 12px;border:1px solid #252525;border-radius:9px;background:#0a0a0a;margin-top:10px}
.plan-health.ok{border-color:#31522f}.plan-health.warn{border-color:#5a4818}
@media(max-width:600px){
 .brand-mark{width:50px;height:50px;flex-basis:50px}
 .top-brand .brand-copy .brand-title{font-size:18px;letter-spacing:.04em}
 .brand-copy .brand-sub{font-size:8px;letter-spacing:.12em}
 .brand-copy .brand-sub:before,.brand-copy .brand-sub:after{width:18px}
}
@media print{.v10-badge{display:none}}
`;

function patchBase(html){
  let out=html;
  out=out.replace(/<title>[\s\S]*?<\/title>/i,'<title>Mentoria Black — Gestão Financeira V10</title>');
  out=out.replace(/<svg class="brand-mark"[\s\S]*?<\/svg>/gi,V10_LOGO);
  out=out.replace('</head>',`<style>${V10_CSS}</style></head>`);
  const patch=String.raw`
<script>
/* MENTORIA BLACK V10 — camada de estabilidade e acabamento */
(function(){
  const DEFAULT_COLORS={
    "Gastos Fixos":"#c98a2e","Investimentos":"#d7a93a","Conforto":"#6f8fb8",
    "Metas":"#7d9b68","Lazer":"#b56a78","Conhecimento":"#8b75ad"
  };
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  const safe=c=>/^#[0-9a-f]{6}$/i.test(String(c||''))?c:'#d7a93a';
  const stdName=n=>Object.keys(DEFAULT_COLORS).find(k=>norm(k)===norm(n))||n;

  /* Consistência de cores: categoria cadastrada ganha prioridade; padrão só entra como fallback. */
  window.categoryColor=function(name){
    const top=typeof topCategoryName==='function'?topCategoryName(name):name;
    const found=(window.DATA?.categories||[]).find(c=>!c.parent&&norm(c.name)===norm(top))
      ||(window.DATA?.categories||[]).find(c=>norm(c.name)===norm(top));
    return safe(found?.color||DEFAULT_COLORS[stdName(top)]||'#d7a93a');
  };

  /* Evita colisão entre recorrências com mesma descrição/valor/data. */
  window.materializeRecurring=async function(){
    if(!window.DATA||!window.USER||!window.sb)return;
    const today=typeof localToday==='function'?localToday().date:new Date().toISOString().slice(0,10);
    for(const r of (DATA.recurring||[]).filter(x=>x.active&&x.auto_post)){
      let next=r.next_date,guard=0;
      while(next&&next<=today&&guard<120){
        if(r.end_date&&next>r.end_date){
          await sb.from('recurring').update({active:false}).eq('id',r.id).eq('user_id',USER.id);
          break;
        }
        const marker='[recorrencia:'+r.id+']';
        const exists=(DATA.transactions||[]).some(t=>{
          const note=String(t.note||'');
          const sameMarker=note.includes(marker);
          const legacy=!sameMarker && t.transaction_date===next && t.description===r.name &&
            norm(t.category)===norm(r.category) && Number(t.amount)===Number(r.amount);
          return sameMarker||legacy;
        });
        if(!exists){
          const row={
            user_id:USER.id,transaction_date:next,description:r.name,category:r.category,
            subcategory:r.subcategory||null,amount:Number(r.amount||0),transaction_type:r.type,
            status:'realizado',payment_method:r.card_id?'Cartão de crédito':'Conta',
            account_id:r.account_id||null,card_id:r.card_id||null,
            note:(r.note?String(r.note)+' ':'')+marker
          };
          const ins=await sb.from('transactions').insert(row);
          if(ins.error)break;
        }
        next=typeof recurrenceNextDate==='function'?recurrenceNextDate(next,r.frequency,r.interval||1):next;
        guard++;
      }
      if(next!==r.next_date)await sb.from('recurring').update({next_date:next}).eq('id',r.id).eq('user_id',USER.id);
    }
  };

  /* Gráfico profissional: barras + valor + percentual acima de cada barra, usando a cor da categoria. */
  window.directLabelPlugin=function(total){
    return {id:'v10DirectLabels',afterDatasetsDraw(chart){
      const ds=chart.data.datasets?.[0],meta=chart.getDatasetMeta(0);if(!ds||!meta)return;
      const values=ds.data.map(Number),sum=Number(total)||values.reduce((a,b)=>a+b,0);
      const ctx=chart.ctx,vertical=chart.options.indexAxis!=='y';ctx.save();
      meta.data.forEach((bar,i)=>{
        const v=values[i]||0;if(!v)return;const p=sum?v/sum*100:0;
        ctx.textAlign=vertical?'center':'left';ctx.textBaseline='bottom';
        ctx.font='700 10px Inter,system-ui,sans-serif';ctx.fillStyle='#f2f2f2';
        if(vertical){
          const x=bar.x,y=Math.max(20,bar.y-25);
          ctx.fillText(money(v),x,y);
          ctx.font='600 9px Inter,system-ui,sans-serif';ctx.fillStyle='#9c9c9c';ctx.fillText(pct(p),x,y-12);
        }else{
          const x=Math.min(chart.chartArea.right-2,bar.x+8),y=bar.y+4;
          ctx.fillText(money(v),x,y);
          ctx.font='600 9px Inter,system-ui,sans-serif';ctx.fillStyle='#9c9c9c';ctx.fillText(pct(p),x,y+12);
        }
      });ctx.restore();
    }};
  };
  window.makeBar=function(id,entries,horizontal=false){
    const labels=entries.map(x=>x[0]),values=entries.map(x=>Number(x[1])||0),total=values.reduce((a,b)=>a+b,0);
    if(window.CHARTS?.[id]){try{CHARTS[id].destroy()}catch(e){}delete CHARTS[id]}
    const el=document.getElementById(id);if(!el||!window.Chart)return;
    const max=Math.max(...values,0);
    CHARTS[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{
      label:'Despesas',data:values,backgroundColor:labels.map(window.categoryColor),
      borderColor:labels.map(window.categoryColor),borderWidth:1,borderRadius:7,borderSkipped:false
    }]},plugins:[directLabelPlugin(total)],options:{
      responsive:true,maintainAspectRatio:false,indexAxis:horizontal?'y':'x',
      layout:{padding:{top:verticalPad(horizontal),right:horizontal?90:10,left:8,bottom:8}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.raw)+' — '+pct(total?c.raw/total*100:0)}}},
      scales:{
        x:{beginAtZero:true,ticks:{color:'#999',maxRotation:horizontal?0:28,minRotation:horizontal?0:18},grid:{color:'#222'},suggestedMax:horizontal?undefined:max*1.2},
        y:{beginAtZero:true,ticks:{color:'#999',callback:v=>money(v)},grid:{color:'#222'},suggestedMax:horizontal?max*1.25:undefined}
      }
    }});
  };
  function verticalPad(horizontal){return horizontal?10:42}

  /* Planejamento: validação visual de 100% e cores iguais às categorias. */
  const oldPlanning=window.planning;
  if(typeof oldPlanning==='function'){
    window.planning=function(){
      const html=oldPlanning();
      return html.replace(/<\/section>\s*<section class="card span6"><h2>Planejamento mensal<\/h2>/,
        '</section><section class="card span6"><h2>Planejamento mensal</h2>');
    };
  }

  /* Indicador de versão sem poluir o cabeçalho. */
  function addVersionBadge(){
    const title=document.querySelector('.top-brand .brand-title');
    if(title&&!title.querySelector('.v10-badge'))title.insertAdjacentHTML('beforeend','<span class="v10-badge">V10</span>');
  }

  /* Correção de usabilidade: o campo de mês de parcelamento tem fallback textual quando o browser não suporta type=month. */
  function normalizeMonthInput(){
    const el=document.getElementById('startPaymentMonth');
    if(!el)return;
    if(el.type==='text'){
      el.placeholder='AAAA-MM';
      el.pattern='[0-9]{4}-[0-9]{2}';
      el.inputMode='numeric';
    }
  }

  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){
      oldRender();
      addVersionBadge();
      normalizeMonthInput();
    };
  }

  /* Evita uma tela branca se o CDN do Chart.js cair: a aplicação continua funcional sem os gráficos. */
  window.addEventListener('error',function(e){
    if(/Chart|chart\.umd/i.test(String(e?.message||'')))console.warn('V10: gráfico indisponível; demais funções permanecem ativas.');
  });

  /* Pequena auditoria de campos após abertura de modal. */
  const obs=new MutationObserver(()=>{addVersionBadge();normalizeMonthInput()});
  obs.observe(document.body,{subtree:true,childList:true});

  /* Limpeza visual final do logo antigo e identificação da V10. */
  document.documentElement.dataset.mbVersion='10';
})();
<\/script>`;
  out=out.replace(/<\/body>\s*<\/html>\s*$/i,patch+'</body></html>');
  return out;
}

async function boot(){
  const loader=document.getElementById('v10-loader');
  try{
    let html='';
    try{
      const r=await fetch(V10_BASE,{cache:'no-store',mode:'cors'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      html=await r.text();
      try{localStorage.setItem('mb_v10_base',html)}catch(e){}
    }catch(networkError){
      html=localStorage.getItem('mb_v10_base')||'';
      if(!html)throw new Error('Não foi possível carregar a base da aplicação: '+networkError.message);
    }
    const patched=patchBase(html);
    document.open();document.write(patched);document.close();
  }catch(err){
    loader.innerHTML='<div class="v10-loading"><h1>MENTORIA BLACK</h1><p>V10 não conseguiu carregar a base da aplicação.</p><p style="margin-top:10px;font-size:12px;color:#777">Verifique sua conexão e recarregue a página.</p></div>';
    console.error(err);
  }
}
boot();
</script>
</body>
</html>
