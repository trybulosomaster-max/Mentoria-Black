/* Saúde Financeira e configuração da Reserva — núcleo consolidado */
(function(){
  'use strict';
  

  const KEY=()=>`mb_v50_reserve_${USER?.id||'local'}`;
  const readSettings=()=>{
    try{return JSON.parse(localStorage.getItem(KEY())||'{}')||{}}catch{return {}}
  };
  const saveSettings=s=>{try{localStorage.setItem(KEY(),JSON.stringify(s||{}))}catch{}};
  const safe=n=>Number.isFinite(Number(n))?Number(n):0;
  const clamp=(n,a=0,b=100)=>Math.min(b,Math.max(a,safe(n)));
  const fixedExpenses=()=>{
    const rows=window.periodTx?window.periodTx():periodTx();
    return rows.filter(t=>topCategory(t.category,t.transaction_type)==='Gastos Fixos' && ['despesa','investimento'].includes(t.transaction_type))
      .reduce((a,t)=>a+safe(t.amount),0);
  };
  const reserve=()=>window.reserveInfo?window.reserveInfo():{current:0,target:0,pct:0};
  const monthsTarget=()=>{
    const s=readSettings();
    const n=s.months==null?6:Number(s.months);
    return Number.isFinite(n)&&n>0?n:6;
  };
  const reserveTargetValue=()=>fixedExpenses()*monthsTarget();
  const coverage=()=>{
    const fx=fixedExpenses(), cur=safe(reserve().current);
    return fx>0?cur/fx:0;
  };
  const progress=()=>{
    const target=reserveTargetValue(),cur=safe(reserve().current);
    return target>0?clamp(cur/target*100):0;
  };
  const deadline=()=>readSettings().deadline||'';
  const remaining=()=>Math.max(0,reserveTargetValue()-safe(reserve().current));
  const monthlyContribution=()=>{
    const d=deadline();
    if(!d)return 0;
    const today=new Date();
    const end=new Date(d+'T12:00:00');
    const months=Math.max(1,(end.getFullYear()-today.getFullYear())*12+(end.getMonth()-today.getMonth()));
    return remaining()/months;
  };

  function health(){
    const p=monthlyPlan()||{};
    const rows=window.periodTx?window.periodTx():periodTx();
    const t=window.totals?window.totals(rows):totals(rows);
    const planned=Number(p.revenue||0);
    const plannedOut=['fixed_expenses','investments','comfort','goals','leisure','knowledge']
      .reduce((a,k)=>a+safe(p[k]),0);
    const actualOut=t.expense+t.invest;
    const budgetScore=plannedOut>0?clamp((1-Math.max(0,actualOut-plannedOut)/plannedOut)*100):
      (t.balance>=0?75:35);
    const investScore=planned&&safe(t.invest)>0?clamp(t.invest/planned*100):
      (t.invest>0?70:40);
    const cov=coverage(), mt=monthsTarget();
    const reserveScore=mt>0?clamp(cov/mt*100):0;
    const fixed=fixedExpenses();
    const commitmentScore=plannedOut>0?clamp((1-Math.max(0,fixed-plannedOut*.55)/Math.max(1,plannedOut*.55))*100):65;
    const goalRows=(DATA.goals||[]).filter(g=>!(/reserva|emerg[eê]ncia|caixinha/i.test(String(g.name||''))));
    const goalScore=goalRows.length?clamp(goalRows.reduce((a,g)=>a+(safe(g.target)>0?clamp(safe(g.current)/safe(g.target)*100):100),0)/goalRows.length):70;
    const score=Math.round(clamp(budgetScore*.25+investScore*.25+reserveScore*.20+commitmentScore*.15+goalScore*.15));
    let label=score<40?'Crítica':score<60?'Atenção':score<75?'Regular':score<90?'Boa':'Excelente';
    return {score,label,budgetScore,investScore,reserveScore,commitmentScore,goalScore,cov,mt,fixed,t};
  }

  function analysisText(h){
    const strengths=[];
    if(h.budgetScore>=75) strengths.push('Você mantém bom controle do orçamento.');
    if(h.investScore>=75) strengths.push('Sua construção patrimonial está avançando bem.');
    if(h.goalScore>=75) strengths.push('Suas metas cadastradas estão evoluindo de forma consistente.');
    if(!strengths.length) strengths.push('O principal ganho agora é organizar a margem mensal e fortalecer a previsibilidade.');

    let attention='';
    if(h.cov<h.mt) attention=`Seu principal ponto de atenção é a reserva de emergência: ela cobre ${h.cov.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})} meses dos seus Gastos Fixos, enquanto sua meta é ${h.mt.toLocaleString('pt-BR',{maximumFractionDigits:1})} meses.`;
    else if(h.budgetScore<60) attention='Seu principal ponto de atenção é o controle do orçamento deste período.';
    else if(h.investScore<60) attention='Seu principal ponto de atenção é aumentar a constância dos investimentos.';
    else attention='Sua estrutura financeira está equilibrada; o próximo passo é manter a consistência e continuar aumentando sua margem de segurança.';

    const next=h.cov<h.mt
      ? `Faltam ${money(remaining())} para atingir a meta da reserva.`
      : 'Sua meta de reserva já foi atingida; mantenha esse colchão protegido.';
    return `${strengths.join(' ')} ${attention} ${next}`;
  }

  function reserveModal(){
    const s=readSettings(), m=monthsTarget(), d=deadline();
    modal('Reserva de emergência',`<form id="v50ReserveForm">
      <div class="notice">A cobertura é calculada exclusivamente com base nos <b>Gastos Fixos</b>. A meta de meses é definida por você.</div>
      <div class="formgrid" style="margin-top:12px">
        <div><label>Meta da reserva (meses)</label><input name="months" type="number" min="1" step="0.5" value="${m}"></div>
        <div><label>Prazo desejado</label><input name="deadline" type="date" value="${esc(d)}"></div>
      </div>
      <div class="small muted" style="margin-top:10px">Sugestão inicial: 6 meses. Você pode escolher 3, 6, 9, 12 ou qualquer valor personalizado.</div>
      <div id="v50ReservePreview" class="preview"></div>
      <div id="v50ReserveMsg" class="msg"></div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar meta</button></div>
    </form>`);
    const form=$('v50ReserveForm'), preview=$('v50ReservePreview');
    const update=()=>{
      const mm=Math.max(.5,Number(form.months.value)||6), fx=fixedExpenses(), target=fx*mm, cur=safe(reserve().current), falta=Math.max(0,target-cur);
      preview.innerHTML=`<div class="statline"><span>Gastos Fixos mensais</span><strong>${money(fx)}</strong></div><div class="statline"><span>Meta em dinheiro</span><strong>${money(target)}</strong></div><div class="statline"><span>Reserva atual</span><strong>${money(cur)}</strong></div><div class="statline"><span>Falta</span><strong>${money(falta)}</strong></div>`;
    };
    form.months.oninput=update; update();
    form.onsubmit=e=>{e.preventDefault();const mm=Math.max(.5,Number(form.months.value)||6);saveSettings({months:mm,deadline:form.deadline.value||''});closeModal();render();toast('Meta da reserva atualizada.')};
  }

  window.openV50Reserve=reserveModal;
  window.MB_V50_HEALTH=health;


  window.openV50Analysis=function(){
    const h=typeof window.MB_V50_HEALTH==='function'?window.MB_V50_HEALTH():health(),metric=value=>value===null||value===undefined?'Sem dados suficientes':`${Math.round(value)}/100`,score=h.score===null?'Sem avaliação':`${h.score}/100`,target=window.MB_V56_RESERVE_TARGET?.()||reserveTargetValue(),current=window.MB_V56_RESERVE_CURRENT?.()||0;
    modal('Análise financeira',`<section class="card" style="background:#0d0d0d"><div class="row" style="justify-content:space-between"><div><div class="small muted">SAÚDE FINANCEIRA</div><div style="font-size:42px;font-weight:900;margin:4px 0">${score}</div></div><span class="tag ${h.score!==null&&h.score>=75?'ok':'warn'}">${h.label}</span></div><div class="notice" style="margin-top:12px;line-height:1.7">${esc(h.message||analysisText(h))}</div><h3 style="margin:18px 0 8px">Indicadores</h3><ul style="line-height:1.8;color:#ddd"><li>Controle do orçamento: ${metric(h.budgetScore)}</li><li>Investimentos: ${metric(h.investScore)}</li><li>Metas: ${metric(h.goalScore)}</li></ul><h3 style="margin:18px 0 8px">Reserva</h3><div class="statline"><span>Cobertura</span><strong>${Number(h.cov||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})} meses</strong></div><div class="statline"><span>Meta</span><strong>${h.mt} meses</strong></div><div class="statline"><span>Gastos Fixos</span><strong>${money(h.fixed)}/mês</strong></div><div class="statline"><span>Valor necessário</span><strong>${money(target)}</strong></div><div class="statline"><span>Falta</span><strong>${money(Math.max(0,target-current))}</strong></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Fechar</button></div></section>`);
  };

  const style=document.createElement('style');
  style.id='mb-v50-style';
  style.textContent=`.v50-reserve-card,.v50-health-card{min-height:100%}.v50-ai-card .notice{font-size:13px}.v50-health-card .bar,.v50-reserve-card .bar{margin-top:10px}`;
  document.head.appendChild(style);
  
})();




/* Página independente de Saúde Financeira */
/* ================= MENTORIA BLACK V52 =================
   BASE: V50
   ESCOPO EXCLUSIVO:
   - NÃO altera nenhum quadro existente da Dashboard.
   - Corrige o reconhecimento de "Gastos Fixos" para a camada da V50.
   - Adiciona uma aba própria "Reserva de Emergência".
   - Nenhuma outra área/regra é alterada.
*/
(function(){
  'use strict';
  

  const normV52 = s => String(s ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();

  const safeV52 = n => Number.isFinite(Number(n)) ? Number(n) : 0;

  /* CORREÇÃO PONTUAL
     A V50 compara a categoria exatamente como "Gastos Fixos".
     Normalizamos apenas o retorno de topCategory para que
     "Gastos fixos"/acentuação não resulte em R$ 0,00. */


  function v52PeriodRows(){
    try{
      if(typeof window.periodTx === 'function') return window.periodTx();
      if(typeof periodTx === 'function') return periodTx();
    }catch(e){}
    return [];
  }

  function v52FixedExpenses(){
    return v52PeriodRows()
      .filter(t =>
        normV52(window.topCategory?.(t.category) ?? t.category) === 'gastos fixos' &&
        ['despesa','investimento'].includes(String(t.transaction_type || '').toLowerCase())
      )
      .reduce((sum,t)=>sum + safeV52(t.amount),0);
  }

  function v52Settings(){
    try{
      const id = (window.USER && window.USER.id) || (typeof USER !== 'undefined' && USER ? USER.id : 'local');
      return JSON.parse(localStorage.getItem(`mb_v50_reserve_${id}`) || '{}') || {};
    }catch(e){ return {}; }
  }

  function v52Months(){
    const n = safeV52(v52Settings().months);
    return n > 0 ? n : 6;
  }

  function v52ReserveCurrent(){
    try{
      if(typeof window.reserveInfo === 'function') return safeV52(window.reserveInfo().current);
      if(typeof reserveInfo === 'function') return safeV52(reserveInfo().current);
    }catch(e){}
    return 0;
  }

  function v52Target(){
    return v52FixedExpenses() * v52Months();
  }

  function v52Coverage(){
    const fx = v52FixedExpenses();
    return fx > 0 ? v52ReserveCurrent()/fx : 0;
  }

  function v52Remaining(){
    return Math.max(0, v52Target() - v52ReserveCurrent());
  }

  function v52Pct(){
    const target = v52Target();
    return target > 0 ? Math.min(100, v52ReserveCurrent()/target*100) : 0;
  }

  function v52Deadline(){
    return String(v52Settings().deadline || '');
  }

  function v52MonthlyContribution(){
    const deadline = v52Deadline();
    if(!deadline) return 0;
    const today = new Date();
    const end = new Date(deadline + 'T12:00:00');
    if(Number.isNaN(end.getTime()) || end <= today) return v52Remaining();

    const months = Math.max(
      1,
      (end.getFullYear()-today.getFullYear())*12 +
      (end.getMonth()-today.getMonth())
    );
    return v52Remaining()/months;
  }

  function v52ReservePage(){
    const fx = v52FixedExpenses();
    const current = v52ReserveCurrent();
    const months = v52Months();
    const target = v52Target();
    const falta = v52Remaining();
    const coverage = v52Coverage();
    const progress = v52Pct();
    const deadline = v52Deadline();
    const aporte = v52MonthlyContribution();

    const periodText =
      (typeof selectedKey === 'function' && typeof monthLabelKey === 'function')
        ? monthLabelKey(selectedKey())
        : '';

    const yearHtml = typeof yearOptions === 'function'
      ? yearOptions()
      : `<option value="${FILTERS.year}">${FILTERS.year}</option>`;

    const monthHtml = typeof monthOptions === 'function'
      ? monthOptions()
      : `<option value="${FILTERS.month}">${MONTHS[FILTERS.month-1]}</option>`;

    const moneyFn = n => typeof money === 'function'
      ? money(n)
      : `R$ ${safeV52(n).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;

(function(){
'use strict';


const V56KEY=()=>`mb_v50_reserve_${USER?.id||'local'}`;
const LEDGERKEY=()=>`mb_v56_reserve_ledger_${USER?.id||'local'}`;
const readS=()=>{try{return JSON.parse(localStorage.getItem(V56KEY())||'{}')||{}}catch{return {}}};
const saveS=s=>{try{localStorage.setItem(V56KEY(),JSON.stringify(s||{}))}catch{}};
const readL=()=>{try{const x=JSON.parse(localStorage.getItem(LEDGERKEY())||'[]');return Array.isArray(x)?x:[]}catch{return []}};
const saveL=x=>{try{localStorage.setItem(LEDGERKEY(),JSON.stringify(x||[]))}catch{}};
const num=x=>Number.isFinite(Number(x))?Number(x):0;
const clamp=(x,a=0,b=100)=>Math.min(b,Math.max(a,num(x)));
const escV=x=>typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const moneyV=x=>typeof money==='function'?money(x):`R$ ${num(x).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
const pctV=x=>typeof pct==='function'?pct(x):`${num(x).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}%`;

function migrateReserveGoals(){
  const s=readS();
  const done=Array.isArray(s.v56MigratedGoalIds)?s.v56MigratedGoalIds:[];
  const goals=Array.isArray(DATA?.goals)?DATA.goals:[];
  const matches=goals.filter(g=>/reserva|emerg[eê]ncia|caixinha/i.test(String(g.name||'')) && !done.includes(g.id));
  if(!matches.length) return;
  const ledger=readL();
  matches.forEach(g=>{
    const current=num(g.current);
    if(current>0){
      ledger.push({id:`migrated-${g.id}`,date:new Date().toISOString().slice(0,10),description:'Saldo migrado da antiga Meta de Reserva de Emergência',amount:current,type:'aporte',source:'migration'});
    }
    done.push(g.id);
  });
  saveL(ledger); saveS({...s,v56MigratedGoalIds:done});
}

function ledger(){migrateReserveGoals();return readL()}
function reserveCurrent(){return ledger().reduce((a,x)=>a+(x.type==='retirada'?-num(x.amount):num(x.amount)),0)}
function fixedExpenses(){
  const rows=window.periodTx?window.periodTx():periodTx();
  return rows.filter(t=>typeof topCategory==='function'&&topCategory(t.category,t.transaction_type)==='Gastos Fixos'&&['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+num(t.amount),0);
}
function targetInfo(){
  const s=readS();
  const mode=s.targetMode==='custom'?'custom':'fixed';
  const months=Math.max(.5,num(s.months||6));
  const fx=fixedExpenses();
  const custom=Math.max(0,num(s.customTarget));
  const target=mode==='custom'?custom:fx*months;
  return {mode,months,fx,custom,target};
}
function coverage(){const fx=fixedExpenses(),cur=reserveCurrent();return fx>0?cur/fx:0}
function remaining(){return Math.max(0,targetInfo().target-reserveCurrent())}
function progress(){const t=targetInfo().target;return t>0?clamp(reserveCurrent()/t*100):0}
function deadline(){return String(readS().deadline||'')}
function monthlyContribution(){const d=deadline();if(!d)return 0;const end=new Date(d+'T12:00:00');if(Number.isNaN(end.getTime()))return 0;const today=new Date();const months=Math.max(1,(end.getFullYear()-today.getFullYear())*12+(end.getMonth()-today.getMonth()));return remaining()/months}

    <div id="v56CustomFields" class="formgrid" style="margin-top:12px"><div><label>Valor personalizado da reserva</label><input name="customTarget" class="money-field" inputmode="decimal" value="${t.custom?String(t.custom).replace('.',','):''}" placeholder="R$ 0,00"></div><div><label>Prazo desejado</label><input name="deadlineCustom" type="date" value="${escV(d)}"></div></div>

      return;
    }
    if(TAB==='health-v53'){
      window.__MB_BASE_NAV60__();
      installNavigation60();
      const view=document.getElementById('view');
      if(view) view.innerHTML = typeof window.MB_V53_HEALTH_PAGE==='function' ? window.MB_V53_HEALTH_PAGE() : '<div class="empty">Saúde Financeira indisponível.</div>';
      setupPeriodControls60('v53HealthYear','v53HealthMonth');
      return;
    }
    if(typeof baseRender60==='function') baseRender60();
  };

  function dashboardGoalsSummary(){
    if(!window.MBGoalsV82)return '';
    const statusMap={completed:['Meta alcançada','goal-status-completed'],ahead:['Adiantada','goal-status-ahead'],on_track:['No ritmo','goal-status-track'],behind:['Conclusão após o prazo','goal-status-behind'],no_forecast:['Sem previsão de conclusão','goal-status-forecast']};
    const current=new Date(), now=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`;
    const all=window.MBGoalsV82.projectGoalsForView(DATA.goals||[],DATA.transactions||[],DATA.recurring||[],{now});
    const active=all.filter(goal=>!goal.isCompleted);
    const completed=all.filter(goal=>goal.isCompleted);
    const rank=goal=>goal.status==='behind'?0:goal.deadline?1:goal.status==='on_track'?2:3;
    active.sort((a,b)=>rank(a)-rank(b)||String(a.deadline||'9999-12-31').localeCompare(String(b.deadline||'9999-12-31')));
    const dateLabel=value=>value?new Date(value+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',year:'numeric'}):null;
    const row=goal=>{
      const [status,statusClass]=statusMap[goal.status]||statusMap.no_forecast;
      const when=goal.estimatedCompletionDate?`previsão: ${dateLabel(goal.estimatedCompletionDate)}`:goal.deadline?`prazo: ${dateLabel(goal.deadline)}`:'sem prazo';
      return `<div class="dashboard-goal-row"><div class="name">${esc(goal.goal.name||'Meta sem nome')}</div><div class="copy">Realizado: ${money(goal.realizedTotal)} / ${money(goal.target)} • ${pct(goal.progressRealPct)}</div><div class="copy">Cobertura prevista até o prazo: ${money(goal.projectedCovered)} • ${pct(goal.progressProjectedPct)}</div><div class="small muted">Programado: ${money(goal.programmed)} • Projeção adicional: ${money(goal.projected)} • Falta realizar: ${money(goal.remainingReal)}</div><div class="meta"><span class="tag ${statusClass}">${status}</span><span>${when}</span></div></div>`;
    };
    const budget=window.MBGoalsV82.goalBudgetViewModel(all,monthlyPlan()?.goals);
    const budgetText=budget.goalBudgetStatus==='sufficient'?'Seu orçamento comporta as metas atuais.':budget.goalBudgetStatus==='insufficient'?`Faltam ${money(Math.abs(budget.goalBudgetGap))}/mês para financiar as metas nos prazos definidos.`:'Defina o orçamento de Metas no Planejamento.';
    const rows=active.slice(0,3).map(row).join('')||'<div class="empty" style="min-height:90px">Nenhuma meta em andamento.</div>';
    const completedLine=completed.length?`<div class="dashboard-goals-completed">✓ Meta${completed.length>1?'s':''} alcançada${completed.length>1?'s':''}: ${completed.slice(0,2).map(goal=>esc(goal.goal.name||'Meta')).join(' • ')}</div>`:'';
    return `<section class="card s6"><div class="row" style="justify-content:space-between"><div><h2>Metas</h2><div class="desc">Progresso automático dos objetivos mais relevantes.</div></div><button class="btn" onclick="TAB='goals';render()">Ver todas as metas</button></div><div class="dashboard-goals">${rows}</div>${completedLine}<div class="dashboard-goals-budget"><div class="statline"><span>Orçamento mensal</span><strong>${money(budget.budgetForGoals)}</strong></div><div class="statline"><span>Necessidade mensal</span><strong>${money(budget.requiredForActiveGoals)}</strong></div><div class="statline"><span>Diferença</span><strong>${money(budget.goalBudgetGap)}</strong></div><div class="small muted" style="margin-top:9px">${budgetText}</div></div></section>`;
  }

  function dashboardPlanningSummary(){
    if(!window.MBPlanningV82||typeof window.MBPlanningV82.projectPlanningPeriod!=='function')return '';
    const current=new Date(),now=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`;
    const projection=window.MBPlanningV82.projectPlanningPeriod(
      typeof monthlyPlan==='function'?monthlyPlan():null,
      DATA.transactions||[],DATA.recurring||[],
      {year:FILTERS.year,month:FILTERS.month,now,cardPurchaseCreditEffects:DATA.cardPurchaseCreditEffects||[]}
    );
    const line=(label,value)=>`<div class="statline"><span>${label}</span><strong>${money(value)}</strong></div>`;
    const notice=!projection.period.planFound?'<div class="notice">Sem planejamento cadastrado neste mês; os compromissos conhecidos continuam visíveis.</div>':projection.unclassified.length?`<div class="notice">${projection.unclassified.length} lançamento(s) sem categoria reconhecida foram excluídos dos valores.</div>`:'';
    const expectedOut=projection.realized.totalOut+projection.forecast.totalOut;
    const expectedResult=(projection.realized.income-projection.realized.totalOut)+(projection.forecast.income-projection.forecast.totalOut);
    const remaining=projection.planned.totalOut-expectedOut;
    return `<section class="card s12 dashboard-planning-v82"><div class="row" style="justify-content:space-between"><div><h2>Resumo do mês</h2><div class="desc">Realizado separado dos compromissos; Previsão = Programado + Projetado.</div></div><button class="btn" type="button" onclick="TAB='planning';render()">Abrir Planejamento</button></div>${notice}<div class="dashboard-month-summary">${line('Planejado',projection.planned.totalOut)}${line('Realizado',projection.realized.totalOut)}${line('Compromissos conhecidos',projection.forecast.totalOut)}${line('Esperado no mês',expectedOut)}${line('Resultado esperado',expectedResult)}${line(remaining>=0?'Restante esperado':'Excedido esperado',Math.abs(remaining))}</div></section>`;
  }

  window.dashboard = function(){
    let html = typeof baseDashboard60==='function' ? baseDashboard60() : '';

    // A Dashboard não contém cards de Saúde Financeira, Reserva detalhada ou Inteligência Black.
    html = html.replace(/<section class="card s6 v50-reserve-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s6 v50-health-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s12 v50-ai-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s4 v50-reserve-card">[\s\S]*?<\/section>/g,'');
    html = html.replace(/<section class="card s4"><h2>Reserva de emergência<\/h2>[\s\S]*?<\/section>/g,'');

    // KPIs únicos e coerentes com a regra financeira consolidada.
    const ts = typeof periodTx==='function' ? periodTx() : [];
    const total = typeof totals==='function' ? totals(ts) : {income:0,expense:0,invest:0,balance:0};
    const financial=typeof financialPeriodView==='function'?financialPeriodView():null;
    const reserve = typeof window.MB_V56_RESERVE_CURRENT==='function' ? window.MB_V56_RESERVE_CURRENT() : 0;
    const patrimonio = typeof netWorth==='function' ? netWorth() : 0;
    const kpiBlock = html.match(/<div class="kpis">[\s\S]*?(?=<div class="grid">)/);
    if(kpiBlock){
      const realized=financial?.realized||{income:total.income,consumptionExpense:total.expense,investment:total.invest,availableBalanceEffect:total.balance};
      const forecast=financial?.forecast||{income:0,consumptionExpense:0,investment:0,availableBalanceEffect:0};
      const expected=financial?.expected||{income:realized.income,consumptionExpense:realized.consumptionExpense,investment:realized.investment,availableBalanceEffect:realized.availableBalanceEffect};
      const outlookKpi=(label,value,realizedValue,futureValue,tone,style='')=>`<article class="kpi aviora-outlook-kpi ${tone}" ${style}><div class="lab">${label}</div><div class="val">${money(value)}</div><div class="aviora-kpi-breakdown"><span>Realizado <b>${money(realizedValue)}</b></span><span>Previsão <b>${money(futureValue)}</b></span></div></article>`;
      const balanceTone=expected.availableBalanceEffect>0?'aviora-kpi-positive':expected.availableBalanceEffect<0?'aviora-kpi-negative':'aviora-kpi-neutral';
      const replacement=`<div class="kpis aviora-dashboard-kpis">${outlookKpi('Receitas',expected.income,realized.income,forecast.income,'aviora-kpi-income')}${outlookKpi('Despesas',expected.consumptionExpense,realized.consumptionExpense,forecast.consumptionExpense,'aviora-kpi-expense')}${outlookKpi('Resultado do mês',expected.availableBalanceEffect,realized.availableBalanceEffect,forecast.availableBalanceEffect,balanceTone)}${outlookKpi('Investimentos',expected.investment,realized.investment,forecast.investment,'aviora-kpi-investment')}${kpi('Reserva de Emergência',money(reserve),'valor acumulado / disponível')}${kpi('Patrimônio Líquido',money(patrimonio),'estimativa atual')}</div>`;
      html=html.replace(kpiBlock[0],replacement);
    }

    // Evolução anual das receitas — única implementação final.
    if(!html.includes('v15RevenueYear')){
      const revenueCard=`<section class="card s12"><div class="row" style="justify-content:space-between"><div><h2>Evolução das receitas</h2><div class="desc">Receitas previstas + realizadas em cada mês de ${FILTERS.year}. Canceladas são excluídas.</div></div><strong class="positive">${money(typeof revenueYear==='function'?revenueYear(FILTERS.year).reduce((a,b)=>a+b,0):0)}</strong></div><div class="chartbox"><canvas id="v15RevenueYear"></canvas></div></section>`;
      const anchor='<section class="card s6"><h2>Cartões de crédito</h2>';
      if(html.includes(anchor)) html=html.replace(anchor,revenueCard+anchor);
      else html=html.replace('<div class="grid">','<div class="grid">'+revenueCard);
    }

    if(!html.includes('dashboard-goals')){
      const goalsSection=dashboardGoalsSummary();
      const anchor='<section class="card s6"><h2>Cartões de crédito</h2>';
      if(goalsSection&&html.includes(anchor)) html=html.replace(anchor,goalsSection+anchor);
      else if(goalsSection) html=html.replace('<div class="grid">','<div class="grid">'+goalsSection);
    }

    // Planejamento V82: um único motor compartilhado com a página Planejamento.
    const planningSection=dashboardPlanningSummary();
    const planningAnchor='<section class="card s12 dashboard-latest-transactions" data-dashboard-latest><h2>Últimos lançamentos do período</h2>';
    if(planningSection&&html.includes(planningAnchor)) html=html.replace(planningAnchor,planningSection+planningAnchor);
    else if(planningSection) html=html.replace('<div class="grid">','<div class="grid">'+planningSection);
    return html;
  };

  document.title='AVIORA — Gestão Financeira';
  if(window.MBProductionRuntime?.label) document.title=window.MBProductionRuntime.label;
  const footer=document.querySelector('.footer');
  if(footer) footer.textContent=`${window.MBProductionRuntime?.label||'AVIORA — Gestão Financeira'} • dados protegidos por usuário`;
})();

</script>
