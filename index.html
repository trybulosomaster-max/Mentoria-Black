<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.wrap{max-width:1500px;margin:auto;padding:18px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(450px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);text-align:center}.auth-card .brand-full{margin-bottom:12px}.field{text-align:left;margin:13px 0}.field label,label{display:block;color:#aaa;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}input,select,textarea{width:100%;background:#090909;color:var(--text);border:1px solid #373737;border-radius:9px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:80px;resize:vertical}.btn{background:#101010;color:var(--text);border:1px solid #3a3a3a;border-radius:9px;padding:10px 13px}.btn:hover{border-color:var(--gold);color:var(--gold)}.btn.primary,.btn.gold{background:var(--gold);border-color:var(--gold);color:#080808;font-weight:850}.btn.danger{color:#e4a0a0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:11px}.msg{min-height:20px;color:var(--muted);font-size:12px;margin-top:10px}.msg.err{color:#e3a0a0}.msg.ok{color:#a8d1b0}
.brand-full{display:grid;justify-items:center;gap:6px}.brand-full .crest{width:84px;height:84px}.brand-full .title{font:700 30px Georgia,"Times New Roman",serif;letter-spacing:.07em;color:#e0b53f}.brand-full .sub{display:flex;align-items:center;gap:10px;color:#eee;font-size:11px;letter-spacing:.25em;font-weight:650}.brand-full .sub:before,.brand-full .sub:after{content:"";width:55px;height:1px;background:var(--gold)}.header{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:12px}.header .brand-full{grid-template-columns:1fr;grid-template-rows:auto;justify-content:center;justify-items:center;gap:7px;text-align:center;padding:4px 0 8px}.header .crest{grid-row:auto;width:104px;height:104px;justify-self:center}.header .title{font-size:30px;line-height:1.05;text-align:center}.header .sub{justify-content:center}.header .sub:before,.header .sub:after{display:block;width:48px}.header>.row{justify-content:center!important;gap:12px;margin-top:2px!important}.header>.row .muted{width:100%;text-align:center}.header>.row .actions{justify-content:center}
.nav{display:flex;gap:6px;overflow:auto;padding:5px 0 14px}.nav .btn{white-space:nowrap}.nav .active{border-color:var(--gold);color:var(--gold)}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 14px}.filter{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}.filter label{margin-bottom:5px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}.pagehead h1{font-size:27px;margin:0}.pagehead p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpi{background:linear-gradient(145deg,#101010,#0b0b0b);border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.kpi .lab{color:#aaa;text-transform:uppercase;font-size:10px;letter-spacing:.07em}.kpi .val{font-size:22px;font-weight:850;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi .sub{color:var(--muted);font-size:11px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.card h2{font-size:16px;margin:0 0 5px}.card .desc{color:var(--muted);font-size:11px;margin-bottom:10px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px 7px;border-bottom:1px solid #232323;text-align:left;vertical-align:middle}th{color:#999;font-size:10px;text-transform:uppercase;letter-spacing:.06em}td{font-size:12px}.positive{color:#9aca9d}.negative{color:#e2a0a0}.tag{display:inline-block;padding:3px 7px;border:1px solid #3b3b3b;border-radius:99px;font-size:10px;color:#aaa}.tag.ok{color:#9fc7a5;border-color:#3c5b42}.tag.warn{color:#dfb76e;border-color:#5a4927}
.statline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #222}.bar{height:8px;background:#202020;border-radius:99px;overflow:hidden;margin:5px 0 8px}.bar i{display:block;height:100%;border-radius:99px}.empty{min-height:170px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed #303030;border-radius:10px;padding:20px}.chartbox{height:330px;position:relative}.chartbox.small{height:260px}.legend{display:grid;gap:7px;margin-top:10px}.legend-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:100}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0c0c0c;border:1px solid #383838;border-radius:16px;padding:18px;box-shadow:var(--shadow)}.modalbox h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;padding-top:12px;border-top:1px solid #252525}.preview{background:#111;border:1px solid #292929;border-radius:10px;padding:10px;margin-top:10px}.notice{padding:10px;border:1px solid #594a25;background:#18150c;border-radius:9px;color:#e1c978;font-size:12px}.errorbox{padding:10px;border:1px solid #5d3030;background:#1a0f0f;border-radius:9px;color:#e4a0a0;font-size:12px}
.footer{border-top:1px solid var(--line);margin-top:18px;padding:14px 0;color:#666;font-size:10px;text-align:center}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.s8,.s6,.s4{grid-column:span 12}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.wrap{padding:12px}.header .brand-full{grid-template-columns:1fr;grid-template-rows:auto;justify-content:center;justify-items:center;column-gap:0;gap:6px}.header .crest{width:84px;height:84px;grid-row:auto}.header .title{font-size:24px}.header .sub{font-size:9px;letter-spacing:.18em}.header .sub:before,.header .sub:after{display:block;width:28px}.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead{display:block}.pagehead .actions{margin-top:10px}.chartbox{height:280px}.auth-card .brand-full .title{font-size:24px}.auth-card .brand-full .crest{width:72px;height:72px}}

.v18-loading{position:fixed;inset:0;background:#050505;display:grid;place-items:center;z-index:9999}.v18-loading-box{text-align:center;color:#bbb}.v18-spinner{width:28px;height:28px;border:2px solid #333;border-top-color:var(--gold);border-radius:50%;animation:v18spin .7s linear infinite;margin:0 auto 12px}@keyframes v18spin{to{transform:rotate(360deg)}}.btn:disabled{opacity:.55;cursor:not-allowed}</style>

<script>
const SUPABASE_URL="https://mwjqfzbpjmwiscvtxvfc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Bz8zOgsayn5KRDKBa0_u_A_TbvV_RuK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const num=v=>new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0);
const pct=v=>(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const CAT_ORDER=["Gastos Fixos","Investimentos","Conforto","Metas","Lazer","Conhecimento"];
const DEFAULT_COLORS=["#d9ad37","#8e72d9","#4f9ed7","#7dbb72","#e48b3c","#48aaa5"];
let USER=null,TAB="dashboard",CHARTS={};
let DATA={accounts:[],cards:[],categories:[],transactions:[],budgets:[],goals:[],recurring:[],assets:[],liabilities:[],monthly:[],strategy:[],rules:[],imports:[]};
let FILTERS={year:new Date().getFullYear(),month:new Date().getMonth()+1,txType:"",txCategory:"",txMonth:"",search:""};

function toast(msg,err=false){$("toastBox").textContent=msg;$("toastBox").className=err?"errorbox":"notice";$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),3500)}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
$("closeModal").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function ym(y,m){return `${y}-${String(m).padStart(2,"0")}`}
function monthLabelKey(k){if(!k)return "";const [y,m]=k.split("-").map(Number);return `${MONTHS[m-1]} de ${y}`}
function frequencyLabel(v){const x=String(v||"monthly").toLowerCase();return x==="monthly"?"Mensal":x==="weekly"?"Semanal":x==="yearly"?"Anual":x==="daily"?"Diária":x==="biweekly"?"Quinzenal":x}
function yearOptions(selected=FILTERS.year){let s="";for(let y=2000;y<=2100;y++)s+=`<option value="${y}" ${y===Number(selected)?"selected":""}>${y}</option>`;return s}
function monthOptions(selected=FILTERS.month){return MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===Number(selected)?"selected":""}>${m}</option>`).join("")}
function selectedKey(){return ym(FILTERS.year,FILTERS.month)}
function parseMoney(v){
 let s=String(v??"").trim().replace(/\s/g,"").replace(/R\$/gi,"");
 if(!s)return 0;
 s=s.replace(/[^0-9,.\-]/g,"");
 const neg=s.startsWith("-");
 s=s.replace(/-/g,"");
 const commas=(s.match(/,/g)||[]).length, dots=(s.match(/\./g)||[]).length;
 if(commas&&dots){
   const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
   if(lastComma>lastDot)s=s.replace(/\./g,"").replace(",",".");
   else s=s.replace(/,/g,"");
 }else if(commas){
   if(commas>1)s=s.replace(/,/g,"");
   else{
     const dec=s.length-s.lastIndexOf(",")-1;
     s=dec===1||dec===2?s.replace(",","."):s.replace(/,/g,"");
   }
 }else if(dots){
   if(dots>1)s=s.replace(/\./g,"");
   else{
     const dec=s.length-s.lastIndexOf(".")-1;
     s=dec===1||dec===2?s:s.replace(/\./g,"");
   }
 }
 const n=Number(s)||0; return neg?-n:n;
}
function formatMoneyInput(el){
 const n=parseMoney(el.value); if(!Number.isFinite(n))return;
 el.value=n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function categoryColor(name){
 const direct=DATA.categories.find(c=>!c.parent&&String(c.name).toLowerCase()===String(name).toLowerCase());
 const parent=DATA.categories.find(c=>String(c.name).toLowerCase()===String(name).toLowerCase());
 return parent?.color||direct?.color||DEFAULT_COLORS[Math.max(0,CAT_ORDER.indexOf(name))%DEFAULT_COLORS.length]||"#c9a227";
}
function topCategory(name){
 const c=DATA.categories.find(x=>String(x.name).toLowerCase()===String(name||"").toLowerCase());
 return c?.parent||c?.name||name||"Sem categoria";
}
function categoryOptions(value="",allowBlank=true){
 return (allowBlank?`<option value="">Selecione</option>`:"")+DATA.categories.filter(c=>!c.parent).map(c=>`<option value="${esc(c.name)}" ${String(value).toLowerCase()===String(c.name).toLowerCase()?"selected":""}>${esc(c.name)}</option>`).join("");
}
function accountOptions(value=""){return `<option value="">Nenhuma</option>`+DATA.accounts.map(a=>`<option value="${a.id}" ${a.id===value?"selected":""}>${esc(a.name)}${a.institution?" — "+esc(a.institution):""}</option>`).join("")}
function cardOptions(value=""){return `<option value="">Nenhum</option>`+DATA.cards.map(c=>`<option value="${c.id}" ${c.id===value?"selected":""}>${esc(c.name)}</option>`).join("")}
function nav(){
 const tabs=[["dashboard","Dashboard"],["transactions","Lançamentos"],["planning","Planejamento"],["accounts","Contas"],["cards","Cartões"],["categories","Categorias"],["goals","Metas"],["recurring","Recorrências"],["wealth","Patrimônio"],["reports","Relatórios"]];
 $("nav").innerHTML=tabs.map(([id,l])=>`<button class="btn ${TAB===id?"active":""}" data-tab="${id}">${l}</button>`).join("");
 $("nav").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
}
function pageHead(title,sub,action=""){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${action}</div></div>`}
function kpi(label,value,sub){return `<div class="kpi"><div class="lab">${label}</div><div class="val">${value}</div><div class="sub">${sub}</div></div>`}
async function load(){
 const specs=[
  ["accounts","created_at"],["cards","created_at"],["categories","created_at"],
  ["transactions","transaction_date"],["budgets","created_at"],["goals","created_at"],
  ["recurring","created_at"],["assets","created_at"],["liabilities","created_at"],
  ["monthly_plans","created_at"],["strategy_plans","created_at"],["rules","created_at"],["imports","imported_at"]
 ];
 const results=await Promise.all(specs.map(async([name,col])=>{
   const {data,error}=await sb.from(name).select("*").eq("user_id",USER.id).order(col,{ascending:false});
   if(error){
     console.error(name,error);
     if(["strategy_plans","rules","imports"].includes(name)) return [name,[]];
     throw error;
   }
   return [name,data||[]];
 }));
 for(const [name,data] of results){
   DATA[name==="monthly_plans"?"monthly":name==="strategy_plans"?"strategy":name]=data;
 }
}
function periodTxRaw(key=selectedKey()){
 return DATA.transactions.filter(t=>String(t.transaction_date||"").slice(0,7)===key && t.status!=="cancelado");
}
function txDuplicateKey(t){
 const note=String(t.note||"");
 const parcel=note.match(/parcelado\s+(\d+)\/(\d+).*?(?:compra\s+([0-9]{4}-[0-9]{2})|$)/i);
 if(parcel){
   return ["parcel",parcel[3]||"",parcel[1],parcel[2],String(t.description||"").trim().toLowerCase(),String(t.transaction_type||""),String(t.category||"").trim().toLowerCase(),t.account_id||"",t.card_id||""].join("|");
 }
 return [t.transaction_date,t.transaction_type,String(t.description||"").trim().toLowerCase(),String(t.category||"").trim().toLowerCase(),Number(t.amount||0).toFixed(2),t.account_id||"",t.card_id||""].join("|");
}
function cleanTransactions(ts){
 const seen=new Set(), out=[], duplicates=[];
 for(const t of ts){
   const note=String(t.note||"");
   const parcel=/parcelado\s+\d+\/\d+/i.test(note);
   if(parcel){
     const key=txDuplicateKey(t);
     if(seen.has(key)){duplicates.push(t);continue}
     seen.add(key);
   }
   out.push(t);
 }
 return {rows:out,duplicates};
}
function periodTx(key=selectedKey()){return cleanTransactions(periodTxRaw(key)).rows}
function periodAudit(key=selectedKey()){return cleanTransactions(periodTxRaw(key)).duplicates}

function totals(ts){
 const income=ts.filter(t=>t.transaction_type==="receita").reduce((a,t)=>a+Number(t.amount||0),0);
 const expense=ts.filter(t=>["despesa","investimento"].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount||0),0);
 const invest=ts.filter(t=>t.transaction_type==="investimento").reduce((a,t)=>a+Number(t.amount||0),0);
 return {income,expense,invest,balance:income-expense};
}
function monthlyPlan(){return DATA.monthly.find(p=>Number(p.year)===Number(FILTERS.year)&&Number(p.month)===Number(FILTERS.month))||null}
function planValues(p){p=p||{};return {"Gastos Fixos":Number(p.fixed_expenses||0),"Investimentos":Number(p.investments||0),"Conforto":Number(p.comfort||0),"Metas":Number(p.goals||0),"Lazer":Number(p.leisure||0),"Conhecimento":Number(p.knowledge||0)}}
function planTotal(p){return Object.values(planValues(p)).reduce((a,b)=>a+b,0)}
function reserveInfo(){
 const rx=/reserva|emerg[eê]ncia|caixinha/i;
 const goals=DATA.goals.filter(g=>rx.test(`${g.name||""}`));
 const accounts=DATA.accounts.filter(a=>rx.test(`${a.name||""} ${a.institution||""}`));
 const assets=DATA.assets.filter(a=>rx.test(`${a.name||""} ${a.institution||""}`));
 const current=goals.reduce((a,g)=>a+Number(g.current||0),0)+accounts.reduce((a,g)=>a+Number(g.statement_balance??g.opening_balance??0),0)+assets.reduce((a,g)=>a+Number(g.current_value||0),0);
 const target=goals.reduce((a,g)=>a+Number(g.target||0),0);
 return {current,target,pct:target?Math.min(100,current/target*100):0};
}
function netWorth(){
 const assets=DATA.assets.reduce((a,x)=>a+Number(x.current_value||0),0);
 const accounts=DATA.accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance??0),0);
 const debt=DATA.liabilities.reduce((a,x)=>a+Number(x.balance||0),0);
 return assets+accounts-debt;
}

const valueLabelPlugin={id:"valueLabel",afterDatasetsDraw(chart){
 const {ctx,chartArea}=chart;
 chart.data.datasets.forEach((ds,di)=>{
   const meta=chart.getDatasetMeta(di);
   const total=chart.data.datasets[0].data.reduce((a,b)=>a+Number(b||0),0);
   meta.data.forEach((bar,i)=>{
     const v=Number(ds.data[i]||0); if(!v)return;
     const percent=total?v/total*100:0;
     const amountText=money(v), pctText=pct(percent);
     const width=Math.max(18,bar.width||18);
     ctx.save();
     const inside=bar.height>52;
     ctx.textAlign="center";
     if(inside){
       ctx.font="700 10px Inter,system-ui";
       ctx.fillStyle="#080808";
       ctx.textBaseline="middle";
       ctx.fillText(amountText,bar.x,bar.y+bar.height/2-7);
       ctx.fillText(pctText,bar.x,bar.y+bar.height/2+8);
     }else{
       ctx.font="700 9px Inter,system-ui";
       ctx.fillStyle="#ddd";
       ctx.textBaseline="bottom";
       const y=Math.max(chartArea.top+18,bar.y-8-(i%2)*18);
       if(width<95){
         ctx.fillText(amountText,bar.x,y);
         ctx.fillText(pctText,bar.x,y+11);
       }else{
         ctx.fillText(`${amountText} • ${pctText}`,bar.x,y);
       }
     }
     ctx.restore();
   });
 });
}};

function transactionTable(rows){

   return `<tr><td>${t.transaction_date?new Date(t.transaction_date+"T12:00:00").toLocaleDateString("pt-BR"):""}</td><td>${esc(t.description)}</td><td>${esc(t.category||"—")}${t.subcategory?" / "+esc(t.subcategory):""}</td><td>${esc(t.transaction_type)}</td><td>${esc(rel||"—")}</td><td class="${t.transaction_type==="receita"||t.transaction_type==="resgate"?"positive":"negative"}">${money(t.amount)}</td><td>${pending?'<span class="tag warn">Pendente</span>':'<span class="tag ok">Realizado</span>'}</td><td><div class="actions">${pending?`<button class="btn gold" onclick="markPaid('${t.id}')">Pagar</button>`:""}<button class="btn" onclick="openTransaction('${t.id}')">Editar</button><button class="btn danger" onclick="deleteTransactionSmart('${t.id}')">Excluir</button></div></td></tr>`

async function markPaid(id){
 const r=await sb.from("transactions").update({status:"realizado"}).eq("id",id).eq("user_id",USER.id);
 if(r.error){toast("Não foi possível marcar como pago: "+r.error.message,true);return}
 const t=DATA.transactions.find(x=>x.id===id); if(t)t.status="realizado";
 render(); toast("Lançamento marcado como pago.");
}
async function deleteTransactionSmart(id){
 const t=DATA.transactions.find(x=>x.id===id); if(!t)return;
 const note=String(t.note||"");
 const m=note.match(/Parcelado\s+(\d+)\/(\d+)\s+•\s+Compra\s+(\d{4}-\d{2})/i);
 if(!m){ await deleteRow("transactions",id); return; }
 const n=Number(m[2]), buy=m[3];
 const group=DATA.transactions.filter(x=>String(x.note||"").match(new RegExp(`Parcelado\\\\s+\\\\d+\\\\/${n}\\\\s+•\\\\s+Compra\\\\s+${buy}`,"i")));
 const choice=confirm(`Esta é a parcela ${m[1]}/${n}.\\n\\nOK = excluir todas as ${group.length} parcelas desta compra.\\nCancelar = manter a compra.`);
 if(choice){
   const ids=group.map(x=>x.id);
   const r=await sb.from("transactions").delete().in("id",ids).eq("user_id",USER.id);
   if(r.error){toast("Não foi possível excluir as parcelas: "+r.error.message,true);return}
   await reload();toast(`${group.length} parcela(s) excluída(s).`);
 }else{
   const r=await sb.from("transactions").delete().eq("id",id).eq("user_id",USER.id);
   if(r.error){toast(r.error.message,true);return}
   await reload();toast("Somente esta parcela foi excluída.");
 }
}

 let d=x.next_date?new Date(x.next_date+"T12:00:00"):null;
 if(!d)return "—";

 return d.toLocaleDateString("pt-BR");
}

async function deleteRow(table,id){
 const row=(DATA[table]||[]).find(x=>x.id===id);
 if(!row)return;
 if(["categories","accounts","cards"].includes(table)){
  let blockers=[];
  if(table==="categories"){
   const n=String(row.name).toLowerCase();
   const child=DATA.categories.filter(c=>c.id!==id&&String(c.parent||"").toLowerCase()===n).length;
   const tx=DATA.transactions.filter(t=>String(t.category||"").toLowerCase()===n).length;
   const rec=DATA.recurring.filter(r=>String(r.category||"").toLowerCase()===n).length;
   if(child||tx||rec)blockers.push(`${child} subcategoria(s), ${tx} lançamento(s), ${rec} recorrência(s)`);
  }
  if(table==="accounts"){
   const tx=DATA.transactions.filter(t=>t.account_id===id).length,rec=DATA.recurring.filter(r=>r.account_id===id).length;
   if(tx||rec)blockers.push(`${tx} lançamento(s), ${rec} recorrência(s)`);
  }
  if(table==="cards"){
   const tx=DATA.transactions.filter(t=>t.card_id===id).length,rec=DATA.recurring.filter(r=>r.card_id===id).length;
   if(tx||rec)blockers.push(`${tx} lançamento(s), ${rec} recorrência(s)`);
  }
  if(blockers.length){toast("Não é possível excluir: existem registros vinculados ("+blockers.join("; ")+").",true);return}
 }
 if(table==="recurring"){
   const linked=DATA.transactions.filter(t=>String(t.note||"").includes(`Recorrência automática • ${id}`));
   const removeFuture=confirm(`Excluir a regra "${row.name}"?\\n\\nOK = excluir também os lançamentos futuros ainda pendentes dessa recorrência.\\nCancelar = excluir somente a regra e preservar os lançamentos já criados.`);
   if(removeFuture&&linked.length){
     const ids=linked.filter(t=>t.status==="pendente"&&new Date(t.transaction_date+"T12:00:00")>=new Date()).map(t=>t.id);
     if(ids.length){
       const dr=await sb.from("transactions").delete().in("id",ids).eq("user_id",USER.id);
       if(dr.error){toast("Regra não excluída: "+dr.error.message,true);return}
     }
   } else if(!confirm("Excluir somente a regra de recorrência? Os lançamentos já criados serão mantidos.")) return;
 }
 else if(!confirm("Excluir este registro?")) return;
 const r=await sb.from(table).delete().eq("id",id).eq("user_id",USER.id);
 if(r.error){toast(r.error.message,true);return}
 await reload();toast(table==="recurring"?"Recorrência excluída.":"Registro excluído.");
}

      if(fixed.checked){

/* ================= MENTORIA BLACK V18 =================
   Recorrências materializadas com horizonte de 12 meses e carregadas antes do primeiro render.
*/
(function(){
  function addMonthsV17(dateStr,n){
    const d=new Date(String(dateStr)+"T12:00:00");
    const day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+Number(n||0));
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
    return d.toISOString().slice(0,10);
  }
  window.addMonthsV16=addMonthsV17;
  window.addMonthsV17=addMonthsV17;

  function recurrenceSignature(t){
    const note=String(t.note||"");
    const source=(note.match(/Recorrência automática • ([0-9a-f-]{8,})/i)||[])[1]||"";
    return [source,t.transaction_date,t.transaction_type,String(t.description||"").trim().toLowerCase(),String(t.category||"").trim().toLowerCase(),Number(t.amount||0).toFixed(2),t.account_id||"",t.card_id||""].join("|");
  }

  async function materializeRecurringV17(){
    if(!USER || !Array.isArray(DATA.recurring)) return {transactions:[],updated:[]};
    const today=new Date();today.setHours(12,0,0,0);
    const horizon=new Date(today);horizon.setMonth(horizon.getMonth()+12);
    const existing=new Set((DATA.transactions||[]).map(recurrenceSignature));
    const pending=[], updated=[];
    for(const r of DATA.recurring.filter(x=>x.active!==false)){
      let cursor=r.next_date;
      if(!cursor) continue;
      let guard=0;
      while(cursor && new Date(cursor+"T12:00:00")<=horizon && guard<240){
        if(r.end_date && cursor>r.end_date) break;
        const row={
          user_id:USER.id, transaction_date:cursor, description:r.name,
          category:r.category||null, subcategory:r.subcategory||null, amount:Number(r.amount||0),
          transaction_type:r.type||"despesa",
          status:new Date(cursor+"T12:00:00")<=today?"realizado":"pendente",
          payment_method:r.card_id?"Cartão de crédito":"Conta",
          account_id:r.account_id||null, card_id:r.card_id||null,
          note:(String(r.note||"").trim()?String(r.note).trim()+" • ":"")+`Recorrência automática • ${r.id}`
        };
        const sig=recurrenceSignature(row);
        if(!existing.has(sig)){ pending.push(row); existing.add(sig); }
        cursor=addMonthsV17(cursor,Number(r.interval||1)); guard++;
      }
      if(cursor && cursor!==r.next_date) updated.push({id:r.id,next_date:cursor});
    }
    if(pending.length){
      const inserted=[];
      for(let i=0;i<pending.length;i+=100){
        const batch=pending.slice(i,i+100);
        const ins=await sb.from("transactions").insert(batch).select();
        if(ins.error) throw new Error("Falha ao gerar recorrências: "+ins.error.message);
        if(ins.data?.length) inserted.push(...ins.data);
      }
      pending.length=0;
      pending.push(...inserted);
    }
    if(updated.length){
      await Promise.all(updated.map(async u=>{
        const r=await sb.from("recurring").update({next_date:u.next_date}).eq("id",u.id).eq("user_id",USER.id);
        if(r.error)console.error("V18 next_date",r.error);
        const local=DATA.recurring.find(x=>x.id===u.id);if(local)local.next_date=u.next_date;
      }));
    }
    return {transactions:pending,updated};
  }
  // V18 lifecycle: one parallel load + one batched materialization, avoiding the old double reload.
  window.reload=async function(){
    await load();
    const result=await materializeRecurringV17();
    if(result?.transactions?.length) DATA.transactions.push(...result.transactions);
    render();
  };

  window.start=async function(){
    try{
      $("authMsg").textContent="Carregando seus dados…";
      await load();
      const result=await materializeRecurringV17();
      if(result?.transactions?.length) DATA.transactions.push(...result.transactions);
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("v18Loading")?.classList.add("hidden");
      $("userEmail").textContent=USER.email||"";
      render();
    }catch(e){
      $("v18Loading")?.classList.add("hidden");
      $("auth").classList.remove("hidden");
      $("app").classList.add("hidden");
      $("authMsg").textContent="Erro ao carregar seus dados: "+e.message;
      $("authMsg").className="msg err";
      console.error(e);
    }
  };

  // The original handlers are replaced so the V17 startup path is always used.
  $("loginForm").onsubmit=async e=>{
    e.preventDefault();
    $("authMsg").textContent="Entrando...";
    const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});
    if(error){$("authMsg").textContent=error.message;$("authMsg").className="msg err";return}
    USER=data.user;
    await window.start();
  };

  $("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  $("refresh").onclick=async()=>{try{await window.reload();toast("Dados atualizados.")}catch(e){toast(e.message,true)}};

  (async()=>{
    // Bootstrap protegido: nunca deixe a tela de carregamento presa
    // se a sessão não existir ou o Supabase estiver lento/indisponível.
    const timeout=(ms)=>new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tempo limite ao conectar ao servidor. Verifique sua internet e tente novamente.")),ms));
    try{
      const result=await Promise.race([sb.auth.getSession(),timeout(12000)]);
      const session=result?.data?.session;
      if(session){
        USER=session.user;
        await Promise.race([window.start(),timeout(25000)]);
      }else{
        $("v18Loading")?.classList.add("hidden");
      }
    }catch(e){
      console.error("V18 bootstrap",e);
      $("v18Loading")?.classList.add("hidden");
      $("authMsg").textContent="Não foi possível carregar o sistema. "+e.message;
      $("authMsg").className="msg err";
    }
  })();

  const originalOpen=window.openTransaction;
  window.openTransaction=async function(id){
    await originalOpen(id);
    requestAnimationFrame(()=>{
      const input=$("v15Amount");
      if(input){input.focus({preventScroll:true});input.select();}
    });
  };
})();
</script>
<script>
/* ================= MENTORIA BLACK V19 =================
   - Categoria por tipo robusta (inclui dados legados)
   - Compra no cartão separada da competência/data da fatura
   - Parcelamento com compra real + datas de fatura
   - Correções de duplicidade, planejamento, contas/cartões e UX
*/
(() => {
  const V19_KIND = value => {
    const k = String(value ?? '').trim().toLowerCase();
    if (['receita','income','revenue','entrada','credit','credito'].includes(k)) return 'receita';
    if (['ambos','both','all'].includes(k)) return 'ambos';
    return 'despesa';
  };
  const V19_INCOME_DEFAULTS = ['Salário','Bonificação','Renda extra','Outras receitas'];
  const V19_EXPENSE_DEFAULTS = ['Gastos Fixos','Investimentos','Conforto','Metas','Lazer','Conhecimento'];
  const V19_CATS = () => Array.isArray(DATA.categories) ? DATA.categories : [];
  const V19_TOP = () => V19_CATS().filter(c => !c.parent);
  const V19_INCOME = () => V19_TOP().filter(c => ['receita','ambos'].includes(V19_KIND(c.kind)));
  const V19_EXPENSE = () => V19_TOP().filter(c => ['despesa','ambos'].includes(V19_KIND(c.kind)));
  const V19_CATS_FOR = type => type === 'receita' ? V19_INCOME() : V19_EXPENSE();
  const V19_NORM = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  const V19_DEFAULT_EXPENSE_SET = new Set(V19_EXPENSE_DEFAULTS.map(V19_NORM));
  const V19_CATEGORY_MATCH = (a,b) => V19_NORM(a) === V19_NORM(b);

  // Normalize legacy category records in memory so the UI never rejects a valid expense
  // merely because the database used a legacy value such as "expense" or left kind null.
  V19_CATS().forEach(c => { if (!c.kind) c.kind = V19_EXPENSE_DEFAULTS.map(x=>x.toLowerCase()).includes(String(c.name||'').toLowerCase()) ? 'despesa' : 'despesa'; });

  function v19Opts(list, value='') {
    return '<option value="">Selecione</option>' + list.map(c =>
      `<option value="${esc(c.name)}" ${V19_CATEGORY_MATCH(value,c.name)?'selected':''}>${esc(c.name)}</option>`
    ).join('');
  }
  function v19Card(id) { return DATA.cards.find(c => c.id === id) || null; }
  function v19DateAddMonths(dateStr, n) {
    const d = new Date(String(dateStr) + 'T12:00:00');
    const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + Number(n||0));
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()));
    return d.toISOString().slice(0,10);
  }
  function v19FirstDayOfMonth(dateStr, offset=0) {
    const d = new Date(String(dateStr).slice(0,7) + '-01T12:00:00');
    d.setMonth(d.getMonth()+Number(offset||0));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  }
  function v19SuggestedBillingDate(purchaseDate, cardId) {
    const card = v19Card(cardId);
    if (!purchaseDate) return '';
    const d = new Date(purchaseDate+'T12:00:00');
    let offset = 1;
    if (card?.closing_day) offset = d.getDate() > Number(card.closing_day) ? 2 : 1;
    const base = new Date(d.getFullYear(), d.getMonth()+offset, 1);
    const day = Math.min(Number(card?.due_day)||1, new Date(base.getFullYear(),base.getMonth()+1,0).getDate());
    base.setDate(day);
    return base.toISOString().slice(0,10);
  }
  function v19HasCard(t){ return !!t?.card_id; }
  function v19CategoryFor(type, value) {
    const wanted = V19_NORM(value);
    if (!wanted) return false;
    if (V19_CATS_FOR(type).some(c => V19_CATEGORY_MATCH(c.name, value))) return true;
    // Investments intentionally use the expense-category universe.
    return type !== 'receita' && V19_DEFAULT_EXPENSE_SET.has(wanted);
  }
  async function v19EnsureIncomeCategories(){

  // Fix parcel deduplication: two purchases in the same month with the same description are not duplicates.
  window.txDuplicateKey = function(t){
    const note=String(t.note||'');
    const parcel=note.match(/parcelado\s+(\d+)\/(\d+).*?compra\s+([0-9]{4}-[0-9]{2}(?:-[0-9]{2})?)/i);
    if(parcel) return ['parcel',parcel[3],parcel[1],parcel[2],String(t.description||'').trim().toLowerCase(),String(t.transaction_type||''),String(t.category||'').trim().toLowerCase(),t.account_id||'',t.card_id||''].join('|');
    return [t.transaction_date,t.purchase_date||'',t.transaction_type,String(t.description||'').trim().toLowerCase(),String(t.category||'').trim().toLowerCase(),Number(t.amount||0).toFixed(2),t.account_id||'',t.card_id||''].join('|');
  };
  window.cleanTransactions = function(ts){
    const seen=new Set(),out=[],duplicates=[];
    for(const t of ts){
      const parcel=/parcelado\s+\d+\/\d+/i.test(String(t.note||''));
      if(parcel){const key=window.txDuplicateKey(t);if(seen.has(key)){duplicates.push(t);continue}seen.add(key)}
      out.push(t);
    }
    return {rows:out,duplicates};
  };

  window.periodAudit = function(key=selectedKey()){ return window.cleanTransactions(window.periodTxRaw(key)).duplicates; };

    const invest=ts.filter(t=>t.transaction_type==='investimento').reduce((a,t)=>a+Number(t.amount||0),0);
    return {income,expense,invest,balance:income-expense-invest};

  const footer=document.querySelector('.footer'); if(footer) footer.textContent=footer.textContent.replace(/V18/g,'V19');

  const style=document.createElement('style'); style.id='v19-style'; style.textContent=`
    .v19-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    #v19CardBox{margin-top:2px}
    #v19CardBox .notice{line-height:1.45}
    @media(max-width:650px){.v19-card-grid{grid-template-columns:1fr}}
  `; document.head.appendChild(style);
})();

</script>
<script>
/* ================= MENTORIA BLACK V20 =================
   Lançamentos: mantém "Todos os meses" e adiciona visualização/filtro por mês.
   O período usa Ano-Mês para não misturar, por exemplo, agosto/2026 com agosto/2027.
*/
(function(){
  function v20MonthOptions(selected=""){
    const keys=[...new Set((DATA.transactions||[])
      .map(t=>String(t.transaction_date||"").slice(0,7))
      .filter(k=>/^\d{4}-\d{2}$/.test(k)))].sort().reverse();
    return `<option value="" ${selected===""?"selected":""}>Todos os meses</option>`+
      keys.map(k=>`<option value="${k}" ${selected===k?"selected":""}>${esc(monthLabelKey(k))}</option>`).join("");
  }

  function v20MonthSummary(rows){
    if(!rows.length) return "";
    const total=rows.reduce((sum,t)=>sum+Number(t.amount||0),0);
    const income=rows.filter(t=>t.transaction_type==="receita"||t.transaction_type==="resgate")
      .reduce((sum,t)=>sum+Number(t.amount||0),0);
    const out=rows.filter(t=>!["receita","resgate"].includes(t.transaction_type))
      .reduce((sum,t)=>sum+Number(t.amount||0),0);
    return `<div class="v20-period-summary">
      <div><span>LANÇAMENTOS</span><strong>${rows.length}</strong></div>
      <div><span>RECEITAS / RESGATES</span><strong class="positive">${money(income)}</strong></div>
      <div><span>SAÍDAS</span><strong class="negative">${money(out)}</strong></div>
    </div>`;
  }

  window.transactions=function(){
    let arr=DATA.transactions.filter(t=>
      (!FILTERS.txType||t.transaction_type===FILTERS.txType)&&
      (!FILTERS.txCategory||topCategory(t.category)===FILTERS.txCategory)&&
      (!FILTERS.txMonth||String(t.transaction_date||"").slice(0,7)===FILTERS.txMonth)&&
      (!FILTERS.search||`${t.description} ${t.category||""} ${t.subcategory||""}`.toLowerCase().includes(FILTERS.search.toLowerCase()))
    );

    arr.sort((a,b)=>String(b.transaction_date||"").localeCompare(String(a.transaction_date||"")));

    const list=FILTERS.txType==="receita"?V19_INCOME():FILTERS.txType?V19_EXPENSE():[...V19_EXPENSE(),...V19_INCOME()];
    const periodLabel=FILTERS.txMonth?monthLabelKey(FILTERS.txMonth):"Todos os meses";

    return pageHead(
      "Lançamentos",
      `A data da compra do cartão é separada da data que entra na fatura.`,
      `<button class="btn gold" onclick="openTransaction()">＋ Novo lançamento</button>`
    )+
    `<div class="filters">
      <div class="filter"><label>Buscar</label><input id="txSearch" value="${esc(FILTERS.search)}" placeholder="Descrição ou categoria"></div>
      <div class="filter"><label>Tipo</label><select id="txType"><option value="">Todos</option>${["receita","despesa","investimento","transferencia","resgate"].map(x=>`<option value="${x}" ${FILTERS.txType===x?"selected":""}>${x}</option>`).join("")}</select></div>
      <div class="filter"><label>Categoria</label><select id="txCategory"><option value="">Todas</option>${list.filter(c=>!c.parent).map(c=>`<option value="${esc(c.name)}" ${FILTERS.txCategory===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
      <div class="filter"><label>Mês</label><select id="txMonth">${v20MonthOptions(FILTERS.txMonth)}</select></div>
    </div>
    <div class="v20-period-head">
      <div><strong>${esc(periodLabel)}</strong><span>${FILTERS.txMonth?"Visualização mensal":"Visão completa de todos os lançamentos"}</span></div>
      ${FILTERS.txMonth?`<button class="btn" id="v20AllMonths">Ver todos</button>`:""}
    </div>
    ${v20MonthSummary(arr)}
    <div class="card">${transactionTable(arr)}</div>`;
  };

  const oldBindFilters=window.bindFilters || bindFilters;
  window.bindFilters=function(){
    oldBindFilters();
    const month=$("txMonth");
    if(month) month.onchange=()=>{FILTERS.txMonth=month.value;render()};
    const all=$("v20AllMonths");
    if(all) all.onclick=()=>{FILTERS.txMonth="";render()};
  };

  // Preserve existing global filtering behavior while adding the month selector.
  const style=document.createElement("style");
  style.id="v20-style";
  style.textContent=`
    .v20-period-head{margin:12px 0 0;padding:13px 15px;border:1px solid #2b2b2b;border-radius:12px;background:#0c0c0c;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .v20-period-head strong{display:block;font-size:15px;color:#f1f1f1}
    .v20-period-head span{display:block;color:#888;font-size:11px;margin-top:3px}
    .v20-period-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
    .v20-period-summary>div{border:1px solid #292929;background:#0c0c0c;border-radius:12px;padding:11px 13px}
    .v20-period-summary span{display:block;color:#888;font-size:9px;letter-spacing:.08em;margin-bottom:4px}
    .v20-period-summary strong{font-size:16px}
    @media(max-width:650px){
      .v20-period-summary{grid-template-columns:1fr}
      .v20-period-head{align-items:flex-start}
    }
  `;
  document.head.appendChild(style);
  document.title="Mentoria Black — Gestão Financeira V20";
  const footer=document.querySelector(".footer");
  if(footer) footer.textContent=footer.textContent.replace(/V19\.1|V19|V18/g,"V20");
})();
</script>
