<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mentoria Black — Gestão Financeira V9</title>

<style>
:root{--bg:#070707;--panel:#0e0e0e;--panel2:#131313;--line:#292929;--text:#f2f2f2;--muted:#999;--gold:#c9a227;--danger:#d89595;--ok:#93aa83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.wrap{max-width:1500px;margin:auto;padding:20px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{color:var(--gold);font-weight:800;letter-spacing:.2em;font-size:12px}.brand-lockup{display:flex;align-items:center;gap:12px}.brand-mark{width:52px;height:52px;flex:0 0 52px}.brand-copy{display:flex;flex-direction:column;gap:3px}.brand-copy .brand-title{font-family:Georgia,"Times New Roman",serif;color:#d7a93a;font-size:25px;letter-spacing:.08em;line-height:1}.brand-copy .brand-sub{display:flex;align-items:center;gap:8px;color:#eee;font-size:11px;letter-spacing:.2em;font-weight:600}.brand-copy .brand-sub:before,.brand-copy .brand-sub:after{content:"";height:1px;background:var(--gold);width:42px}.auth-brand{margin-bottom:18px}.top-brand{min-width:0}.top-brand .brand-lockup{align-items:center}.top-brand .brand-copy .brand-title{font-size:24px}@media(max-width:600px){.brand-copy .brand-title{font-size:19px}.brand-mark{width:44px;height:44px;flex-basis:44px}.brand-copy .brand-sub{font-size:9px;letter-spacing:.14em}.brand-copy .brand-sub:before,.brand-copy .brand-sub:after{width:22px}}.auth h1{margin:10px 0}.auth p,.muted{color:var(--muted)}
label{display:block;color:#aaa;font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:12px 0 6px}
input,select,textarea{width:100%;background:#090909;color:var(--text);border:1px solid #333;border-radius:8px;padding:10px}
textarea{min-height:80px;resize:vertical}.btn{background:#111;color:var(--text);border:1px solid #383838;border-radius:8px;padding:9px 12px}
.btn:hover{border-color:var(--gold);color:var(--gold)}.btn.primary{background:var(--gold);color:#090909;border-color:var(--gold);font-weight:800}.btn.danger{color:#e4aaaa}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px}.top h1{margin:5px 0}
.nav{display:flex;gap:6px;overflow:auto;padding:12px 0}.nav button{white-space:nowrap}.nav button.active{color:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.card h2{font-size:15px;margin:0 0 5px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase}.kpi .value{font-size:22px;font-weight:800;margin-top:5px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #222}th{color:#999;font-size:10px;text-transform:uppercase}td{font-size:13px}
.positive{color:var(--ok)}.negative{color:var(--danger)}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #333;border-radius:10px}
.bar{height:9px;background:#222;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}.modalbox{width:min(700px,100%);max-height:92vh;overflow:auto;background:#101010;border:1px solid #383838;border-radius:14px;padding:18px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.msg{min-height:20px;color:#aaa;margin-top:8px}
.toast{position:fixed;right:15px;bottom:15px;background:#151515;border:1px solid #444;padding:12px;border-radius:10px;z-index:30}.small{font-size:11px}
.statline{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 7px;border:1px solid #444;border-radius:99px;font-size:10px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 12px}.filter label{margin-top:0}.chartbox{height:330px;position:relative}.chartbox canvas{width:100%!important;height:100%!important}
.subtle,.hint{color:var(--muted);font-size:12px}.hint{line-height:1.45}.color-input{height:42px;padding:4px}.period-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.category-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.cat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #222;border-radius:8px;background:#0b0b0b}
.cat-name{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}.compare-table td,.compare-table th{padding:8px}
.reserve-progress{height:10px;background:#222;border-radius:99px;overflow:hidden}.reserve-progress i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.checkline{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:#ddd;margin:0}.checkline input{width:auto}
.installment-preview{padding:10px;border:1px solid #292929;border-radius:8px;background:#0b0b0b;line-height:1.7}
.chart-note{font-size:11px;color:#888;margin-top:7px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.span8,.span6,.span4{grid-column:span 12}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.wrap{padding:13px}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:10px}.filters{grid-template-columns:1fr}.category-legend{grid-template-columns:1fr}.chartbox{height:300px}table{min-width:720px}}
@media print{.nav,.actions,.btn{display:none!important}.card,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<section id="auth" class="auth">
  <div class="auth-card">
    <div class="brand-lockup auth-brand"><svg class="brand-mark" viewBox="0 0 100 100" aria-label="Logo MB" role="img"><circle cx="50" cy="54" r="27" fill="none" stroke="#d7a93a" stroke-width="3"/><path d="M30 31 Q50 9 70 31" fill="none" stroke="#d7a93a" stroke-width="3"/><path d="M38 25 L38 14 M50 20 L50 7 M62 25 L62 14" stroke="#d7a93a" stroke-width="3"/><path d="M30 31 Q24 24 20 34 Q27 37 31 40 M70 31 Q76 24 80 34 Q73 37 69 40" fill="none" stroke="#d7a93a" stroke-width="2"/><text x="50" y="63" text-anchor="middle" fill="#d7a93a" font-family="Georgia,serif" font-size="27" font-weight="700">MB</text></svg><div class="brand-copy"><div class="brand-title">MENTORIA BLACK</div><div class="brand-sub">GESTÃO FINANCEIRA</div></div></div>
    <p>Planejamento, execução, patrimônio e análise em um só lugar.</p>
    <form id="loginForm">
      <label>E-mail</label><input id="email" type="email" required autocomplete="email">
      <label>Senha</label><input id="password" type="password" required autocomplete="current-password">
      <div class="row" style="margin-top:15px">
        <button class="btn primary" type="submit">Entrar</button>
        <button class="btn" type="button" id="signup">Criar conta</button>
        <button class="btn" type="button" id="reset">Recuperar senha</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </form>
  </div>
</section>

<section id="app" class="hidden">
<div class="wrap">
<header class="top">
  <div class="top-brand"><div class="brand-lockup"><svg class="brand-mark" viewBox="0 0 100 100" aria-label="Logo MB" role="img"><circle cx="50" cy="54" r="27" fill="none" stroke="#d7a93a" stroke-width="3"/><path d="M30 31 Q50 9 70 31" fill="none" stroke="#d7a93a" stroke-width="3"/><path d="M38 25 L38 14 M50 20 L50 7 M62 25 L62 14" stroke="#d7a93a" stroke-width="3"/><path d="M30 31 Q24 24 20 34 Q27 37 31 40 M70 31 Q76 24 80 34 Q73 37 69 40" fill="none" stroke="#d7a93a" stroke-width="2"/><text x="50" y="63" text-anchor="middle" fill="#d7a93a" font-family="Georgia,serif" font-size="27" font-weight="700">MB</text></svg><div class="brand-copy"><div class="brand-title">MENTORIA BLACK</div><div class="brand-sub">GESTÃO FINANCEIRA</div></div></div><div class="muted small" id="userEmail"></div></div>
  <div class="actions"><button class="btn" id="refresh">Atualizar</button><button class="btn" id="print">PDF / Imprimir</button><button class="btn" id="logout">Sair</button></div>
</header>
<nav id="nav" class="nav"></nav>
<main id="view"></main>
</div>
</section>

<div id="modal" class="modal hidden"><div class="modalbox">
  <div class="row" style="justify-content:space-between"><h2 id="modalTitle">Cadastro</h2><button class="btn" id="closeModal">Fechar</button></div>
  <div id="modalBody"></div>
</div></div>
<div id="toast" class="toast hidden"></div>

<script>
// Mentoria Black V9 — dashboard financeiro auditado e estabilizado.
const SUPABASE_URL="https://mwjqfzbpjmwiscvtxvfc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Bz8zOgsayn5KRDKBa0_u_A_TbvV_RuK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const pct=v=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
const MONTHS_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATEGORY_ORDER=['Gastos Fixos','Investimentos','Conforto','Metas','Lazer','Conhecimento'];
const TX_TYPES={receita:'Receita',despesa:'Despesa',transferencia:'Transferência',investimento:'Investimento',resgate:'Resgate'};
const ACCOUNT_TYPES={checking:'Conta corrente',savings:'Conta poupança',investment:'Conta de investimentos',cash:'Carteira / dinheiro'};
let USER=null,TAB='dashboard';
let DATA={accounts:[],cards:[],categories:[],transactions:[],budgets:[],goals:[],recurring:[],assets:[],liabilities:[],monthly:[],strategy:[],rules:[],imports:[]};
let FILTERS={year:new Date().getFullYear(),month:new Date().getMonth()+1,txType:'',txCategory:'',search:''};

function localToday(){const d=new Date();return{year:d.getFullYear(),month:d.getMonth()+1,date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}}
function ymKey(y,m){return `${y}-${String(m).padStart(2,'0')}`}
function monthLabel(y,m){return `${MONTHS_PT[m-1]} de ${y}`}
function selectedYm(){return ymKey(FILTERS.year,FILTERS.month)}
function addMonths(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function dateInMonth(monthStr,day){const[y,m]=String(monthStr).split('-').map(Number);const last=new Date(y,m,0).getDate();return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(Number(day)||1,last)).padStart(2,'0')}`}
function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function safeColor(c){return /^#[0-9a-fA-F]{6}$/.test(String(c||''))?c:'#c9a227'}

function availableYears(){
  const ys=[];
  for(let y=2000;y<=2100;y++)ys.push(y);
  return ys;
}
function yearOptions(selected){return availableYears().map(y=>`<option value="${y}" ${Number(selected)===y?'selected':''}>${y}</option>`).join('')}
function monthOptions(selected){return MONTHS_PT.map((m,i)=>`<option value="${i+1}" ${Number(selected)===i+1?'selected':''}>${m}</option>`).join('')}
function periodFilters(prefix){return `<div class="filters">
  <div class="filter"><label>Ano</label><select id="${prefix}Year">${yearOptions(FILTERS.year)}</select></div>
  <div class="filter"><label>Mês</label><select id="${prefix}Month">${monthOptions(FILTERS.month)}</select></div>
</div>`}
function periodTx(realizedOnly=false){
  return DATA.transactions.filter(t=>String(t.transaction_date).slice(0,7)===selectedYm()&&t.status!=='cancelado'&&(!realizedOnly||t.status==='realizado'));
}
function selectedPlan(){return DATA.monthly.find(x=>Number(x.year)===FILTERS.year&&Number(x.month)===FILTERS.month)||null}

function topCategoryName(name){
  const direct=DATA.categories.find(c=>normName(c.name)===normName(name));
  if(direct?.parent){
    const p=DATA.categories.find(c=>normName(c.name)===normName(direct.parent));
    return p?.name||direct.parent;
  }
  const parts=String(name||'').split(' / ');
  if(parts.length>1)return DATA.categories.find(c=>normName(c.name)===normName(parts[0]))?.name||parts[0];
  return direct?.name||name||'Sem categoria';
}
function topCategoryRecord(name){
  const top=topCategoryName(name);
  return DATA.categories.find(c=>!c.parent&&normName(c.name)===normName(top))
      ||DATA.categories.find(c=>normName(c.name)===normName(top))||null;
}
function categoryColor(name){return safeColor(topCategoryRecord(name)?.color)}
function categoryOptions(excludeId=''){
  return DATA.categories.filter(c=>c.id!==excludeId).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}${c.parent?' / '+esc(c.parent):''}</option>`).join('');
}
function categoryLegend(entries,total){
  if(!entries.length)return '';
  return `<div class="category-legend">${entries.map(([name,value])=>{
    const p=total?value/total*100:0,c=categoryColor(name);
    return `<div class="cat-item"><span class="cat-name"><i class="dot" style="background:${c}"></i>${esc(name)}</span><strong>${money(value)} <span class="muted">(${pct(p)})</span></strong></div>`;
  }).join('')}</div>`;
}

function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
$('closeModal').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function btn(label,onclick,cls='btn'){return `<button class="${cls}" onclick="${onclick}">${label}</button>`}
const tabs=[['dashboard','Dashboard'],['transactions','Lançamentos'],['planning','Planejamento'],['accounts','Contas'],['cards','Cartões'],['categories','Categorias'],['goals','Metas'],['recurring','Recorrências'],['wealth','Patrimônio'],['reports','Relatórios']];
function nav(){
  $('nav').innerHTML=tabs.map(([id,label])=>`<button class="btn ${TAB===id?'active':''}" data-tab="${id}">${label}</button>`).join('');
  $('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
}
function layout(title,actions,body){return `<div class="row" style="justify-content:space-between;margin:10px 0 12px"><div><h2 style="margin:0">${title}</h2></div><div class="actions">${actions||''}</div></div>${body}`}
function kpi(l,v,s){return `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="muted small">${s}</div></div>`}

async function load(){
  const specs=[['accounts','created_at'],['cards','created_at'],['categories','created_at'],['transactions','transaction_date'],['budgets','created_at'],['goals','created_at'],['recurring','created_at'],['assets','created_at'],['liabilities','created_at'],['monthly_plans','created_at'],['strategy_plans','created_at'],['rules','created_at'],['imports','imported_at']];
  for(const [name,orderCol] of specs){
    const {data,error}=await sb.from(name).select('*').eq('user_id',USER.id).order(orderCol,{ascending:false});
    if(error)throw error;
    const key=name==='monthly_plans'?'monthly':name==='strategy_plans'?'strategy':name;
    DATA[key]=data||[];
  }
}

function accountOptions(){return DATA.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}${a.institution?' — '+esc(a.institution):''}</option>`).join('')}
function cardOptions(){return DATA.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}

function reserveInfo(){
  const re=/reserva|emerg[eê]ncia|caixinha/i;
  const goals=DATA.goals.filter(g=>re.test(String(g.name||'')));
  if(goals.length){
    const current=goals.reduce((a,g)=>a+Number(g.current||0),0),target=goals.reduce((a,g)=>a+Number(g.target||0),0);
    return{matches:goals,current,target,pct:target?Math.min(100,current/target*100):0,source:'meta'};
  }
  const accounts=DATA.accounts.filter(a=>re.test(`${a.name||''} ${a.institution||''}`));
  if(accounts.length){
    const current=accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance??0),0);
    return{matches:accounts,current,target:0,pct:0,source:'conta'};
  }
  const assets=DATA.assets.filter(a=>re.test(`${a.name||''} ${a.institution||''}`));
  const current=assets.reduce((a,x)=>a+Number(x.current_value||0),0);
  return{matches:assets,current,target:0,pct:0,source:'ativo'};
}
function cardPeriodSummary(){
  const map={};
  DATA.transactions.filter(t=>String(t.transaction_date).slice(0,7)===selectedYm()&&t.status!=='cancelado'&&t.card_id&&['despesa','investimento'].includes(t.transaction_type))
    .forEach(t=>map[t.card_id]=(map[t.card_id]||0)+Number(t.amount||0));
  const rows=DATA.cards.map(c=>[c,Number(map[c.id]||0)]);
  return{rows,total:rows.reduce((a,x)=>a+x[1],0)};
}
function expensesByCategory(){
  const by={};
  periodTx(true).filter(t=>['despesa','investimento'].includes(t.transaction_type)).forEach(t=>{
    const k=topCategoryName(t.category);by[k]=(by[k]||0)+Number(t.amount||0);
  });
  return Object.entries(by).sort((a,b)=>b[1]-a[1]);
}

function dashboard(){
  const tx=periodTx(true);
  const income=tx.filter(t=>t.transaction_type==='receita').reduce((a,t)=>a+Number(t.amount),0);
  const expense=tx.filter(t=>['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount),0);
  const invest=tx.filter(t=>t.transaction_type==='investimento').reduce((a,t)=>a+Number(t.amount),0);
  const fixed=tx.filter(t=>topCategoryName(t.category)==='Gastos Fixos'&&t.transaction_type==='despesa').reduce((a,t)=>a+Number(t.amount),0);
  const assets=DATA.assets.reduce((a,x)=>a+Number(x.current_value||0),0);
  const debt=DATA.liabilities.reduce((a,x)=>a+Number(x.balance||0),0);
  const cash=DATA.accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance??0),0);
  const net=assets+cash-debt;
  const rows=expensesByCategory(),total=rows.reduce((a,x)=>a+x[1],0),reserve=reserveInfo(),cs=cardPeriodSummary();

  return layout('Dashboard',btn('+ Lançamento','openTransaction()','btn primary'),
  `${periodFilters('dash')}
   <div class="period-summary"><span class="pill">${monthLabel(FILTERS.year,FILTERS.month)}</span><span class="subtle">Todos os indicadores abaixo respeitam o período selecionado.</span></div>
   <div class="kpis">
    ${kpi('Receitas',money(income),'período selecionado')}
    ${kpi('Despesas',money(expense),'inclui investimentos')}
    ${kpi('Saldo',money(income-expense),income-expense>=0?'positivo':'atenção')}
    ${kpi('Investimentos',money(invest),'período selecionado')}
    ${kpi('Gastos fixos',money(fixed),'despesas da categoria')}
    ${kpi('Patrimônio líquido',money(net),'estimativa atual')}
   </div>
   <div class="grid">
    <section class="card span8">
      <h2>Despesas por categoria</h2><p class="muted">${monthLabel(FILTERS.year,FILTERS.month)}</p>
      ${rows.length?`<div class="chartbox"><canvas id="dashCategoryChart"></canvas></div>
      <div class="chart-note">Valor e percentual aparecem diretamente acima de cada barra.</div>
      ${categoryLegend(rows,total)}`:'<div class="empty">Ainda não há despesas neste período.</div>'}
    </section>
    <section class="card span4">
      <h2>Reserva de emergência</h2>
      ${reserve.matches.length?`
       <div class="statline"><span>Acumulado</span><strong>${money(reserve.current)}</strong></div>
       <div class="statline"><span>Objetivo</span><strong>${reserve.target?money(reserve.target):'Não definido'}</strong></div>
       <div class="reserve-progress"><i style="width:${reserve.pct}%"></i></div>
       <p class="hint">${reserve.target?`${pct(reserve.pct)} do objetivo alcançado.`:`Valor identificado em ${reserve.source==='conta'?'conta':reserve.source==='ativo'?'patrimônio':'meta'}.`}</p>

function installmentPreview(total,count){
 total=Number(total||0);count=Math.max(2,Math.min(120,Number(count||2)));
 if(total<=0)return 'Informe o valor total da compra.';
 const base=Math.floor(total/count*100)/100;let allocated=0,rows=[];
 for(let i=1;i<=count;i++){const v=i===count?Math.round((total-allocated)*100)/100:base;allocated=Math.round((allocated+v)*100)/100;rows.push(`${i}x/${money(v)}`)}
 return rows.join(' · ');
}

    </div>
   </div>
 </div>
 <div class="full">
   <label class="checkline"><input id="isFixed" type="checkbox"> <span>Despesa fixa</span></label>
   <div id="fixedBox" style="display:none;margin-top:10px">
    <label>Repetir até (opcional)</label><input id="repeatUntil" name="repeat_until" type="date">
    <div class="hint">Cria uma recorrência mensal. Não existe número de parcelas para despesa fixa.</div>
   </div>
 </div>`:''}
 <div class="full"><label>Observação</label><textarea name="note">${esc(t.note||'')}</textarea></div>
 </div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary">Salvar</button></div><div id="formMsg" class="msg"></div></form>`);

 const f=$('txForm');if(t.category)f.category.value=t.category;if(t.account_id)f.account_id.value=t.account_id;if(t.card_id)f.card_id.value=t.card_id;
 if(isNew){
   const cb=$('isInstallment'),fixed=$('isFixed'),box=$('installmentBox'),fbox=$('fixedBox'),inst=$('installments'),start=$('startPaymentMonth'),preview=$('installmentPreview'),amount=$('txAmount'),date=f.querySelector('[name="transaction_date"]'),type=f.querySelector('[name="transaction_type"]');
   const updatePreview=()=>{preview.textContent=installmentPreview(amount.value,inst.value)};
   const sync=()=>{const enabled=type.value==='despesa';cb.disabled=!enabled;fixed.disabled=!enabled;if(!enabled){cb.checked=false;fixed.checked=false;box.style.display='none';fbox.style.display='none'}};
   cb.onchange=()=>{box.style.display=cb.checked?'block':'none';if(cb.checked){fixed.checked=false;fbox.style.display='none';updatePreview()}};
   fixed.onchange=()=>{fbox.style.display=fixed.checked?'block':'none';if(fixed.checked){cb.checked=false;box.style.display='none'}};
   inst.oninput=updatePreview;amount.oninput=updatePreview;
   date.onchange=()=>{if(date.value)start.value=date.value.slice(0,7)};
   type.onchange=sync;sync();updatePreview();
 }
 f.onsubmit=async e=>{
   e.preventDefault();const o=Object.fromEntries(new FormData(f));o.amount=Number(o.amount);o.user_id=USER.id;
   ['account_id','card_id'].forEach(k=>{if(!o[k])o[k]=null});
   if(o.account_id&&o.card_id){$('formMsg').textContent='Escolha uma conta ou um cartão de crédito, não os dois.';return}
   if(o.card_id)o.payment_method='Cartão de crédito';
   if(!o.category){$('formMsg').textContent='Selecione uma categoria.';return}
   if(o.amount<=0){$('formMsg').textContent='Informe um valor maior que zero.';return}
   if(id){
     ['installments','start_payment_month','repeat_until'].forEach(k=>delete o[k]);
     const r=await sb.from('transactions').update(o).eq('id',id).eq('user_id',USER.id);
     if(r.error){$('formMsg').textContent=r.error.message;return}

     const n=parcelar?Math.max(2,Math.min(120,Number(o.installments||2))):1;
     const startMonth=parcelar?(o.start_payment_month||o.transaction_date.slice(0,7)):o.transaction_date.slice(0,7);
     if(parcelar&&startMonth<o.transaction_date.slice(0,7)){$('formMsg').textContent='O mês inicial do pagamento não pode ser anterior ao mês da compra.';return}
     const until=o.repeat_until||null;delete o.installments;delete o.start_payment_month;delete o.repeat_until;
     let rows=[];
     if(parcelar){
       const day=Number(o.transaction_date.slice(-2)),base=Math.floor(o.amount/n*100)/100;let allocated=0;
       for(let i=0;i<n;i++){
         const v=i===n-1?Math.round((o.amount-allocated)*100)/100:base;allocated=Math.round((allocated+v)*100)/100;
         const first=dateInMonth(startMonth,day),d=addMonths(first,i);
         rows.push({...o,amount:v,transaction_date:d,status:'pendente',description:`${o.description} (${i+1}/${n})`,note:`Compra em ${o.transaction_date}. Parcela ${i+1} de ${n}. ${o.note||''}`.trim()});
       }
     }else{
       rows=[{...o,status:o.transaction_date>localToday().date?'pendente':o.status}];
     }
     const ins=await sb.from('transactions').insert(rows);
     if(ins.error){$('formMsg').textContent=ins.error.message;return}
     if(fixed){
       const r={user_id:USER.id,name:o.description,type:'despesa',amount:o.amount,category:o.category,subcategory:o.subcategory||null,account_id:o.account_id,card_id:o.card_id,frequency:'monthly',interval:1,day_of_month:Number(o.transaction_date.slice(-2)),start_date:o.transaction_date,next_date:addMonths(o.transaction_date,1),end_date:until,active:true,auto_post:true,note:o.note||null};
       const rr=await sb.from('recurring').insert(r);
       if(rr.error){$('formMsg').textContent='Lançamento salvo, mas a despesa fixa não foi criada: '+rr.error.message;return}
     }
   }
   closeModal();await reload();toast(id?'Lançamento atualizado.':'Lançamento salvo.');
 };
}

function recurrenceNextDate(date,frequency,interval){if(frequency==='weekly')return addDays(date,7*interval);if(frequency==='yearly'){const d=new Date(date+'T12:00:00');d.setFullYear(d.getFullYear()+interval);return d.toISOString().slice(0,10)}return addMonths(date,interval)}
async function materializeRecurring(){
 const today=localToday().date;
 for(const r of DATA.recurring.filter(x=>x.active&&x.auto_post)){
  let next=r.next_date,guard=0;
  while(next&&next<=today&&guard<120){
   if(r.end_date&&next>r.end_date){await sb.from('recurring').update({active:false}).eq('id',r.id).eq('user_id',USER.id);break;}
   const exists=DATA.transactions.some(t=>t.transaction_date===next&&t.description===r.name&&Number(t.amount)===Number(r.amount)&&t.user_id===USER.id);
   if(!exists){
    const row={user_id:USER.id,transaction_date:next,description:r.name,category:r.category,subcategory:r.subcategory||null,amount:Number(r.amount||0),transaction_type:r.type,status:'realizado',payment_method:r.card_id?'Cartão de crédito':'Conta',account_id:r.account_id||null,card_id:r.card_id||null,note:r.note||null};
    const ins=await sb.from('transactions').insert(row);if(ins.error)break;
   }
   next=recurrenceNextDate(next,r.frequency,r.interval||1);guard++;
  }
  if(next!==r.next_date)await sb.from('recurring').update({next_date:next}).eq('id',r.id).eq('user_id',USER.id);
 }
}

async function deleteRow(table,id){
 if(!confirm('Excluir este registro?'))return;
 const row=(DATA[table]||[]).find(x=>x.id===id);
 if(['categories','accounts','cards'].includes(table)&&row){
   let blockers=[];
   if(table==='categories'){
     const n=normName(row.name),child=DATA.categories.filter(c=>c.id!==id&&normName(c.parent)===n).length,tx=DATA.transactions.filter(t=>normName(t.category)===n).length,rec=DATA.recurring.filter(r=>normName(r.category)===n).length;
     if(child||tx||rec)blockers.push(`${child} subcategoria(s), ${tx} lançamento(s), ${rec} recorrência(s)`);
   }
   if(table==='accounts'){const tx=DATA.transactions.filter(t=>t.account_id===id).length,rec=DATA.recurring.filter(r=>r.account_id===id).length;if(tx||rec)blockers.push(`${tx} lançamento(s), ${rec} recorrência(s)`)}
   if(table==='cards'){const tx=DATA.transactions.filter(t=>t.card_id===id).length,rec=DATA.recurring.filter(r=>r.card_id===id).length;if(tx||rec)blockers.push(`${tx} lançamento(s), ${rec} recorrência(s)`)}
   if(blockers.length){toast('Não é possível excluir: existem registros vinculados ('+blockers.join('; ')+').');return}
 }
 const r=await sb.from(table).delete().eq('id',id).eq('user_id',USER.id);if(r.error){toast(r.error.message);return}await reload();toast('Registro excluído.');
}
window.openTransaction=openTransaction;window.openAccount=openAccount;window.openCard=openCard;window.openCategory=openCategory;window.openGoal=openGoal;window.openRecurring=openRecurring;window.toggleRecurring=toggleRecurring;window.openAsset=openAsset;window.openLiability=openLiability;window.deleteRow=deleteRow;
$('loginForm').onsubmit=async e=>{e.preventDefault();$('authMsg').textContent='Entrando...';const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').textContent=error.message;return}USER=data.user;await start()};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authMsg').textContent='Preencha e-mail e senha.';return}const{data,error}=await sb.auth.signUp({email,password});if(error){$('authMsg').textContent=error.message;return}$('authMsg').textContent=data.session?'Conta criada.':'Conta criada. Confirme o e-mail para entrar.';if(data.session){USER=data.user;await start()}};
$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authMsg').textContent='Digite seu e-mail.';return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});$('authMsg').textContent=error?error.message:'Link enviado para seu e-mail.'};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=async()=>{try{await reload();toast('Dados atualizados.')}catch(e){toast(e.message)}};$('print').onclick=()=>window.print();
async function start(){
 try{await load();await materializeRecurring();await load();const td=localToday();if(FILTERS.year<2000||FILTERS.year>2100)FILTERS.year=td.year;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=USER.email||'';render()}
 catch(e){$('authMsg').textContent='Erro ao carregar seus dados: '+e.message;console.error(e)}
}
(async()=>{const{data}=await sb.auth.getSession();if(data.session){USER=data.session.user;await start()}})();
</script>
