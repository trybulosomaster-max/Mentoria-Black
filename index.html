d-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase}.kpi .value{font-size:22px;font-weight:800;margin-top:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #222}th{color:#999;font-size:10px;text-transform:uppercase}td{font-size:13px}.positive{color:var(--ok)}.negative{color:#d89595}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #333;border-radius:10px}.bar{height:9px;background:#222;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:#101010;border:1px solid #383838;border-radius:14px;padding:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.msg{min-height:20px;color:#aaa;margin-top:8px}.toast{position:fixed;right:15px;bottom:15px;background:#151515;border:1px solid #444;padding:12px;border-radius:10px;z-index:30}.small{font-size:11px}.statline{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.chart{width:100%;overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 7px;border:1px solid #444;border-radius:99px;font-size:10px}.search{max-width:330px}.dangerbox{border-color:#633}.successbox{border-color:#465b3d}@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.span8,.span6,.span4{grid-column:span 12}}@media(max-width:600px){.wrap{padding:13px}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:10px}.nav{padding-bottom:8px}}
</style></head>
<body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand">MENTORIA BLACK</div><h1>Gestão Financeira</h1><p>Planejamento, execução, patrimônio e análise em um só lugar.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><div class="row" style="margin-top:15px"><button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" id="signup">Criar conta</button><button class="btn" type="button" id="reset">Recuperar senha</button></div><div id="authMsg" class="msg"></div></form></div></section>
<section id="app" class="hidden"><div class="wrap"><header class="top"><div><div class="brand">MENTORIA BLACK</div><h1>Gestão Financeira</h1><div class="muted small" id="userEmail"></div></div><div class="actions"><button class="btn" id="refresh">Atualizar</button><button class="btn" id="print">PDF / Imprimir</button><button class="btn" id="logout">Sair</button></div></header>
<nav id="nav" class="nav"></nav><main id="view"></main></div></section>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2 id="modalTitle">Cadastro</h2><button class="btn" id="closeModal">Fechar</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL="https://mwjqfzbpjmwiscvtxvfc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Bz8zOgsayn5KRDKBa0_u_A_TbvV_RuK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0), pct=v=>(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%', esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
let USER=null, TAB='dashboard', DATA={accounts:[],cards:[],categories:[],transactions:[],budgets:[],goals:[],recurring:[],assets:[],liabilities:[],monthly:[],strategy:[],rules:[],imports:[]};
const tabs=[['dashboard','Dashboard'],['transactions','Lançamentos'],['planning','Planejamento'],['accounts','Contas'],['cards','Cartões'],['categories','Categorias'],['goals','Metas'],['recurring','Recorrências'],['wealth','Patrimônio'],['reports','Relatórios']];
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}$('closeModal').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function nav(){ $('nav').innerHTML=tabs.map(([id,label])=>`<button class="btn ${TAB===id?'active':''}" data-tab="${id}">${label}</button>`).join('');$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()}) }
async function load(){
 const names=Object.keys(DATA); for(const name of names){let q=sb.from(name).select('*').eq('user_id',USER.id);if(name==='transactions')q=q.order('transaction_date',{ascending:false});else if(name==='monthly_plans'||name==='strategy_plans')q=q.order('year',{ascending:false}).order('month',{ascending:false});else q=q.order('created_at',{ascending:false});const {data,error}=await q;if(error)throw error;DATA[name]=data||[]}
}
function layout(title,actions,body){return `<div class="row" style="justify-content:space-between;margin:10px 0 12px"><div><h2 style="margin:0">${title}</h2></div><div class="actions">${actions||''}</div></div>${body}`}
function btn(label,onclick,cls='btn'){return `<button class="${cls}" onclick="${onclick}">${label}</button>`}
function accountOptions(){return DATA.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}${a.institution?' — '+esc(a.institution):''}</option>`).join('')}
function cardOptions(){return DATA.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function categoryOptions(){return DATA.categories.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}${c.parent?' / '+esc(c.parent):''}</option>`).join('')}
function dashboard(){
 const now=new Date(), ym=now.toISOString().slice(0,7), tx=DATA.transactions.filter(t=>String(t.transaction_date).slice(0,7)===ym), income=tx.filter(t=>t.transaction_type==='receita').reduce((a,t)=>a+Number(t.amount),0), expense=tx.filter(t=>['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount),0), invest=tx.filter(t=>t.transaction_type==='investimento').reduce((a,t)=>a+Number(t.amount),0), fixed=tx.filter(t=>t.category==='Gastos Fixos').reduce((a,t)=>a+Number(t.amount),0), assets=DATA.assets.reduce((a,x)=>a+Number(x.current_value),0), debt=DATA.liabilities.reduce((a,x)=>a+Number(x.balance),0), net=assets+DATA.accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance),0)-debt;
 const bycat={};tx.filter(t=>t.transaction_type==='despesa').forEach(t=>bycat[t.category]=(bycat[t.category]||0)+Number(t.amount));const rows=Object.entries(bycat).sort((a,b)=>b[1]-a[1]).slice(0,8);
 return layout('Dashboard',btn('+ Lançamento','openTransaction()','btn primary'),`<div class="kpis">${kpi('Receitas',money(income),'mês atual')}${kpi('Despesas',money(expense),'inclui investimentos')}${kpi('Saldo',money(income-expense),income-expense>=0?'positivo':'atenção')}${kpi('Investimentos',money(invest),'mês atual')}${kpi('Gastos fixos',money(fixed),'mês atual')}${kpi('Patrimônio líquido',money(net),'estimado')}</div><div class="grid"><section class="card span8"><h2>Gastos por categoria</h2><p class="muted">Mês atual</p>${rows.length?rows.map(([c,v])=>`<div class="statline"><span>${esc(c)}</span><strong>${money(v)}</strong></div><div class="bar"><i style="width:${Math.min(100,v/(rows[0]?.[1]||1)*100)}%"></i></div>`).join(''):'<div class="empty">Ainda não há despesas neste mês.</div>'}</section><section class="card span4"><h2>Visão rápida</h2><p class="muted">Indicadores operacionais</p><div class="statline"><span>Contas</span><strong>${DATA.accounts.length}</strong></div><div class="statline"><span>Cartões</span><strong>${DATA.cards.length}</strong></div><div class="statline"><span>Metas</span><strong>${DATA.goals.length}</strong></div><div class="statline"><span>Recorrências ativas</span><strong>${DATA.recurring.filter(x=>x.active).length}</strong></div></section><section class="card span12"><h2>Últimos lançamentos</h2>${transactionTable(DATA.transactions.slice(0,8))}</section></div>`)
}
function kpi(l,v,s){return `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="muted small">${s}</div></div>`}
function transactionTable(arr){if(!arr.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';return `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Conta/Cartão</th><th>Valor</th><th></th></tr></thead><tbody>${arr.map(t=>{const rel=t.account_id?DATA.accounts.find(a=>a.id===t.account_id)?.name:t.card_id?DATA.cards.find(c=>c.id===t.card_id)?.name:'';return `<tr><td>${fmtDate(t.transaction_date)}</td><td>${esc(t.description)}</td><td>${esc(t.category)}${t.subcategory?' / '+esc(t.subcategory):''}</td><td>${esc(t.transaction_type)}</td><td>${esc(rel||'')}</td><td class="${['receita','resgate'].includes(t.transaction_type)?'positive':'negative'}">${money(t.amount)}</td><td>${btn('Editar',`openTransaction('${t.id}')`)} ${btn('Excluir',`deleteRow('transactions','${t.id}')`,'btn danger')}</td></tr>`}).join('')}</tbody></table></div>`}
function transactions(){return layout('Lançamentos',btn('+ Novo lançamento','openTransaction()','btn primary'),`<div class="card"><div class="row"><input class="search" id="txSearch" placeholder="Buscar descrição/categoria"><select id="txType"><option value="">Todos</option><option>receita</option><option>despesa</option><option>transferencia</option><option>investimento</option><option>resgate</option></select></div><div id="txList" style="margin-top:12px"></div></div>`)}
function refreshTx(){const q=($('txSearch')?.value||'').toLowerCase(),typ=$('txType')?.value||'';let arr=DATA.transactions.filter(t=>(!typ||t.transaction_type===typ)&&(!q||`${t.description} ${t.category} ${t.subcategory||''}`.toLowerCase().includes(q)));$('txList').innerHTML=transactionTable(arr)}
function openTransaction(id){const t=id?DATA.transactions.find(x=>x.id===id):{};modal(id?'Editar lançamento':'Novo lançamento',`<form id="txForm"><div class="formgrid"><div><label>Data</label><input name="transaction_date" type="date" value="${t.transaction_date||new Date().toISOString().slice(0,10)}" required></div><div><label>Tipo</label><select name="transaction_type"><option ${t.transaction_type==='despesa'?'selected':''}>despesa</option><option ${t.transaction_type==='receita'?'selected':''}>receita</option><option ${t.transaction_type==='transferencia'?'selected':''}>transferencia</option><option ${t.transaction_type==='investimento'?'selected':''}>investimento</option><option ${t.transaction_type==='resgate'?'selected':''}>resgate</option></select></div><div class="full"><label>Descrição</label><input name="description" required value="${esc(t.description||'')}"></div><div><label>Categoria</label><select name="category"><option value="">Selecione</option>${categoryOptions()}</select></div><div><label>Subcategoria</label><input name="subcategory" value="${esc(t.subcategory||'')}"></div><div><label>Valor</label><input name="amount" type="number" step="0.01" min="0" required value="${t.amount??''}"></div><div><label>Status</label><select name="status"><option>realizado</option><option ${t.status==='pendente'?'selected':''}>pendente</option><option ${t.status==='cancelado'?'selected':''}>cancelado</option></select></div><div><label>Conta</label><select name="account_id"><option value="">Nenhuma</option>${accountOptions()}</select></div><div><label>Cartão</label><select name="card_id"><option value="">Nenhum</option>${cardOptions()}</select></div><div><label>Forma de pagamento</label><input name="payment_method" value="${esc(t.payment_method||'')}"></div><div class="full"><label>Observação</label><textarea name="note">${esc(t.note||'')}</textarea></div></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary">Salvar</button></div><div id="formMsg" class="msg"></div></form>`);const f=$('txForm');if(t.category)f.category.value=t.category;if(t.account_id)f.account_id.value=t.account_id;if(t.card_id)f.card_id.value=t.card_id;f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));o.amount=Number(o.amount);o.user_id=USER.id;for(const k of ['account_id','card_id'])if(!o[k])o[k]=null;const res=id?await sb.from('transactions').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('transactions').insert(o);if(res.error){$('formMsg').textContent=res.error.message;return}closeModal();await reload();toast('Lançamento salvo.')}}
function simpleTable(title,arr,cols,actions=''){return `<div class="card"><h2>${title}</h2><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>${arr.length?arr.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}<td>${actions?actions(x):''}</td></tr>`).join(''):`<tr><td colspan="${cols.length+1}"><div class="empty">Nenhum registro.</div></td></tr>`}</tbody></table></div></div>`}
function accounts(){return layout('Contas',btn('+ Conta','openAccount()','btn primary'),simpleTable('Contas cadastradas',DATA.accounts,[['Nome',x=>esc(x.name)],['Instituição',x=>esc(x.institution||'')],['Tipo',x=>esc(x.account_type)],['Saldo',x=>money(x.statement_balance??x.opening_balance)]],x=>`${btn('Editar',`openAccount('${x.id}')`)} ${btn('Excluir',`deleteRow('accounts','${x.id}')`,'btn danger')}`))}
function openAccount(id){const x=id?DATA.accounts.find(a=>a.id===id):{};modal(id?'Editar conta':'Nova conta',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required value="${esc(x.name||'')}"></div><div><label>Instituição</label><input name="institution" value="${esc(x.institution||'')}"></div><div><label>Tipo</label><select name="account_type"><option>checking</option><option>savings</option><option>investment</option><option>cash</option></select></div><div><label>Saldo inicial</label><input name="opening_balance" type="number" step="0.01" value="${x.opening_balance??0}"></div><div><label>Saldo informado</label><input name="statement_balance" type="number" step="0.01" value="${x.statement_balance??x.opening_balance??0}"></div><div class="full"><label>Observação</label><textarea name="note">${esc(x.note||'')}</textarea></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').account_type.value=x.account_type||'checking';$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;o.opening_balance=Number(o.opening_balance||0);o.statement_balance=Number(o.statement_balance||0);const r=id?await sb.from('accounts').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('accounts').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Conta salva.')}}
function cards(){return layout('Cartões',btn('+ Cartão','openCard()','btn primary'),simpleTable('Cartões cadastrados',DATA.cards,[['Nome',x=>esc(x.name)],['Instituição',x=>esc(x.institution||'')],['Limite',x=>money(x.limit)],['Fechamento',x=>x.closing_day||'—'],['Vencimento',x=>x.due_day||'—']],x=>`${btn('Editar',`openCard('${x.id}')`)} ${btn('Excluir',`deleteRow('cards','${x.id}')`,'btn danger')}`))}
function openCard(id){const x=id?DATA.cards.find(a=>a.id===id):{};modal(id?'Editar cartão':'Novo cartão',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required value="${esc(x.name||'')}"></div><div><label>Instituição</label><input name="institution" value="${esc(x.institution||'')}"></div><div><label>Bandeira</label><input name="brand" value="${esc(x.brand||'')}"></div><div><label>Limite</label><input name="limit" type="number" step="0.01" min="0" value="${x.limit??0}"></div><div><label>Dia fechamento</label><input name="closing_day" type="number" min="1" max="31" value="${x.closing_day??''}"></div><div><label>Dia vencimento</label><input name="due_day" type="number" min="1" max="31" value="${x.due_day??''}"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;o.limit=Number(o.limit||0);o.closing_day=o.closing_day?Number(o.closing_day):null;o.due_day=o.due_day?Number(o.due_day):null;const r=id?await sb.from('cards').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('cards').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Cartão salvo.')}}
function categories(){return layout('Categorias e subcategorias',btn('+ Categoria','openCategory()','btn primary'),simpleTable('Categorias',DATA.categories,[['Categoria',x=>esc(x.name)],['Tipo',x=>esc(x.kind||'')],['Subcategoria de',x=>esc(x.parent||'—')]],x=>btn('Excluir',`deleteRow('categories','${x.id}')`,'btn danger')))}
function openCategory(){modal('Nova categoria',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required></div><div><label>Categoria pai (subcategoria)</label><select name="parent"><option value="">Nenhuma</option>${categoryOptions()}</select></div><div><label>Tipo</label><select name="kind"><option>despesa</option><option>receita</option><option>ambos</option></select></div><div><label>Cor</label><input name="color" value="#c9a227"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;o.parent=o.parent||null;const r=await sb.from('categories').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Categoria criada.')}}
function planning(){const ym=new Date().toISOString().slice(0,7),[y,m]=ym.split('-').map(Number),p=DATA.monthly.find(x=>x.year===y&&x.month===m)||{},s=DATA.strategy.find(x=>x.year===y&&x.month===m)||{};return layout('Planejamento',btn('+ Planejamento','openPlan()','btn primary'),`<div class="kpis">${kpi('Receita planejada',money(p.revenue),'mês atual')}${kpi('Gastos fixos',money(p.fixed_expenses),'planejado')}${kpi('Investimentos',money(p.investments),'planejado')}${kpi('Conforto',money(p.comfort),'planejado')}${kpi('Metas',money(p.goals),'planejado')}${kpi('Lazer + conhecimento',money(Number(p.leisure||0)+Number(p.knowledge||0)),'planejado')}</div><div class="grid"><section class="card span6"><h2>Estratégia percentual</h2>${[['Gastos Fixos','fixed_expenses_pct'],['Investimentos','investments_pct'],['Conforto','comfort_pct'],['Metas','goals_pct'],['Lazer','leisure_pct'],['Conhecimento','knowledge_pct']].map(([l,k])=>`<div class="statline"><span>${l}</span><strong>${pct(s[k])}</strong></div>`).join('')}</section><section class="card span6"><h2>Planejamento mensal</h2>${[['Receita','revenue'],['Gastos Fixos','fixed_expenses'],['Investimentos','investments'],['Conforto','comfort'],['Metas','goals'],['Lazer','leisure'],['Conhecimento','knowledge']].map(([l,k])=>`<div class="statline"><span>${l}</span><strong>${money(p[k])}</strong></div>`).join('')}</section></div>`)}
function openPlan(){const now=new Date(),p=DATA.monthly.find(x=>x.year===now.getFullYear()&&x.month===now.getMonth()+1)||{};modal('Planejamento mensal',`<form id="f"><div class="formgrid"><div><label>Ano</label><input name="year" type="number" value="${p.year||now.getFullYear()}"></div><div><label>Mês</label><input name="month" type="number" min="1" max="12" value="${p.month||now.getMonth()+1}"></div>${[['revenue','Receita'],['fixed_expenses','Gastos Fixos'],['investments','Investimentos'],['comfort','Conforto'],['goals','Metas'],['leisure','Lazer'],['knowledge','Conhecimento']].map(([k,l])=>`<div><label>${l}</label><input name="${k}" type="number" step="0.01" value="${p[k]??0}"></div>`).join('')}</div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));Object.keys(o).forEach(k=>{if(['year','month'].includes(k))o[k]=Number(o[k]);else o[k]=Number(o[k]||0)});o.user_id=USER.id;let q=DATA.monthly.find(x=>x.year===o.year&&x.month===o.month);const r=q?await sb.from('monthly_plans').update(o).eq('id',q.id).eq('user_id',USER.id):await sb.from('monthly_plans').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Planejamento salvo.')}}
function goals(){return layout('Metas',btn('+ Meta','openGoal()','btn primary'),simpleTable('Metas financeiras',DATA.goals,[['Meta',x=>esc(x.name)],['Atual',x=>money(x.current)],['Objetivo',x=>money(x.target)],['Progresso',x=>pct(Number(x.target)?Number(x.current)/Number(x.target)*100:0)],['Prazo',x=>fmtDate(x.deadline)]],x=>`${btn('Editar',`openGoal('${x.id}')`)} ${btn('Excluir',`deleteRow('goals','${x.id}')`,'btn danger')}`))}
function openGoal(id){const x=id?DATA.goals.find(a=>a.id===id):{};modal(id?'Editar meta':'Nova meta',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required value="${esc(x.name||'')}"></div><div><label>Objetivo</label><input name="target" type="number" step="0.01" value="${x.target??0}"></div><div><label>Atual</label><input name="current" type="number" step="0.01" value="${x.current??0}"></div><div><label>Prazo</label><input name="deadline" type="date" value="${x.deadline||''}"></div><div><label>Cadência</label><input name="cadence" value="${esc(x.cadence||'monthly')}"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;o.target=Number(o.target||0);o.current=Number(o.current||0);const r=id?await sb.from('goals').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('goals').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Meta salva.')}}
function recurring(){return layout('Recorrências',btn('+ Recorrência','openRecurring()','btn primary'),simpleTable('Lançamentos recorrentes',DATA.recurring,[['Nome',x=>esc(x.name)],['Tipo',x=>esc(x.type)],['Valor',x=>money(x.amount)],['Frequência',x=>esc(x.frequency)],['Próxima',x=>fmtDate(x.next_date)],['Ativa',x=>x.active?'Sim':'Não']],x=>`${btn('Excluir',`deleteRow('recurring','${x.id}')`,'btn danger')}`))}
function openRecurring(){modal('Nova recorrência',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required></div><div><label>Tipo</label><select name="type"><option>despesa</option><option>receita</option><option>investimento</option></select></div><div><label>Valor</label><input name="amount" type="number" step="0.01"></div><div><label>Categoria</label><input name="category"></div><div><label>Subcategoria</label><input name="subcategory"></div><div><label>Conta</label><select name="account_id"><option value="">Nenhuma</option>${accountOptions()}</select></div><div><label>Cartão</label><select name="card_id"><option value="">Nenhum</option>${cardOptions()}</select></div><div><label>Frequência</label><select name="frequency"><option>monthly</option><option>weekly</option><option>yearly</option></select></div><div><label>Próxima data</label><input name="next_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;o.amount=Number(o.amount||0);o.interval=1;o.start_date=o.next_date;o.active=true;o.auto_post=false;o.account_id=o.account_id||null;o.card_id=o.card_id||null;const r=await sb.from('recurring').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Recorrência criada.')}}
function wealth(){const assets=DATA.assets.reduce((a,x)=>a+Number(x.current_value),0),liab=DATA.liabilities.reduce((a,x)=>a+Number(x.balance),0),cash=DATA.accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance),0);return layout('Patrimônio',btn('+ Ativo','openAsset()','btn primary')+btn('+ Passivo','openLiability()'),`<div class="kpis">${kpi('Disponível em contas',money(cash),'saldo informado')}${kpi('Ativos',money(assets),'valor atual')}${kpi('Passivos',money(liab),'saldo devedor')}${kpi('Patrimônio líquido',money(cash+assets-liab),'estimativa')}</div><div class="grid">${simpleTable('Ativos',DATA.assets,[['Ativo',x=>esc(x.name)],['Tipo',x=>esc(x.asset_type)],['Instituição',x=>esc(x.institution||'')],['Valor atual',x=>money(x.current_value)]],x=>btn('Excluir',`deleteRow('assets','${x.id}')`,'btn danger'))}${simpleTable('Passivos',DATA.liabilities,[['Dívida',x=>esc(x.name)],['Tipo',x=>esc(x.liability_type)],['Saldo',x=>money(x.balance)],['Parcela',x=>money(x.monthly_payment)]],x=>btn('Excluir',`deleteRow('liabilities','${x.id}')`,'btn danger'))}</div>`)}
function openAsset(){modal('Novo ativo',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required></div><div><label>Tipo</label><input name="asset_type" value="investment"></div><div><label>Instituição</label><input name="institution"></div><div><label>Custo</label><input name="cost_basis" type="number" step="0.01"></div><div><label>Valor atual</label><input name="current_value" type="number" step="0.01"></div><div><label>Quantidade</label><input name="quantity" type="number" step="0.00000001"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;['cost_basis','current_value','quantity'].forEach(k=>o[k]=o[k]?Number(o[k]):0);const r=await sb.from('assets').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Ativo salvo.')}}
function openLiability(){modal('Novo passivo',`<form id="f"><div class="formgrid"><div><label>Nome</label><input name="name" required></div><div><label>Tipo</label><input name="liability_type" value="loan"></div><div><label>Principal</label><input name="principal" type="number" step="0.01"></div><div><label>Saldo</label><input name="balance" type="number" step="0.01"></div><div><label>Taxa</label><input name="interest_rate" type="number" step="0.0001"></div><div><label>Parcela mensal</label><input name="monthly_payment" type="number" step="0.01"></div><div><label>Vencimento</label><input name="due_date" type="date"></div></div><button class="btn primary">Salvar</button><div id="formMsg" class="msg"></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.user_id=USER.id;['principal','balance','interest_rate','monthly_payment'].forEach(k=>o[k]=Number(o[k]||0));const r=await sb.from('liabilities').insert(o);if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Passivo salvo.')}}
function reports(){const tx=DATA.transactions, income=tx.filter(t=>t.transaction_type==='receita').reduce((a,t)=>a+Number(t.amount),0),expense=tx.filter(t=>['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount),0);const by={};tx.filter(t=>t.transaction_type==='despesa').forEach(t=>by[t.category]=(by[t.category]||0)+Number(t.amount));const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);return layout('Relatórios',`<span class="pill">${tx.length} lançamentos</span>`,`<div class="kpis">${kpi('Receita total',money(income),'base carregada')}${kpi('Despesa total',money(expense),'base carregada')}${kpi('Saldo',money(income-expense),'receita - despesas')}${kpi('Taxa de poupança',pct(income?(income-expense)/income*100:0),'indicador')}</div><div class="grid"><section class="card span6"><h2>Despesas por categoria</h2>${rows.length?rows.map(([c,v])=>`<div class="statline"><span>${esc(c)}</span><strong>${money(v)}</strong></div><div class="bar"><i style="width:${Math.min(100,v/(rows[0]?.[1]||1)*100)}%"></i></div>`).join(''):'<div class="empty">Sem despesas.</div>'}</section><section class="card span6"><h2>Planejado × realizado</h2>${planCompare()}</section></div>`)}
function planCompare(){const y=new Date().getFullYear(),m=new Date().getMonth()+1,p=DATA.monthly.find(x=>x.year===y&&x.month===m);if(!p)return '<div class="empty">Cadastre o planejamento do mês para comparar.</div>';const planned=Number(p.fixed_expenses||0)+Number(p.investments||0)+Number(p.comfort||0)+Number(p.goals||0)+Number(p.leisure||0)+Number(p.knowledge||0);const actual=DATA.transactions.filter(t=>String(t.transaction_date).slice(0,7)===`${y}-${String(m).padStart(2,'0')}`&&['despesa','investimento'].includes(t.transaction_type)).reduce((a,t)=>a+Number(t.amount),0);return `<div class="statline"><span>Planejado</span><strong>${money(planned)}</strong></div><div class="statline"><span>Realizado</span><strong>${money(actual)}</strong></div><div class="statline"><span>Execução</span><strong>${pct(planned?actual/planned*100:0)}</strong></div><div class="bar"><i style="width:${Math.min(100,planned?actual/planned*100:0)}%"></i></div>`}
function render(){nav();let html=TAB==='dashboard'?dashboard():TAB==='transactions'?transactions():TAB==='planning'?planning():TAB==='accounts'?accounts():TAB==='cards'?cards():TAB==='categories'?categories():TAB==='goals'?goals():TAB==='recurring'?recurring():TAB==='wealth'?wealth():reports();$('view').innerHTML=html;if(TAB==='transactions'){refreshTx();$('txSearch').oninput=refreshTx;$('txType').onchange=refreshTx}}
async function reload(){await load();render()}
async function deleteRow(table,id){if(!confirm('Excluir este registro?'))return;const r=await sb.from(table).delete().eq('id',id).eq('user_id',USER.id);if(r.error){toast(r.error.message);return}await reload();toast('Registro excluído.')}
window.openTransaction=openTransaction;window.openAccount=openAccount;window.openCard=openCard;window.openCategory=openCategory;window.openGoal=openGoal;window.openRecurring=openRecurring;window.openAsset=openAsset;window.openLiability=openLiability;window.deleteRow=deleteRow;
$('loginForm').onsubmit=async e=>{e.preventDefault();$('authMsg').textContent='Entrando...';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').textContent=error.message;return}USER=data.user;await start()};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authMsg').textContent='Preencha e-mail e senha.';return}const {data,error}=await sb.auth.signUp({email,password});if(error){$('authMsg').textContent=error.message;return}$('authMsg').textContent=data.session?'Conta criada.':'Conta criada. Confirme o e-mail para entrar.';if(data.session){USER=data.user;await start()}};
$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authMsg').textContent='Digite seu e-mail.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});$('authMsg').textContent=error?error.message:'Link enviado para seu e-mail.'};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=async()=>{try{await reload();toast('Dados atualizados.')}catch(e){toast(e.message)}};$('print').onclick=()=>window.print();
async function start(){try{await load();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=USER.email||'';render()}catch(e){$('authMsg').textContent='Erro ao carregar seus dados: '+e.message;console.error(e)}}
(async()=>{const {data}=await sb.auth.getSession();if(data.session){USER=data.session.user;await start()}})();
</script></body></html>
