const SUPABASE_URL="https://mwjqfzbpjmwiscvtxvfc.supabase.co";

function toast(msg,err=false){$("toastBox").textContent=msg;$("toastBox").className=err?"errorbox":"notice";$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),3500)}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}

$("closeModal").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function deleteChoiceModal(title,subtitle,options){
 return new Promise(resolve=>{
   let selected=options[0]?.value||null;
   const rows=options.map((o,i)=>`<label class="delete-option ${i===0?"active":""}" data-value="${o.value}"><span class="copy"><span class="title">${o.title}</span><span class="desc">${o.desc||""}</span></span><input class="delete-radio" type="radio" name="deleteChoice" value="${o.value}" ${i===0?"checked":""}></label>`).join("");
   modal(title,`<div class="desc" style="margin-top:8px">${subtitle||""}</div><div class="delete-choice">${rows}</div><div class="modal-foot"><button type="button" class="btn" id="deleteChoiceCancel">Cancelar</button><button type="button" class="btn danger-action" id="deleteChoiceOk">Excluir</button></div>`);
   document.querySelectorAll(".delete-option").forEach(el=>el.onclick=()=>{
     selected=el.dataset.value;
     document.querySelectorAll(".delete-option").forEach(x=>x.classList.remove("active"));
     el.classList.add("active");
     const r=el.querySelector("input"); if(r) r.checked=true;
   });
   $("deleteChoiceCancel").onclick=()=>{closeModal();resolve(null)};
   $("deleteChoiceOk").onclick=()=>{closeModal();resolve(selected)};
 });
}

function categoryColor(name){

  const norm=s=>String(s??"").trim().toLowerCase();
  const cat=cats.find(c=>!c.parent&&norm(c.name)===norm(canonical))
           ||cats.find(c=>norm(c.name)===norm(canonical));
  return cat?.color
    ||DEFAULT_COLORS[Math.max(0,CAT_ORDER.indexOf(canonical))%DEFAULT_COLORS.length]
    ||"#c9a227";
}
function canonicalCategoryName(name, transactionType){
  const raw=String(name??"").trim();
  const cats=Array.isArray(DATA.categories)?DATA.categories:[];
  const norm=s=>String(s??"").trim().toLowerCase();
  const currentInvestment=()=>cats.find(c=>!c.parent&&norm(c.name)==="investimentos");

  // Normalize historical labels BEFORE exact lookup.
  // This prevents an old transaction label from surviving a category rename.
  const legacyInvestment=norm(raw).includes("liberdade") && norm(raw).includes("financeira");
  if(legacyInvestment || transactionType==="investimento"){
    const inv=currentInvestment();
    if(inv) return inv.name;
  }

  const exact=cats.find(c=>norm(c.name)===norm(raw));
  if(exact) return exact.parent||exact.name;
  return raw||"Sem categoria";
}

async function deleteTransactionSmart(id){
 const t=DATA.transactions.find(x=>x.id===id); if(!t)return;
 const note=String(t.note||"");
 const m=note.match(/Parcelado\s+(\d+)\/(\d+)\s+•\s+Compra\s+(\d{4}-\d{2})/i);
 if(!m){ 
   const choice=await deleteChoiceModal("Excluir lançamento","Esta ação excluirá o lançamento selecionado.",[
     {value:"one",title:"Somente este lançamento",desc:"Exclui apenas o registro selecionado."}
   ]);
   if(choice!=="one")return;
   const r=await sb.from("transactions").delete().eq("id",id).eq("user_id",USER.id);
   if(r.error){toast(r.error.message,true);return}
   await reload();toast("Lançamento excluído.");
   return;
 }
 const current=Number(m[1]), total=Number(m[2]), buy=m[3];
 const parseParcel=x=>String(x.note||"").match(/Parcelado\s+(\d+)\/(\d+)\s+•\s+Compra\s+(\d{4}-\d{2})/i);
 const group=DATA.transactions.filter(x=>{
   const q=parseParcel(x);
   return q && Number(q[2])===total && q[3]===buy;
 });
 const choice=await deleteChoiceModal("Excluir despesa parcelada",`Esta é a parcela ${current}/${total}. Escolha o que deseja apagar.`,[
   {value:"one",title:"Somente esta parcela",desc:"Mantém as demais parcelas desta compra."},
   {value:"future",title:"Esta parcela e as futuras",desc:`Exclui da parcela ${current}/${total} até a última parcela.`},
   {value:"all",title:"Todas as parcelas desta compra",desc:`Exclui as ${group.length} parcelas vinculadas a esta compra.`}
 ]);
 if(!choice)return;
 let ids=[];
 if(choice==="one") ids=[id];
 else if(choice==="future") ids=group.filter(x=>{const q=parseParcel(x);return Number(q[1])>=current}).map(x=>x.id);
 else ids=group.map(x=>x.id);
 if(!ids.length)return;
 const r=await sb.from("transactions").delete().in("id",ids).eq("user_id",USER.id);
 if(r.error){toast("Não foi possível excluir as parcelas: "+r.error.message,true);return}
 await reload();
 toast(choice==="one"?"Somente esta parcela foi excluída.":`${ids.length} parcela(s) excluída(s).`);
}

function reportStatus(t){
 if(t?.state)return t.state==='efetivado'?'realizado':t.state==='previsto_materializado'?'programado':t.state;
 if(typeof window==='undefined'||!window.MBCanonicalFinance){if(MBFinance.isCancelled(t))return 'cancelado';const legacy=String(t.status||'').toLowerCase();return ['pendente','pending','programado','scheduled'].includes(legacy)?'pendente':'realizado'}

function matchesReportPeriod(transaction,filters=REPORT_FILTERS){
 const date=MBFinance.financialDate(transaction);if(!date)return false;
 const year=Number(date.slice(0,4)),month=Number(date.slice(5,7));
 if(filters.periodMode==="custom")return (!filters.dateFrom||date>=filters.dateFrom)&&(!filters.dateTo||date<=filters.dateTo);
 if(filters.periodMode==="multi")return !filters.years?.length||filters.years.map(Number).includes(year);
 if(filters.periodMode==="year")return year===Number(filters.year);
 return year===Number(filters.year)&&month===Number(filters.month);
}
function matchesReportType(transaction,filters=REPORT_FILTERS){return !filters.types?.length||filters.types.includes(MBFinance.kind(transaction.transaction_type||transaction.type))}

 if(!filters.category)return true;

function matchesReportStatus(transaction,filters=REPORT_FILTERS){
 const date=MBFinance.financialDate(transaction),today=new Date().toISOString().slice(0,10);
 if(filters.includeFuture===false&&date>today)return false;

function matchesReportAccount(transaction,filters=REPORT_FILTERS){

   (!filters.cardId||String(transaction.card_id||"")===String(filters.cardId))&&
   (!filters.goalId||String(transaction.goal_id||"")===String(filters.goalId));

function buildReportDataset(filters=REPORT_FILTERS){

  const result=window.MBReportsV82.projectReport(DATA.transactions||[],DATA.recurring||[],{...filters,states,now});
  return result.rows.map(row=>({...row,transaction_date:row.date,status:row.state==='efetivado'?'realizado':row.state==='previsto_materializado'?'programado':row.state}));
 }

   matchesReportPeriod(t,filters)&&matchesReportType(t,filters)&&matchesReportCategory(t,filters)&&matchesReportStatus(t,filters)&&matchesReportAccount(t,filters)
 ).sort((a,b)=>MBFinance.financialDate(b).localeCompare(MBFinance.financialDate(a)));

function aggregateReportBy(rows,keyFn){

function reportAggregations(rows){

  const byType=reportTotalsByType(rows),realized=rows.filter(row=>row.state==='efetivado'),sum=(type)=>realized.filter(row=>MBFinance.kind(row.transaction_type||row.type)===type).reduce((total,row)=>total+Number(row.amount||0),0);

 }

async function deleteRow(table,id){
 const row=DATA[table]?.find(x=>x.id===id);if(!row)return;
 if(table==="categories"||table==="accounts"||table==="cards"){
   const blockers=[];
   if(table==="categories"){
     const n=String(row.name||"").toLowerCase();
     const child=DATA.categories.filter(c=>String(c.parent||"").toLowerCase()===n).length;
     const tx=DATA.transactions.filter(t=>String(t.category||"").toLowerCase()===n).length;
     const rec=DATA.recurring.filter(r=>String(r.category||"").toLowerCase()===n).length;
     if(child||tx||rec)blockers.push(`${child} subcategoria(s), ${tx} lançamento(s), ${rec} recorrência(s)`);
   }
   if(table==="accounts"){
     const tx=DATA.transactions.filter(t=>t.account_id===id).length,rec=DATA.recurring.filter(r=>r.account_id===id).length;
     if(tx||rec)blockers.push(`${tx} lançamento(s), ${rec} recorrência(s)`);
   }
   if(table==="cards"){
     const tx=DATA.transactions.filter(t=>t.card_id===id).length,rec=DATA.recurring.filter(r=>r.card_id===id).length;
     if(tx||rec)blockers.push(`${tx} lançamento(s), ${rec} recorrência(s)`);
   }
   if(blockers.length){toast("Não é possível excluir: existem registros vinculados ("+blockers.join("; ")+").",true);return}
 }
 if(table==="recurring"){
   const linked=DATA.transactions.filter(t=>String(t.note||"").includes(`Recorrência automática • ${id}`));
   const choice=await deleteChoiceModal("Excluir recorrência",`O que você deseja apagar da regra "${row.name}"?`,[
     {value:"rule",title:"Somente a recorrência",desc:"Exclui a regra e mantém os lançamentos já criados."},
     {value:"future",title:"Recorrência e lançamentos futuros",desc:"Exclui a regra e os lançamentos futuros ainda pendentes."}
   ]);
   if(!choice)return;
   if(choice==="future"&&linked.length){
     const today=new Date(); today.setHours(0,0,0,0);
     const ids=linked.filter(t=>t.status==="pendente"&&new Date(t.transaction_date+"T12:00:00")>=today).map(t=>t.id);
     if(ids.length){
       const dr=await sb.from("transactions").delete().in("id",ids).eq("user_id",USER.id);
       if(dr.error){toast("Regra não excluída: "+dr.error.message,true);return}
     }
   }
 } else {
   const choice=await deleteChoiceModal("Excluir registro","Esta ação excluirá o registro selecionado.",[
     {value:"one",title:"Excluir este registro",desc:"O registro será removido permanentemente."}
   ]);
   if(choice!=="one")return;
 }
 const r=await sb.from(table).delete().eq("id",id).eq("user_id",USER.id);
 if(r.error){toast(r.error.message,true);return}
 await reload();toast(table==="recurring"?"Recorrência excluída.":"Registro excluído.");
}

/* V18 session bootstrap replaces the original bootstrap. */
if("serviceWorker" in navigator){
  const MB_SW_VERSION="24";
  try{
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(sessionStorage.getItem("mb-v24-reloaded")==="1")return;
      sessionStorage.setItem("mb-v24-reloaded","1");
      location.reload();
    });
  }catch(e){}
  navigator.serviceWorker.register("./sw.js?v="+MB_SW_VERSION,{updateViaCache:"none"})
    .then(r=>r.update())
    .catch(console.warn);
}

/* ================= MENTORIA BLACK V18 =================
   Recorrências materializadas com horizonte de 12 meses e carregadas antes do primeiro render.
*/
(function(){
  function addMonthsV17(dateStr,n){
    const d=new Date(String(dateStr)+"T12:00:00");
    const day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+Number(n||0));
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
    return d.toISOString().slice(0,10);
  }
  window.addMonthsV16=addMonthsV17;
  window.addMonthsV17=addMonthsV17;

  function recurrenceSignature(t){
    const note=String(t.note||"");
    const source=(note.match(/Recorrência automática • ([0-9a-f-]{8,})/i)||[])[1]||"";
    return [source,t.transaction_date,t.transaction_type,String(t.description||"").trim().toLowerCase(),String(t.category||"").trim().toLowerCase(),Number(t.amount||0).toFixed(2),t.account_id||"",t.card_id||""].join("|");
  }

  async function materializeRecurringV17(){
    if(!USER || !Array.isArray(DATA.recurring)) return {transactions:[],updated:[]};
    const today=new Date();today.setHours(12,0,0,0);
    const horizon=new Date(today);horizon.setMonth(horizon.getMonth()+12);
    const existing=new Set((DATA.transactions||[]).map(recurrenceSignature));
    const pending=[], updated=[];
    for(const r of DATA.recurring.filter(x=>x.active!==false)){
      let cursor=r.next_date;
      if(!cursor) continue;
      let guard=0;
      while(cursor && new Date(cursor+"T12:00:00")<=horizon && guard<240){
        if(r.end_date && cursor>r.end_date) break;
        const row={
          user_id:USER.id, transaction_date:cursor, description:r.name,
          category:r.category||null, subcategory:r.subcategory||null, amount:Number(r.amount||0),
          transaction_type:r.type||"despesa",
          status:new Date(cursor+"T12:00:00")<=today?"realizado":"pendente",
          payment_method:r.card_id?"Cartão de crédito":"Conta",
          account_id:r.account_id||null, card_id:r.card_id||null,
          goal_id:r.goal_id||null, goal_effect:r.goal_id?(r.goal_effect||'contribution'):null,
          note:(String(r.note||"").trim()?String(r.note).trim()+" • ":"")+`Recorrência automática • ${r.id}`
        };
        const sig=recurrenceSignature(row);
        if(!existing.has(sig)){ pending.push(row); existing.add(sig); }
        cursor=addMonthsV17(cursor,Number(r.interval||1)); guard++;
      }
      if(cursor && cursor!==r.next_date) updated.push({id:r.id,next_date:cursor});
    }
    if(pending.length){
      const inserted=[];
      for(let i=0;i<pending.length;i+=100){
        const batch=pending.slice(i,i+100);
        const ins=await sb.from("transactions").insert(batch).select();
        if(ins.error) throw new Error("Falha ao gerar recorrências: "+ins.error.message);
        if(ins.data?.length) inserted.push(...ins.data);
      }
      pending.length=0;
      pending.push(...inserted);
    }
    if(updated.length){
      await Promise.all(updated.map(async u=>{
        const r=await sb.from("recurring").update({next_date:u.next_date}).eq("id",u.id).eq("user_id",USER.id);
        if(r.error)console.error("V18 next_date",r.error);
        const local=DATA.recurring.find(x=>x.id===u.id);if(local)local.next_date=u.next_date;
      }));
    }
    return {transactions:pending,updated};
  }
  // V18 lifecycle: one parallel load + one batched materialization, avoiding the old double reload.
  window.reload=async function(){
    await load();
    const result=await materializeRecurringV17();
    if(result?.transactions?.length) DATA.transactions.push(...result.transactions);
    render();
  };

  window.start=async function(){
    try{
      $("authMsg").textContent="Carregando seus dados…";
      await load();
      const result=await materializeRecurringV17();
      if(result?.transactions?.length) DATA.transactions.push(...result.transactions);
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("v18Loading")?.classList.add("hidden");
      $("userEmail").textContent=USER.email||"";
      render();
    }catch(e){
      $("v18Loading")?.classList.add("hidden");
      $("auth").classList.remove("hidden");
      $("app").classList.add("hidden");
      $("authMsg").textContent="Erro ao carregar seus dados: "+e.message;
      $("authMsg").className="msg err";
      console.error(e);
    }
  };

  // The original handlers are replaced so the V17 startup path is always used.
  $("loginForm").onsubmit=async e=>{
    e.preventDefault();
    $("authMsg").textContent="Entrando...";
    const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});
    if(error){$("authMsg").textContent=error.message;$("authMsg").className="msg err";return}
    USER=data.user;
    await window.start();
  };

  $("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  $("refresh").onclick=async()=>{try{await window.reload();toast("Dados atualizados.")}catch(e){toast(e.message,true)}};

  (async()=>{
    // Bootstrap protegido: nunca deixe a tela de carregamento presa
    // se a sessão não existir ou o Supabase estiver lento/indisponível.
    const timeout=(ms)=>new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tempo limite ao conectar ao servidor. Verifique sua internet e tente novamente.")),ms));
    try{
      const result=await Promise.race([sb.auth.getSession(),timeout(12000)]);
      const session=result?.data?.session;
      if(session){
        USER=session.user;
        await Promise.race([window.start(),timeout(25000)]);
      }else{
        $("v18Loading")?.classList.add("hidden");
      }
    }catch(e){
      console.error("V18 bootstrap",e);
      $("v18Loading")?.classList.add("hidden");
      $("authMsg").textContent="Não foi possível carregar o sistema. "+e.message;
      $("authMsg").className="msg err";
    }
  })();

})();
</script>
<script>
/* ================= MENTORIA BLACK V19 =================
   - Categoria por tipo robusta (inclui dados legados)
   - Compra no cartão separada da competência/data da fatura
   - Parcelamento com compra real + datas de fatura
   - Correções de duplicidade, planejamento, contas/cartões e UX
*/
(() => {
  const V19_KIND = value => {
    const k = String(value ?? '').trim().toLowerCase();
    if (['receita','income','revenue','entrada','credit','credito'].includes(k)) return 'receita';
    if (['ambos','both','all'].includes(k)) return 'ambos';
    return 'despesa';
  };
  const V19_INCOME_DEFAULTS = ['Salário','Bonificação','Renda extra','Outras receitas'];
  const V19_EXPENSE_DEFAULTS = ['Gastos Fixos','Investimentos','Conforto','Metas','Lazer','Conhecimento'];
  const V19_CATS = () => Array.isArray(DATA.categories) ? DATA.categories : [];
  const V19_TOP = () => visibleTopCategories(V19_CATS());
  const V19_INCOME = () => dedupeCategoryOptions(V19_TOP().filter(c => ['receita','ambos'].includes(V19_KIND(c.kind))));
  const V19_EXPENSE = () => dedupeCategoryOptions(V19_TOP().filter(c => ['despesa','ambos'].includes(V19_KIND(c.kind))));
  const V19_CATS_FOR = type => type === 'receita' ? V19_INCOME() : V19_EXPENSE();
  const V19_NORM = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  const V19_DEFAULT_EXPENSE_SET = new Set(V19_EXPENSE_DEFAULTS.map(V19_NORM));
  const V19_CATEGORY_MATCH = (a,b) => V19_NORM(a) === V19_NORM(b);

  // Normalize legacy category records in memory so the UI never rejects a valid expense
  // merely because the database used a legacy value such as "expense" or left kind null.
  V19_CATS().forEach(c => { if (!c.kind) c.kind = V19_EXPENSE_DEFAULTS.map(x=>x.toLowerCase()).includes(String(c.name||'').toLowerCase()) ? 'despesa' : 'despesa'; });

  function v19Opts(list, value='') {
    return '<option value="">Selecione</option>' + dedupeCategoryOptions(list).map(c =>
      `<option value="${esc(c.name)}" ${V19_CATEGORY_MATCH(value,c.name)?'selected':''}>${esc(c.name)}</option>`
    ).join('');
  }
  function v19Card(id) { return DATA.cards.find(c => c.id === id) || null; }
  function v19DateAddMonths(dateStr, n) {
    const d = new Date(String(dateStr) + 'T12:00:00');
    const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + Number(n||0));
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()));
    return d.toISOString().slice(0,10);
  }
  function v19FirstDayOfMonth(dateStr, offset=0) {
    const d = new Date(String(dateStr).slice(0,7) + '-01T12:00:00');
    d.setMonth(d.getMonth()+Number(offset||0));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  }
  function v19SuggestedBillingDate(purchaseDate, cardId) {
    const card = v19Card(cardId);
    if (!purchaseDate) return '';
    const d = new Date(purchaseDate+'T12:00:00');
    let offset = 1;
    if (card?.closing_day) offset = d.getDate() > Number(card.closing_day) ? 2 : 1;
    const base = new Date(d.getFullYear(), d.getMonth()+offset, 1);
    const day = Math.min(Number(card?.due_day)||1, new Date(base.getFullYear(),base.getMonth()+1,0).getDate());
    base.setDate(day);
    return base.toISOString().slice(0,10);
  }
  function v19HasCard(t){ return !!t?.card_id; }
  function v19CategoryFor(type, value) {
    const wanted = V19_NORM(canonicalCategoryName(value));
    if (!wanted) return false;
    if (V19_CATS_FOR(type).some(c => V19_CATEGORY_MATCH(c.name, value))) return true;
    // Investments intentionally use the expense-category universe.
    return type !== 'receita' && V19_DEFAULT_EXPENSE_SET.has(wanted);
  }
  async function v19EnsureIncomeCategories(){
    if (V19_INCOME().length) return;
    for (const [name,color] of [['Salário','#7bc67b'],['Bonificação','#b46cff'],['Renda extra','#5aa9e6'],['Outras receitas','#d9ad37']]) {
      const r=await sb.from('categories').insert({user_id:USER.id,name,parent:null,kind:'receita',color}).select().maybeSingle();
      if (!r.error && r.data) DATA.categories.push(r.data);
    }
  }

  function v19GoalOptions(selected){
    const goals=Array.isArray(DATA.goals)?DATA.goals:[];
    const current=String(selected||'');
    const options=['<option value="">'+(goals.length?'Nenhuma':'Nenhuma meta cadastrada')+'</option>'];
    goals.forEach(goal=>options.push(`<option value="${esc(goal.id)}" ${goal.id===current?'selected':''}>${esc(goal.name||'Meta sem nome')}</option>`));
    if(current&&!goals.some(goal=>goal.id===current))options.push(`<option value="${esc(current)}" selected>Meta indisponível</option>`);
    return options.join('');
  }

  // Fix parcel deduplication: two purchases in the same month with the same description are not duplicates.
  window.txDuplicateKey = function(t){
    const note=String(t.note||'');
    const parcel=note.match(/parcelado\s+(\d+)\/(\d+).*?compra\s+([0-9]{4}-[0-9]{2}(?:-[0-9]{2})?)/i);
    if(parcel) return ['parcel',parcel[3],parcel[1],parcel[2],String(t.description||'').trim().toLowerCase(),String(t.transaction_type||''),String(t.category||'').trim().toLowerCase(),t.account_id||'',t.card_id||''].join('|');
    return [t.transaction_date,t.purchase_date||'',t.transaction_type,String(t.description||'').trim().toLowerCase(),String(t.category||'').trim().toLowerCase(),Number(t.amount||0).toFixed(2),t.account_id||'',t.card_id||''].join('|');
  };
  window.cleanTransactions = function(ts){
    const seen=new Set(),out=[],duplicates=[];
    for(const t of ts){
      const parcel=/parcelado\s+\d+\/\d+/i.test(String(t.note||''));
      if(parcel){const key=window.txDuplicateKey(t);if(seen.has(key)){duplicates.push(t);continue}seen.add(key)}
      out.push(t);
    }
    return {rows:out,duplicates};
  };
  window.cardSummary = function(){
    const map={}; window.periodTx().filter(t=>t.card_id&&['despesa','investimento'].includes(t.transaction_type)).forEach(t=>map[t.card_id]=(map[t.card_id]||0)+Number(t.amount||0));
    const rows=DATA.cards.map(c=>[c,Number(map[c.id]||0)]); return {rows,total:rows.reduce((a,x)=>a+x[1],0)};
  };

  window.openTransaction = async function(id){
    const t=id?DATA.transactions.find(x=>x.id===id):{};
    if(t?.transaction_type==='receita') await v19EnsureIncomeCategories();
    const initial=t?.transaction_type||'despesa';
    const initialPurchase=t?.purchase_date || (t?.card_id ? t?.transaction_date : (id ? t?.transaction_date : new Date().toISOString().slice(0,10)));
    const initialBilling=t?.transaction_date || initialPurchase;
    modal(id?'Editar lançamento':'Novo lançamento',`
      <form id="v19TxForm" class="v15-form">
        <div class="v15-amount"><span>Valor</span><input name="amount" id="v19Amount" inputmode="decimal" autocomplete="off" placeholder="R$ 0,00" value="${t?.amount?num(t.amount):''}" required autofocus></div>
        <div class="v15-types">${['despesa','receita','investimento'].map(x=>`<button type="button" class="v15-type ${initial===x?'active':''}" data-type="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
        <div class="v15-essential">
          <div><label id="v19DateLabel">Data do lançamento</label><input name="transaction_date" id="v19TransactionDate" type="date" value="${initialBilling}" required></div>
          <div><label>Descrição</label><input name="description" value="${esc(t?.description||'')}" placeholder="Ex.: Salário" required></div>
          <div><label>Categoria</label><select name="category" id="v19Category" required>${v19Opts(V19_CATS_FOR(initial),t?.category||'')}</select></div>
          <div><label>Conta</label><select name="account_id" id="v19Account">${accountOptions(t?.account_id||'')}</select></div>
        </div>
        <div id="v19CardBox" class="full" style="display:${t?.card_id?'block':'none'}">
          <div class="notice"><b>Cartão de crédito:</b> a compra e a competência da fatura são datas diferentes. A competência é a data usada nos gráficos, planejamento e saldo do mês.</div>
          <div class="v19-card-grid">
            <div><label>Data da compra</label><input id="v19PurchaseDate" type="date" value="${initialPurchase}"></div>
            <div><label>Data da despesa na fatura</label><input id="v19BillingDate" type="date" value="${initialBilling}"></div>
          </div>
        </div>
        <div class="v15-essential">
          <div><label>Cartão</label><select name="card_id" id="v19Card">${cardOptions(t?.card_id||'')}</select></div>
          <div><label>Subcategoria</label><input name="subcategory" value="${esc(t?.subcategory||'')}"></div>
        </div>
        <div class="v38-status-row"><label>Status</label><select name="status"><option value="realizado">Realizado</option><option value="pendente" ${t?.status==='pendente'?'selected':''}>Pendente</option><option value="cancelado" ${t?.status==='cancelado'?'selected':''}>Cancelado</option></select></div>
        <details class="v15-details"><summary>Mais detalhes <span>Opcional</span></summary>
          <div class="v15-detail-grid">
            <div><label>Forma de pagamento</label><input name="payment_method" value="${esc(t?.payment_method||'')}"></div>
            <div><label>Vincular a uma meta</label><select name="goal_id" id="v19Goal">${v19GoalOptions(t?.goal_id)}</select></div>
            <div><label>Efeito na meta</label><select name="goal_effect" id="v19GoalEffect"><option value="contribution" ${(t?.goal_effect||'contribution')==='contribution'?'selected':''}>Aporte</option><option value="withdrawal" ${t?.goal_effect==='withdrawal'?'selected':''}>Retirada</option></select></div>
            <div class="full"><label>Observação</label><textarea name="note">${esc(t?.note||'')}</textarea></div>
            <div class="full v15-check"><label><input type="checkbox" id="v19Install"> Parcelar lançamento</label><span>Divide o lançamento em parcelas futuras.</span></div>
            <div class="full hidden" id="v19InstallFields"><div class="v19-card-grid"><div><label>Número de parcelas</label><input id="v19Count" type="number" min="2" max="120" value="2"></div><div><label>Primeira fatura</label><input id="v19Start" type="date" value="${initialBilling}"></div></div><div id="v19InstallPreview" class="notice" style="margin-top:12px"></div></div>
            <div class="full v15-check"><label><input type="checkbox" id="v19Recurring"> Lançamento recorrente</label><span>Cria uma regra mensal. Pode ser usada junto com o parcelamento.</span></div>
          </div>
        </details>
        <div id="v19TxMsg" class="msg"></div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar lançamento</button></div>
      </form>`);

    const form=$('v19TxForm'), amount=$('v19Amount'), typeButtons=document.querySelectorAll('#v19TxForm .v15-type'), typeInitial=initial;
    const typeState={value:typeInitial};
    const typeEl=()=>typeState.value;
    const category=$('v19Category'), account=$('v19Account'), card=$('v19Card'), cardBox=$('v19CardBox'), purchase=$('v19PurchaseDate'), billing=$('v19BillingDate'), billingMain=$('v19TransactionDate'), dateLabel=$('v19DateLabel'), install=$('v19Install'), installFields=$('v19InstallFields'), start=$('v19Start'), count=$('v19Count'), installPreview=$('v19InstallPreview'), recurring=$('v19Recurring'), goal=$('v19Goal'), goalEffect=$('v19GoalEffect');
    function syncCategories(){
      const list=V19_CATS_FOR(typeEl());
      category.innerHTML=v19Opts(list,v19CategoryFor(typeEl(),category.value)?category.value:'');
      category.required=true;
    }
    function syncAccountCard(){
      const revenue=typeEl()==='receita';
      if(revenue) card.value='';
      card.disabled=revenue;
      account.disabled=!!card.value;
    }
    function syncDatesFromCard(){
      const hasCard=!!card.value && typeEl()!=='receita';
      cardBox.style.display=hasCard?'block':'none';
      dateLabel.textContent=hasCard?'Data da despesa na fatura':'Data do lançamento';
      if(!hasCard)return;
      purchase.value=purchase.value||billingMain.value;
      if(!id||!t?.card_id) billing.value=v19SuggestedBillingDate(purchase.value,card.value)||billingMain.value;
      billingMain.value=billing.value||billingMain.value;
      if(install.checked) start.value=billing.value||billingMain.value;
    }
    function updateInstallPreview(){
      if(!install.checked){installPreview.innerHTML='';return;}
      const cents=Math.round(parseMoney(amount.value)*100), n=Math.max(2,Math.min(120,Number(count.value)||2));
      if(cents<=0){installPreview.innerHTML='<b>Prévia:</b> informe o valor total da compra.';return;}
      const base=Math.floor(cents/n), last=cents-base*(n-1);
      const values=Array.from({length:n},(_,i)=>(i===n-1?last:base)/100);
      const shown=values.length<=6
        ? values.map((value,i)=>`<span>Parcela ${i+1}: <b>${money(value)}</b></span>`).join(' · ')
        : values.slice(0,3).map((value,i)=>`<span>${i+1}ª: <b>${money(value)}</b></span>`).join(' · ')+' · … · '+`<span>${n}ª: <b>${money(values[n-1])}</b></span>`;
      installPreview.innerHTML=`<b>Prévia:</b> ${n}x de ${money(values[0])}<br><span class="small muted">Total ${money(cents/100)} · ${shown}</span>`;
    }
    function syncInstallments(){
      installFields.classList.toggle('hidden',!install.checked);
      if(install.checked&&card.value) start.value=billing.value||billingMain.value;
      updateInstallPreview();
    }
    function syncGoalEffect(){
      const linked=!!goal.value;
      goalEffect.disabled=!linked;
      if(linked&&!goalEffect.value)goalEffect.value='contribution';
    }
    function syncTypeState(){
      syncCategories();
      const installLabel=install.closest('.v15-check')?.querySelector('span');
      if(installLabel)installLabel.textContent=typeEl()==='receita'?'Divide a receita total em parcelas futuras, sem alterar o valor total informado.':'Para cartão, cada parcela fica no mês da respectiva fatura.';
      const startLabel=install.closest('.v15-check')?.nextElementSibling?.querySelector('label');
      if(startLabel)startLabel.textContent=typeEl()==='receita'?'Primeiro lançamento':'Primeira fatura';
      const recurringLabel=recurring.closest('.v15-check')?.querySelector('span');
      if(recurringLabel)recurringLabel.textContent=typeEl()==='receita'?'Cria uma regra mensal para receber automaticamente nos próximos meses.':'Cria uma regra mensal. Pode ser usada junto com o parcelamento.';
      syncAccountCard();syncDatesFromCard();syncInstallments();
    }
    function setType(next){typeState.value=next;typeButtons.forEach(button=>button.classList.toggle('active',button.dataset.type===next));syncTypeState();}
    typeButtons.forEach(button=>button.onclick=()=>setType(button.dataset.type));
    card.onchange=()=>{if(card.value)account.value='';syncTypeState();};
    account.onchange=()=>{if(account.value)card.value='';syncTypeState();};
    goal.onchange=syncGoalEffect;
    purchase.onchange=()=>{if(card.value&&!id)billing.value=v19SuggestedBillingDate(purchase.value,card.value)||billing.value;billingMain.value=billing.value||billingMain.value;syncInstallments();};
    billing.onchange=()=>{billingMain.value=billing.value;syncInstallments();};
    billingMain.onchange=()=>{if(card.value)billing.value=billingMain.value;syncInstallments();};
    install.onchange=()=>{if(install.checked)start.value=card.value?(billing.value||billingMain.value):billingMain.value;syncInstallments();};
    amount.addEventListener('blur',()=>{formatMoneyInput(amount);updateInstallPreview();});
    amount.addEventListener('input',updateInstallPreview);
    count.addEventListener('input',updateInstallPreview);
    const parcelMatch=`${t?.note||''} ${t?.description||''}`.match(/(?:Parcelado\s+|\()(\d+)\/(\d+)\)?/i);
    if(parcelMatch){install.checked=true;count.value=Number(parcelMatch[2]);install.dataset.existingParcel='1';count.disabled=true;}
    else{count.disabled=false;delete install.dataset.existingParcel;}
    recurring.disabled=false;
    syncTypeState();
    syncGoalEffect();

    form.onsubmit=async e=>{
      e.preventDefault();
      const fd=new FormData(form), type=typeEl(), amountValue=parseMoney(fd.get('amount')), cat=String(fd.get('category')||'').trim(), accountId=account.value||null, cardId=card.value||null;
      const goalId=goal.value||null, goalEffectValue=goalId?(goalEffect.value==='withdrawal'?'withdrawal':'contribution'):null;
      const purchaseDate=cardId ? (purchase.value||billingMain.value) : null;
      const billingDate=cardId ? (billing.value||billingMain.value) : billingMain.value;
      const errors=[];
      if(amountValue<=0)errors.push('valor');
      if(!String(fd.get('description')||'').trim())errors.push('descrição');
      if(!v19CategoryFor(type,cat))errors.push('selecione uma categoria compatível com o tipo');
      if(['despesa','investimento'].includes(type)&&!accountId&&!cardId)errors.push('conta ou cartão');
      if(type==='receita'&&!accountId)errors.push('conta');
      if(accountId&&cardId)errors.push('escolha conta OU cartão');
      if(cardId&&type==='receita')errors.push('receita não pode usar cartão de crédito');
      if(!billingDate)errors.push('data da fatura');
      if(!purchaseDate&&cardId)errors.push('data da compra');
      if(errors.length){$('v19TxMsg').textContent='Preencha/corrija: '+errors.join(', ')+'.';return}

      const base={
        transaction_date:billingDate, purchase_date:purchaseDate,
        transaction_type:type, description:String(fd.get('description')).trim(), category:cat,
        subcategory:fd.get('subcategory')||null, amount:amountValue, status:fd.get('status')||'realizado',
        account_id:accountId, card_id:cardId,
        payment_method:fd.get('payment_method')||null, note:fd.get('note')||null,
        goal_id:goalId, goal_effect:goalEffectValue
      };
      if(id){
        const r=await sb.from('transactions').update(base).eq('id',id).eq('user_id',USER.id);
        if(r.error){$('v19TxMsg').textContent='Não foi possível salvar: '+r.error.message;return}
        closeModal();await reload();toast('Lançamento atualizado.');return;
      }

      let createdInstallments=false;
      if(install.checked){
        const n=Math.max(2,Math.min(120,Number(count.value)||2));
        const first=start.value||billingDate;
        if(cardId && new Date(first+'T12:00:00') < new Date(purchaseDate+'T12:00:00')){$('v19TxMsg').textContent='A primeira fatura não pode ser anterior à compra.';return}
        const cents=Math.round(amountValue*100), each=Math.floor(cents/n), last=cents-each*(n-1), rows=[];
        for(let i=0;i<n;i++){
          const txDate=v19DateAddMonths(first,i);
          rows.push({...base,user_id:USER.id,transaction_date:txDate,purchase_date:purchaseDate,note:`${base.note?base.note+' • ':''}Parcelado ${i+1}/${n} • Compra ${purchaseDate||billingDate}`,amount:(i===n-1?last:each)/100});
        }
        const r=await sb.from('transactions').insert(rows);
        if(r.error){$('v19TxMsg').textContent='Não foi possível criar as parcelas: '+r.error.message;return}
        createdInstallments=true;
      }else{
        const r=await sb.from('transactions').insert({...base,user_id:USER.id});
        if(r.error){$('v19TxMsg').textContent='Não foi possível salvar: '+r.error.message;return}
      }

      if(recurring.checked){
        const recurringStart=addMonthsV16(billingDate,1);
        const rr=await sb.from('recurring').insert({
          user_id:USER.id,name:base.description,frequency:'monthly',interval:1,next_date:recurringStart,
          start_date:base.transaction_date,day_of_month:Number(billingDate.slice(8,10))||1,
          amount:base.amount,type:base.transaction_type,category:base.category,subcategory:base.subcategory,
          account_id:base.account_id,card_id:base.card_id,goal_id:base.goal_id,goal_effect:base.goal_effect,
          active:true,auto_post:true,note:base.note||null
        });
        if(rr.error){$('v19TxMsg').textContent='Lançamento salvo, mas a recorrência não foi criada: '+rr.error.message;return}
      }
      closeModal();await reload();
      toast(createdInstallments && recurring.checked ? 'Parcelas e recorrência criadas.' : createdInstallments ? `${Math.max(2,Math.min(120,Number(count.value)||2))} parcelas criadas.` : recurring.checked ? 'Lançamento e recorrência criados.' : 'Lançamento salvo.');
    };
    requestAnimationFrame(()=>{amount.focus({preventScroll:true});amount.select();});
  };

  // Category screen and filters use the same normalized kind rules as the transaction form.
  window.categories=function(){
    return pageHead('Categorias','Receitas e despesas possuem listas separadas.',`<button class="btn gold" onclick="openCategory()">＋ Categoria</button>`) +
      `<div class="grid"><section class="card s6"><h2>Categorias de despesas</h2>${simpleTable(V19_EXPENSE(),[['Categoria',x=>`<span class="dot" style="background:${x.color||categoryColor(x.name)}"></span>${esc(x.name)}`],['Subcategoria',x=>esc(x.parent||'—')]],'categories')}</section>
      <section class="card s6"><h2>Categorias de receitas</h2>${simpleTable(V19_INCOME(),[['Categoria',x=>`<span class="dot" style="background:${x.color||'#7bc67b'}"></span>${esc(x.name)}`],['Subcategoria',x=>esc(x.parent||'—')]],'categories')}</section></div>`;
  };

  // Account form bug: V18 saved account_type but rendered type.
  window.openAccount=function(id){
    const x=id?DATA.accounts.find(a=>a.id===id):{};
    modal(id?'Editar conta':'Nova conta',`<form id="v19AccountForm"><div class="formgrid"><div><label>Nome</label><input name="name" required value="${esc(x.name||'')}"></div><div><label>Instituição</label><input name="institution" value="${esc(x.institution||'')}"></div><div><label>Saldo atual</label><input name="statement_balance" class="money-field" value="${x.statement_balance??x.opening_balance??0}"></div><div><label>Tipo</label><select name="account_type"><option value="checking" ${(x.account_type||x.type)==='checking'?'selected':''}>Conta corrente</option><option value="savings" ${(x.account_type||x.type)==='savings'?'selected':''}>Poupança</option><option value="investment" ${(x.account_type||x.type)==='investment'?'selected':''}>Investimentos</option><option value="cash" ${(x.account_type||x.type)==='cash'?'selected':''}>Carteira / dinheiro</option></select></div></div><div id="formMsg" class="msg"></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
    document.querySelectorAll('#v19AccountForm .money-field').forEach(e=>e.addEventListener('blur',()=>formatMoneyInput(e)));
    $('v19AccountForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={name:fd.get('name'),institution:fd.get('institution'),statement_balance:parseMoney(fd.get('statement_balance')),account_type:fd.get('account_type')};const r=id?await sb.from('accounts').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('accounts').insert({...o,user_id:USER.id});if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Conta salva.')};
  };

  // Card form now exposes closing day, which is used to suggest the first invoice date.
  window.openCard=function(id){
    const x=id?DATA.cards.find(a=>a.id===id):{};
    modal(id?'Editar cartão':'Novo cartão',`<form id="v19CardForm"><div class="formgrid"><div><label>Nome</label><input name="name" required value="${esc(x.name||'')}"></div><div><label>Instituição</label><input name="institution" value="${esc(x.institution||'')}"></div><div><label>Limite</label><input name="limit_amount" class="money-field" value="${x.limit_amount??x.limit??0}"></div><div><label>Fechamento da fatura</label><input name="closing_day" type="number" min="1" max="31" value="${x.closing_day||''}"></div><div><label>Vencimento</label><input name="due_day" type="number" min="1" max="31" value="${x.due_day||''}"></div></div><div class="muted small" style="margin-top:8px">O fechamento ajuda o sistema a sugerir em qual mês a compra entra na fatura. Você sempre poderá alterar a data manualmente no lançamento.</div><div id="formMsg" class="msg"></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
    document.querySelectorAll('#v19CardForm .money-field').forEach(e=>e.addEventListener('blur',()=>formatMoneyInput(e)));
    $('v19CardForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={name:fd.get('name'),institution:fd.get('institution'),limit:parseMoney(fd.get('limit_amount')),closing_day:Number(fd.get('closing_day')||0)||null,due_day:Number(fd.get('due_day')||0)||null};const r=id?await sb.from('cards').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('cards').insert({...o,user_id:USER.id});if(r.error){$('formMsg').textContent=r.error.message;return}closeModal();await reload();toast('Cartão salvo.')};
  };

  // Planning comparison: investments are measured against the Investments bucket instead of disappearing from realized values.
  function v19RealizedPlan(ts){ return realizedByCategory(ts); }

  // Make the existing revenue chart and all dashboard calculations use the patched period functions.

  // Formulário autocontido: não depende mais do openRecurring nem dos helpers privados do V15.
  window.openRecurring = async function(id){
    const x=id?DATA.recurring.find(a=>a.id===id):{};
    if(!id) await v19EnsureIncomeCategories();
    const today=new Date().toISOString().slice(0,10);
    const initialType=['despesa','receita','investimento'].includes(x?.type)?x.type:'despesa';
    const startDate=x?.start_date||x?.next_date||today;
    const nextDate=x?.next_date||startDate;
    const frequency=String(x?.frequency||'monthly');
    const frequencies=[['monthly','Mensal'],['weekly','Semanal'],['biweekly','Quinzenal'],['yearly','Anual'],['daily','Diária']];
    if(!frequencies.some(([value])=>value===frequency)) frequencies.push([frequency,frequency]);
    modal(id?'Editar recorrência':'Nova recorrência',`
      <form id="v19RecurringForm" class="v15-form">
        <div class="v15-essential">
          <div><label>Nome</label><input name="name" required value="${esc(x?.name||'')}"></div>
          <div><label>Valor</label><input name="amount" id="v19RecurringAmount" class="money-field" inputmode="decimal" value="${x?.amount?num(x.amount):''}" required></div>
          <div><label>Tipo</label><select name="type" id="v19RecurringType">${['despesa','receita','investimento'].map(type=>`<option value="${type}" ${initialType===type?'selected':''}>${type[0].toUpperCase()+type.slice(1)}</option>`).join('')}</select></div>
          <div><label>Categoria</label><select name="category" id="v19RecurringCategory" required>${v19Opts(V19_CATS_FOR(initialType),x?.category||'')}</select></div>
          <div><label>Frequência</label><select name="frequency">${frequencies.map(([value,label])=>`<option value="${esc(value)}" ${frequency===value?'selected':''}>${esc(label)}</option>`).join('')}</select></div>
          <div><label>Intervalo</label><input name="interval" type="number" min="1" max="120" value="${Math.max(1,Number(x?.interval)||1)}" required></div>
          <div><label>Data inicial</label><input name="start_date" id="v19RecurringStart" type="date" value="${startDate}" required></div>
          <div><label>Próxima data</label><input name="next_date" id="v19RecurringNext" type="date" value="${nextDate}" required></div>
          <div><label>Dia do mês</label><input name="day_of_month" id="v19RecurringDay" type="number" min="1" max="31" value="${Math.min(31,Math.max(1,Number(x?.day_of_month)||Number(startDate.slice(8,10))||1))}" required></div>
          <div><label>Subcategoria</label><input name="subcategory" value="${esc(x?.subcategory||'')}"></div>
          <div><label>Conta</label><select name="account_id" id="v19RecurringAccount">${accountOptions(x?.account_id||'')}</select></div>
          <div><label>Cartão</label><select name="card_id" id="v19RecurringCard">${cardOptions(x?.card_id||'')}</select></div>
        </div>
        <details class="v15-details"><summary>Mais opções <span>Opcional</span></summary><div class="v15-detail-grid">
          <div><label>Vincular a uma meta</label><select name="goal_id" id="v19RecurringGoal">${v19GoalOptions(x?.goal_id)}</select></div>
          <div><label>Efeito na meta</label><select name="goal_effect" id="v19RecurringGoalEffect"><option value="contribution" ${(x?.goal_effect||'contribution')==='contribution'?'selected':''}>Aporte</option><option value="withdrawal" ${x?.goal_effect==='withdrawal'?'selected':''}>Retirada</option></select></div>
          <div class="full v15-check"><label><input name="active" type="checkbox" ${x?.active!==false?'checked':''}> Recorrência ativa</label><span>Regras pausadas não geram novos lançamentos.</span></div>
          <div class="full v15-check"><label><input name="auto_post" type="checkbox" ${x?.auto_post!==false?'checked':''}> Lançamento automático</label><span>Preserva a compatibilidade com a materialização atual.</span></div>
          <div class="full"><label>Observação</label><textarea name="note">${esc(x?.note||'')}</textarea></div>
        </div></details>
        <div id="v19RecurringMsg" class="msg"></div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div>
      </form>`);
    const form=$('v19RecurringForm'), type=$('v19RecurringType'), category=$('v19RecurringCategory'), account=$('v19RecurringAccount'), card=$('v19RecurringCard'), start=$('v19RecurringStart'), next=$('v19RecurringNext'), day=$('v19RecurringDay'), amount=$('v19RecurringAmount'), goal=$('v19RecurringGoal'), goalEffect=$('v19RecurringGoalEffect');
    const syncType=()=>{
      const keep=category.value;
      category.innerHTML=v19Opts(V19_CATS_FOR(type.value),v19CategoryFor(type.value,keep)?keep:'');
      const revenue=type.value==='receita';
      if(revenue) card.value='';
      card.disabled=revenue;
      account.disabled=!!card.value;
    };
    type.onchange=async()=>{if(type.value==='receita')await v19EnsureIncomeCategories();syncType();};
    account.onchange=()=>{if(account.value)card.value='';syncType();};
    card.onchange=()=>{if(card.value)account.value='';syncType();};
    const syncGoalEffect=()=>{
      const linked=!!goal.value;
      goalEffect.disabled=!linked;
      if(linked&&!goalEffect.value)goalEffect.value='contribution';
    };
    goal.onchange=syncGoalEffect;
    start.onchange=()=>{if(!next.value)next.value=start.value;day.value=Number(start.value.slice(8,10))||1;};
    amount.addEventListener('blur',()=>formatMoneyInput(amount));
    syncType();
    syncGoalEffect();
    form.onsubmit=async e=>{
      e.preventDefault();
      const fd=new FormData(form), amountValue=parseMoney(fd.get('amount')), selectedType=type.value, selectedCategory=String(fd.get('category')||'').trim(), accountId=account.value||null, cardId=card.value||null;
      const goalId=goal.value||null, goalEffectValue=goalId?(goalEffect.value==='withdrawal'?'withdrawal':'contribution'):null;
      const errors=[];
      if(!String(fd.get('name')||'').trim()) errors.push('nome');
      if(!Number.isFinite(amountValue)||amountValue<=0) errors.push('valor');
      if(!v19CategoryFor(selectedType,selectedCategory)) errors.push('categoria compatível com o tipo');
      if(['despesa','investimento'].includes(selectedType)&&!accountId&&!cardId) errors.push('conta ou cartão');
      if(selectedType==='receita'&&!accountId) errors.push('conta');
      if(accountId&&cardId) errors.push('escolha conta OU cartão');
      if(cardId&&selectedType==='receita') errors.push('receita não pode usar cartão de crédito');
      if(!fd.get('start_date')) errors.push('data inicial');
      if(!fd.get('next_date')) errors.push('próxima data');
      if(errors.length){$('v19RecurringMsg').textContent='Preencha/corrija: '+errors.join(', ')+'.';return}
      const o={
        name:String(fd.get('name')).trim(), frequency:String(fd.get('frequency')||'monthly'), interval:Math.max(1,Math.min(120,Number(fd.get('interval'))||1)),
        next_date:fd.get('next_date'), start_date:fd.get('start_date'), day_of_month:Math.min(31,Math.max(1,Number(fd.get('day_of_month'))||Number(String(fd.get('start_date')).slice(8,10))||1)),
        amount:amountValue, type:selectedType, category:selectedCategory, subcategory:fd.get('subcategory')||null,
        account_id:accountId, card_id:cardId, goal_id:goalId, goal_effect:goalEffectValue,
        active:fd.get('active')==='on', auto_post:fd.get('auto_post')==='on', note:fd.get('note')||null
      };
      const r=id?await sb.from('recurring').update(o).eq('id',id).eq('user_id',USER.id):await sb.from('recurring').insert({...o,user_id:USER.id});
      if(r.error){$('v19RecurringMsg').textContent=r.error.message;return}
      closeModal();await reload();toast('Recorrência salva.');
    };
    requestAnimationFrame(()=>amount.focus());
  };


  document.title='Mentoria Black — Gestão Financeira V81 ESCUDO FINAL';
  const footer=document.querySelector('.footer'); if(footer) footer.textContent=footer.textContent.replace(/V18/g,'V19');

  const style=document.createElement('style'); style.id='v19-style'; style.textContent=`
    .v19-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    #v19CardBox{margin-top:2px}
    #v19CardBox .notice{line-height:1.45}
    @media(max-width:650px){.v19-card-grid{grid-template-columns:1fr}}
  `; document.head.appendChild(style);
})();

</script>
<script>
/* ================= MENTORIA BLACK V22 =================
   Lançamentos — filtro completo, estável e responsivo.
   Regras:
   - Buscar + Tipo + Categoria + Mês + Ano são independentes e combináveis.
   - Mês: Todos os meses + Janeiro..Dezembro.
   - Ano: Todos os anos + somente anos existentes nos lançamentos.
   - Mês sem ano = aquele mês em todos os anos.
   - Ano sem mês = todo o ano.
   - Mês + ano = período exato.
   - A filtragem desta aba não altera Dashboard/Planejamento/Relatórios.
*/
(function(){
  const MONTHS_V22=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const TYPE_LABELS_V22={receita:'Receita',despesa:'Despesa',investimento:'Investimento',transferencia:'Transferência',resgate:'Resgate'};

  if(typeof FILTERS.txYear==='undefined') FILTERS.txYear='';
  if(typeof FILTERS.txMonth==='undefined') FILTERS.txMonth='';
  // Migrate a possible legacy YYYY-MM period from V20/V21.1.
  if(/^\d{4}-\d{2}$/.test(String(FILTERS.txMonth||''))){
    const legacy=String(FILTERS.txMonth);
    FILTERS.txYear=legacy.slice(0,4);
    FILTERS.txMonth=String(Number(legacy.slice(5,7)));
  }

  const dateKey=t=>MBFinance.financialDate(t);
  const txYear=t=>MBFinance.period(t).year;
  const txMonth=t=>MBFinance.period(t).month;

  function existingYears(){
    return [...new Set((DATA.transactions||[]).map(txYear).filter(y=>Number.isInteger(y)))]
      .sort((a,b)=>b-a);
  }

  function categoryNames(type=''){
    const names=new Map();
    const wantedKind=categoryUiKind(type);
    const add=(category,fallbackKind='')=>{
      const name=String(category?.name??category??'').trim();
      const kind=categoryUiKind((category?.kind??fallbackKind)||'despesa');
      if(!name||isLegacyInvestmentCategory(name)||(wantedKind&&kind!==wantedKind&&kind!=='ambos'))return;
      const key=categoryUiIdentity({...((category&&typeof category==='object')?category:{}),name,kind},fallbackKind);
      if(!names.has(key)) names.set(key,name);
    };
    (DATA.categories||[]).forEach(c=>add(c));
    // Historical transaction labels are normalized to the current category
    // before entering the filter list.
    (DATA.transactions||[]).forEach(t=>{
      add({name:canonicalCategoryName(t?.category,t?.transaction_type),kind:t?.transaction_type});
    });
    return [...names.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  }

  function filteredTransactions(){
    const q=String(FILTERS.search||'').trim().toLocaleLowerCase('pt-BR');
    const type=String(FILTERS.txType||'');
    const cat=String(FILTERS.txCategory||'');
    const m=FILTERS.txMonth?Number(FILTERS.txMonth):0;
    const y=FILTERS.txYear?Number(FILTERS.txYear):0;

    return (Array.isArray(DATA.transactions)?DATA.transactions:[])
      .filter(t=>{
        const d=dateKey(t);
        if(!d) return false;
        if(isCancelled(t)) return false;
        if(type && MBFinance.kind(t.transaction_type||t.type)!==MBFinance.kind(type)) return false;
        if(cat){
          const direct=String(t.category||'');
          const top=typeof topCategory==='function'?String(topCategory(direct)||direct):direct;
          const selected=categoryUiNameKey(cat);
          if(selected!==categoryUiNameKey(direct) && selected!==categoryUiNameKey(top)) return false;
        }
        if(m && txMonth(t)!==m) return false;
        if(y && txYear(t)!==y) return false;
        if(q){
          const hay=[t.description,t.category,t.subcategory,t.note,t.payment_method]
            .map(v=>String(v||'')).join(' ').toLocaleLowerCase('pt-BR');
          if(!hay.includes(q)) return false;
        }
        return true;
      })
      .sort((a,b)=>dateKey(b).localeCompare(dateKey(a)));
  }

  function periodTitle(){
    const m=FILTERS.txMonth?Number(FILTERS.txMonth):0;
    const y=FILTERS.txYear?Number(FILTERS.txYear):0;
    if(m && y) return `${MONTHS_V22[m-1]} de ${y}`;
    if(m) return `${MONTHS_V22[m-1]} — todos os anos`;
    if(y) return `Ano de ${y}`;
    return 'Todos os lançamentos';
  }

  function hasActiveFilters(){
    return !!(String(FILTERS.search||'').trim()||FILTERS.txType||FILTERS.txCategory||FILTERS.txMonth||FILTERS.txYear);
  }

  function selectOptions(values,selected,firstLabel,labels){
    return `<option value="">${firstLabel}</option>`+values.map(v=>{
      const value=String(v),label=labels?.[value]||value;
      return `<option value="${esc(value)}" ${String(selected||'')===value?'selected':''}>${esc(label)}</option>`;
    }).join('');
  }

  window.transactions=function(){
    const rows=filteredTransactions();
    const years=existingYears();
    const cats=categoryNames(FILTERS.txType);
    const types=['receita','despesa','investimento','transferencia','resgate'];
    const m=FILTERS.txMonth?String(Number(FILTERS.txMonth)):'';
    const y=FILTERS.txYear?String(Number(FILTERS.txYear)):'';

    return pageHead(
      'Lançamentos',
      'Controle completo dos seus lançamentos.',
      `<button class="btn gold" onclick="openTransaction()">＋ Novo lançamento</button>`
    )+
    `<section class="v22-tx-filters" aria-label="Filtros de lançamentos">
      <div class="v22-search">
        <label for="txSearch">Buscar</label>
        <input id="txSearch" type="search" autocomplete="off" value="${esc(FILTERS.search||'')}" placeholder="Descrição, categoria, observação...">
      </div>
      <div class="v22-filter-grid">
        <div class="filter"><label for="txType">Tipo</label><select id="txType">${selectOptions(types,FILTERS.txType,'Todos os tipos',TYPE_LABELS_V22)}</select></div>
        <div class="filter"><label for="txCategory">Categoria</label><select id="txCategory">${selectOptions(cats,FILTERS.txCategory,'Todas as categorias')}</select></div>
        <div class="filter"><label for="txMonth">Mês</label><select id="txMonth">${selectOptions(MONTHS_V22.map((_,i)=>i+1),m,'Todos os meses',Object.fromEntries(MONTHS_V22.map((n,i)=>[String(i+1),n])))}</select></div>
        <div class="filter"><label for="txYear">Ano</label><select id="txYear">${selectOptions(years,y,'Todos os anos')}</select></div>
      </div>
      ${hasActiveFilters()?`<div class="v22-filter-actions"><button class="btn" type="button" id="v22Clear">Limpar filtros</button></div>`:''}
    </section>
    <section class="v22-results-head">
      <div><strong>${esc(periodTitle())}</strong><span>${rows.length} ${rows.length===1?'lançamento encontrado':'lançamentos encontrados'}</span></div>
    </section>
    <section class="card tx-results-card">${transactionTable(rows)}</section>`;
  };

  const previousBind=window.bindFilters;
  window.bindFilters=function(){
    if(typeof previousBind==='function') previousBind();
    const search=$('txSearch'),type=$('txType'),cat=$('txCategory'),month=$('txMonth'),year=$('txYear'),clear=$('v22Clear');
    if(search){
      search.oninput=()=>{FILTERS.search=search.value;clearTimeout(window.__v22TxTimer);window.__v22TxTimer=setTimeout(()=>render(),180)};
    }
    if(type) type.onchange=()=>{FILTERS.txType=type.value||'';render()};
    if(cat) cat.onchange=()=>{FILTERS.txCategory=cat.value||'';render()};
    if(month) month.onchange=()=>{FILTERS.txMonth=month.value||'';render()};
    if(year) year.onchange=()=>{FILTERS.txYear=year.value||'';render()};
    if(clear) clear.onclick=()=>{
      FILTERS.search='';FILTERS.txType='';FILTERS.txCategory='';FILTERS.txMonth='';FILTERS.txYear='';
      render();
    };
  };

  const style=document.createElement('style');
  style.id='v22-style';
  style.textContent=`
    .v22-tx-filters{margin:14px 0 12px;padding:15px;border:1px solid #292929;border-radius:16px;background:#0b0b0b}
    .v22-search{margin-bottom:12px}
    .v22-search input{min-height:46px}
    .v22-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .v22-filter-grid .filter{min-width:0}
    .v22-filter-grid select{min-height:44px}
    .v22-filter-actions{display:flex;justify-content:flex-end;margin-top:11px}
    .v22-results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;padding:14px 15px;border:1px solid #292929;border-radius:14px;background:#0c0c0c}
    .v22-results-head strong{display:block;font-size:16px;color:#f4f4f4;line-height:1.25}
    .v22-results-head span{display:block;margin-top:4px;color:#888;font-size:12px}
    .tx-results-card{overflow:hidden}
    .tx-results-card .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tx-results-card table{min-width:900px}
    @media(max-width:900px){.v22-filter-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:650px){
      .v22-tx-filters{padding:12px;border-radius:14px}
      .v22-filter-grid{grid-template-columns:1fr;gap:9px}
      .v22-results-head{align-items:flex-start}
      .v22-results-head strong{font-size:15px}
      .v22-filter-actions .btn{width:100%}
      .tx-results-card{padding:0}

<script>
/* ================= MENTORIA BLACK V27 =================
   Exclusão inteligente de séries:
   - Parcela: somente esta / esta e futuras / todas as parcelas.
   - Recorrência: somente esta / esta e futuras / toda a recorrência.
   - Se um lançamento pertencer às duas séries, permite atuar em cada série ou em tudo.
   - Nunca usa confirm() nem deixa "\\n" visível ao usuário.
*/
(function(){
  const parcelInfo=t=>{
    const m=String(t?.note||'').match(/Parcelado\s+(\d+)\/(\d+)\s+•\s+Compra\s+(\d{4}-\d{2}(?:-\d{2})?)/i);
    if(!m)return null;
    return {current:Number(m[1]),total:Number(m[2]),buy:m[3]};
  };
  const recurrenceInfo=t=>{
    const m=String(t?.note||'').match(/Recorrência automática\s+•\s+([0-9a-f-]{8,})/i);
    return m?{ruleId:m[1]}:null;
  };
  const parcelGroup=(info)=>{
    if(!info)return [];
    return (DATA.transactions||[]).filter(x=>{
      const q=parcelInfo(x);
      return q && q.total===info.total && q.buy===info.buy;
    });
  };
  const recurrenceGroup=(ruleId)=>{
    if(!ruleId)return [];
    return (DATA.transactions||[]).filter(x=>recurrenceInfo(x)?.ruleId===ruleId);
  };
  const dateOnly=t=>new Date(String(t.transaction_date||'')+'T12:00:00');

  window.deleteTransactionSmart=async function(id){
    const t=(DATA.transactions||[]).find(x=>x.id===id);
    if(!t)return;
    const pinfo=parcelInfo(t);
    const rinfo=recurrenceInfo(t);
    const pg=parcelGroup(pinfo);
    const rg=recurrenceGroup(rinfo?.ruleId);
    const hasParcel=!!pinfo && pg.length>0;
    const hasRec=!!rinfo && rg.length>0;
    const rule=rinfo?.ruleId ? (DATA.recurring||[]).find(x=>x.id===rinfo.ruleId) : null;

    if(!hasParcel && !hasRec){
      const choice=await deleteChoiceModal('Excluir lançamento','O que você deseja apagar?',[
        {value:'one',title:'Somente este lançamento',desc:'Exclui apenas o lançamento selecionado.'}
      ]);
      if(choice!=='one')return;
      const r=await sb.from('transactions').delete().eq('id',id).eq('user_id',USER.id);
      if(r.error){toast('Não foi possível excluir: '+r.error.message,true);return}
      await reload();toast('Lançamento excluído.');return;
    }

    // Para despesas parceladas/recorrentes, manter sempre as 3 opções principais,
    // com linguagem simples e consistente em toda a aplicação.
    const options=[{value:'one',title:'Somente esta despesa',desc:'Exclui apenas a despesa deste mês.'}];
    if(hasParcel || hasRec){
      options.push({value:'future',title:'Esta despesa e as futuras',desc:hasParcel&&hasRec
        ? `Exclui esta e as próximas parcelas/ocorrências relacionadas.`
        : hasParcel
          ? `Exclui da parcela ${pinfo.current}/${pinfo.total} até a última parcela.`
          : 'Exclui este lançamento e os próximos da recorrência.'});
      options.push({value:'all',title:'Todas as despesas',desc:hasParcel&&hasRec
        ? 'Exclui todas as parcelas e ocorrências relacionadas a esta despesa.'
        : hasParcel
          ? `Exclui todas as ${pg.length} parcelas desta compra.`
          : `Exclui todos os ${rg.length} lançamentos desta recorrência.`});
    }

    const title=hasParcel&&hasRec?'Excluir despesa':hasParcel?'Excluir despesa parcelada':'Excluir despesa recorrente';
    const subtitle=hasParcel&&hasRec
      ? `Esta despesa pertence a uma compra ${pinfo.current}/${pinfo.total} e também a uma recorrência. Escolha o alcance da exclusão.`
      : hasParcel
        ? `Esta é a parcela ${pinfo.current}/${pinfo.total}. Escolha o alcance da exclusão.`
        : hasRec
          ? `Esta despesa pertence à recorrência${rule?.name?` “${esc(rule.name)}”`:''}. Escolha o alcance da exclusão.`
          : 'Escolha o alcance da exclusão.';

    const choice=await deleteChoiceModal(title,subtitle,options);
    if(!choice)return;

    let ids=[];
    let deleteRule=false;
    let disableRule=false;

    if(choice==='one') ids=[id];
    if(choice==='future'){
      const parcelIds=hasParcel
        ? pg.filter(x=>{const q=parcelInfo(x);return q&&q.current>=pinfo.current}).map(x=>x.id)
        : [];
      const recurrenceIds=hasRec
        ? rg.filter(x=>dateOnly(x).getTime()>=dateOnly(t).getTime()).map(x=>x.id)
        : [];
      ids=[...new Set([...parcelIds,...recurrenceIds])];
      disableRule=hasRec&&!!rule;
    }
    if(choice==='all'){
      ids=[...new Set([
        ...(hasParcel?pg.map(x=>x.id):[]),
        ...(hasRec?rg.map(x=>x.id):[])
      ])];
      deleteRule=hasRec&&!!rule;
    }

    ids=[...new Set(ids.filter(Boolean))];
    if(!ids.length && !deleteRule && !disableRule){toast('Nenhum lançamento encontrado para a ação escolhida.',true);return}

    if(ids.length){
      const dr=await sb.from('transactions').delete().in('id',ids).eq('user_id',USER.id);
      if(dr.error){toast('Não foi possível excluir os lançamentos: '+dr.error.message,true);return}
    }
    if(disableRule){
      const ur=await sb.from('recurring').update({active:false}).eq('id',rinfo.ruleId).eq('user_id',USER.id);
      if(ur.error){toast('Os lançamentos foram excluídos, mas não foi possível desativar a recorrência: '+ur.error.message,true);return}
    }
    if(deleteRule){
      const rr=await sb.from('recurring').delete().eq('id',rinfo.ruleId).eq('user_id',USER.id);
      if(rr.error){toast('Os lançamentos foram excluídos, mas não foi possível excluir a recorrência: '+rr.error.message,true);return}
    }

    await reload();
    const parts=[];
    if(ids.length)parts.push(`${ids.length} lançamento${ids.length===1?'':'s'} excluído${ids.length===1?'':'s'}`);
    if(disableRule)parts.push('recorrência desativada');
    if(deleteRule)parts.push('recorrência excluída');
    toast(parts.join(' • ')+'.');
  };

  document.title='Mentoria Black — Gestão Financeira V81 ESCUDO FINAL';
  const footer=document.querySelector('.footer');
  if(footer)footer.textContent=footer.textContent.replace(/V28|V27|V25|V24|V23|V22|V21\.1|V20|V19\.1|V19|V18/g,'V38');
})();
</script>









<script>

   Único ponto de manutenção das correções recentes:

(function(){
/* módulo consolidado 2 */
(function(){
  const normV38=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

  window.reserveInfo=function(){
    const rx=/reserva|emerg[eê]ncia|caixinha/i;
    const goals=(DATA.goals||[]).filter(g=>rx.test(`${g.name||''}`));
    const accounts=(DATA.accounts||[]).filter(a=>rx.test(`${a.name||''} ${a.institution||''}`));
    const assets=(DATA.assets||[]).filter(a=>rx.test(`${a.name||''} ${a.institution||''}`));

    // A mesma reserva pode aparecer como meta + conta/ativo. Não somamos duas vezes.
    const accountKeys=new Set(accounts.map(a=>normV38(`${a.name||''}|${a.institution||''}`)));
    const uniqueAssets=assets.filter(a=>!accountKeys.has(normV38(`${a.name||''}|${a.institution||''}`)));
    const accountValue=accounts.reduce((a,x)=>a+Number(x.statement_balance??x.opening_balance??0),0);
    const assetValue=uniqueAssets.reduce((a,x)=>a+Number(x.current_value||0),0);
    const goalValue=accountValue||assetValue
      ? 0
      : goals.reduce((a,g)=>a+Number(g.current||0),0);
    const current=accountValue+assetValue+goalValue;
    const target=goals.reduce((a,g)=>a+Number(g.target||0),0);
    const source=accounts.length
      ? accounts.map(a=>a.name).join(' • ')
      : uniqueAssets.length
        ? uniqueAssets.map(a=>a.name).join(' • ')
        : goals.length
          ? goals.map(g=>g.name).join(' • ')
          : '';
    return {current,target,pct:target?Math.min(100,current/target*100):0,source,accounts,assets:uniqueAssets,goals};

<script>
/* ===== V60 CONSOLIDATED CORE ===== */

/* Saúde Financeira e configuração da Reserva — núcleo consolidado */
(function(){
  'use strict';
  

  const KEY=()=>`mb_v50_reserve_${USER?.id||'local'}`;
  const readSettings=()=>{
    try{return JSON.parse(localStorage.getItem(KEY())||'{}')||{}}catch{return {}}
  };
  const saveSettings=s=>{try{localStorage.setItem(KEY(),JSON.stringify(s||{}))}catch{}};
  const safe=n=>Number.isFinite(Number(n))?Number(n):0;
  const clamp=(n,a=0,b=100)=>Math.min(b,Math.max(a,safe(n)));
  const fixedExpenses=()=>{
    const rows=window.periodTx?window.periodTx():periodTx();
    return rows.filter(t=>topCategory(t.category,t.transaction_type)==='Gastos Fixos' && ['despesa','investimento'].includes(t.transaction_type))
      .reduce((a,t)=>a+safe(t.amount),0);
  };
  const reserve=()=>window.reserveInfo?window.reserveInfo():{current:0,target:0,pct:0};
  const monthsTarget=()=>{
    const s=readSettings();
    const n=s.months==null?6:Number(s.months);
    return Number.isFinite(n)&&n>0?n:6;
  };
  const reserveTargetValue=()=>fixedExpenses()*monthsTarget();
  const coverage=()=>{
    const fx=fixedExpenses(), cur=safe(reserve().current);
    return fx>0?cur/fx:0;
  };
  const progress=()=>{
    const target=reserveTargetValue(),cur=safe(reserve().current);
    return target>0?clamp(cur/target*100):0;
  };
  const deadline=()=>readSettings().deadline||'';
  const remaining=()=>Math.max(0,reserveTargetValue()-safe(reserve().current));
  const monthlyContribution=()=>{
    const d=deadline();
    if(!d)return 0;
    const today=new Date();
    const end=new Date(d+'T12:00:00');
    const months=Math.max(1,(end.getFullYear()-today.getFullYear())*12+(end.getMonth()-today.getMonth()));
    return remaining()/months;
  };

  function health(){
    const p=monthlyPlan()||{};
    const rows=window.periodTx?window.periodTx():periodTx();
    const t=window.totals?window.totals(rows):totals(rows);
    const planned=Number(p.revenue||0);
    const plannedOut=['fixed_expenses','investments','comfort','goals','leisure','knowledge']
      .reduce((a,k)=>a+safe(p[k]),0);
    const actualOut=t.expense+t.invest;
    const budgetScore=plannedOut>0?clamp((1-Math.max(0,actualOut-plannedOut)/plannedOut)*100):
      (t.balance>=0?75:35);
    const investScore=planned&&safe(t.invest)>0?clamp(t.invest/planned*100):
      (t.invest>0?70:40);
    const cov=coverage(), mt=monthsTarget();
    const reserveScore=mt>0?clamp(cov/mt*100):0;
    const fixed=fixedExpenses();
    const commitmentScore=plannedOut>0?clamp((1-Math.max(0,fixed-plannedOut*.55)/Math.max(1,plannedOut*.55))*100):65;
    const goalRows=(DATA.goals||[]).filter(g=>!(/reserva|emerg[eê]ncia|caixinha/i.test(String(g.name||''))));
    const goalScore=goalRows.length?clamp(goalRows.reduce((a,g)=>a+(safe(g.target)>0?clamp(safe(g.current)/safe(g.target)*100):100),0)/goalRows.length):70;
    const score=Math.round(clamp(budgetScore*.25+investScore*.25+reserveScore*.20+commitmentScore*.15+goalScore*.15));
    let label=score<40?'Crítica':score<60?'Atenção':score<75?'Regular':score<90?'Boa':'Excelente';
    return {score,label,budgetScore,investScore,reserveScore,commitmentScore,goalScore,cov,mt,fixed,t};
  }

  function analysisText(h){
    const strengths=[];
    if(h.budgetScore>=75) strengths.push('Você mantém bom controle do orçamento.');
    if(h.investScore>=75) strengths.push('Sua construção patrimonial está avançando bem.');
    if(h.goalScore>=75) strengths.push('Suas metas cadastradas estão evoluindo de forma consistente.');
    if(!strengths.length) strengths.push('O principal ganho agora é organizar a margem mensal e fortalecer a previsibilidade.');

    let attention='';
    if(h.cov<h.mt) attention=`Seu principal ponto de atenção é a reserva de emergência: ela cobre ${h.cov.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})} meses dos seus Gastos Fixos, enquanto sua meta é ${h.mt.toLocaleString('pt-BR',{maximumFractionDigits:1})} meses.`;
    else if(h.budgetScore<60) attention='Seu principal ponto de atenção é o controle do orçamento deste período.';
    else if(h.investScore<60) attention='Seu principal ponto de atenção é aumentar a constância dos investimentos.';
    else attention='Sua estrutura financeira está equilibrada; o próximo passo é manter a consistência e continuar aumentando sua margem de segurança.';

    const next=h.cov<h.mt
      ? `Faltam ${money(remaining())} para atingir a meta da reserva.`
      : 'Sua meta de reserva já foi atingida; mantenha esse colchão protegido.';
    return `${strengths.join(' ')} ${attention} ${next}`;
  }

  function reserveModal(){
    const s=readSettings(), m=monthsTarget(), d=deadline();
    modal('Reserva de emergência',`<form id="v50ReserveForm">
      <div class="notice">A cobertura é calculada exclusivamente com base nos <b>Gastos Fixos</b>. A meta de meses é definida por você.</div>
      <div class="formgrid" style="margin-top:12px">
        <div><label>Meta da reserva (meses)</label><input name="months" type="number" min="1" step="0.5" value="${m}"></div>
        <div><label>Prazo desejado</label><input name="deadline" type="date" value="${esc(d)}"></div>
      </div>
      <div class="small muted" style="margin-top:10px">Sugestão inicial: 6 meses. Você pode escolher 3, 6, 9, 12 ou qualquer valor personalizado.</div>
      <div id="v50ReservePreview" class="preview"></div>
      <div id="v50ReserveMsg" class="msg"></div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar meta</button></div>
    </form>`);
    const form=$('v50ReserveForm'), preview=$('v50ReservePreview');
    const update=()=>{
      const mm=Math.max(.5,Number(form.months.value)||6), fx=fixedExpenses(), target=fx*mm, cur=safe(reserve().current), falta=Math.max(0,target-cur);
      preview.innerHTML=`<div class="statline"><span>Gastos Fixos mensais</span><strong>${money(fx)}</strong></div><div class="statline"><span>Meta em dinheiro</span><strong>${money(target)}</strong></div><div class="statline"><span>Reserva atual</span><strong>${money(cur)}</strong></div><div class="statline"><span>Falta</span><strong>${money(falta)}</strong></div>`;
    };
    form.months.oninput=update; update();
    form.onsubmit=e=>{e.preventDefault();const mm=Math.max(.5,Number(form.months.value)||6);saveSettings({months:mm,deadline:form.deadline.value||''});closeModal();render();toast('Meta da reserva atualizada.')};
  }

  window.openV50Reserve=reserveModal;
  window.MB_V50_HEALTH=health;

/* ================= MENTORIA BLACK V52 =================
   BASE: V50
   ESCOPO EXCLUSIVO:
   - NÃO altera nenhum quadro existente da Dashboard.
   - Corrige o reconhecimento de "Gastos Fixos" para a camada da V50.
   - Adiciona uma aba própria "Reserva de Emergência".
   - Nenhuma outra área/regra é alterada.
*/
(function(){
  'use strict';
  

  const normV52 = s => String(s ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();

  const safeV52 = n => Number.isFinite(Number(n)) ? Number(n) : 0;

  /* CORREÇÃO PONTUAL
     A V50 compara a categoria exatamente como "Gastos Fixos".
     Normalizamos apenas o retorno de topCategory para que
     "Gastos fixos"/acentuação não resulte em R$ 0,00. */


  function v52PeriodRows(){
    try{
      if(typeof window.periodTx === 'function') return window.periodTx();
      if(typeof periodTx === 'function') return periodTx();
    }catch(e){}
    return [];
  }

  function v52FixedExpenses(){
    return v52PeriodRows()
      .filter(t =>
        normV52(window.topCategory?.(t.category) ?? t.category) === 'gastos fixos' &&
        ['despesa','investimento'].includes(String(t.transaction_type || '').toLowerCase())
      )
      .reduce((sum,t)=>sum + safeV52(t.amount),0);
  }

  function v52Settings(){
    try{
      const id = (window.USER && window.USER.id) || (typeof USER !== 'undefined' && USER ? USER.id : 'local');
      return JSON.parse(localStorage.getItem(`mb_v50_reserve_${id}`) || '{}') || {};
    }catch(e){ return {}; }
  }

  function v52Months(){
    const n = safeV52(v52Settings().months);
    return n > 0 ? n : 6;
  }

  function v52ReserveCurrent(){
    try{
      if(typeof window.reserveInfo === 'function') return safeV52(window.reserveInfo().current);
      if(typeof reserveInfo === 'function') return safeV52(reserveInfo().current);
    }catch(e){}
    return 0;
  }

  function v52Target(){
    return v52FixedExpenses() * v52Months();
  }

  function v52Coverage(){
    const fx = v52FixedExpenses();
    return fx > 0 ? v52ReserveCurrent()/fx : 0;
  }

  function v52Remaining(){
    return Math.max(0, v52Target() - v52ReserveCurrent());
  }

  function v52Pct(){
    const target = v52Target();
    return target > 0 ? Math.min(100, v52ReserveCurrent()/target*100) : 0;
  }

  function v52Deadline(){
    return String(v52Settings().deadline || '');
  }

  function v52MonthlyContribution(){
    const deadline = v52Deadline();
    if(!deadline) return 0;
    const today = new Date();
    const end = new Date(deadline + 'T12:00:00');
    if(Number.isNaN(end.getTime()) || end <= today) return v52Remaining();

    const months = Math.max(
      1,
      (end.getFullYear()-today.getFullYear())*12 +
      (end.getMonth()-today.getMonth())
    );
    return v52Remaining()/months;
  }

      <div class="kpis">
        ${kpiFn('Reserva atual', moneyFn(current), 'valor acumulado / disponível')}

        ${kpiFn('Meta', moneyFn(target), `${months} ${months === 1 ? 'mês' : 'meses'} de cobertura`)}
        ${kpiFn('Falta', moneyFn(falta), 'para atingir a meta')}
        ${kpiFn('Cobertura', coverage.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' meses', 'cobertura atual')}

      </div>

      <div class="grid">

          </div>

          <div class="notice" style="line-height:1.6">
            ${fx > 0
              ? `Com <b>${moneyFn(fx)}</b> de Gastos Fixos mensais e uma
                 meta de <b>${months} ${months === 1 ? 'mês' : 'meses'}</b>,
                 sua reserva necessária é de <b>${moneyFn(target)}</b>.`
              : 'Nenhum Gasto Fixo foi reconhecido no período selecionado.'}
          </div>

          <button class="btn gold" style="margin-top:12px"
            onclick="openV50Reserve()">
            Configurar meta
          </button>
        </section>
      </div>`;
  }

  window.MB_V52_FIXED_EXPENSES = v52FixedExpenses;
  window.MB_V52_RESERVE_PAGE = v52ReservePage;


  const style = document.createElement('style');
  style.id = 'mb-v52-style';
  style.textContent = `
    .mb-v52-reserve-note{line-height:1.6}
  `;
  document.head.appendChild(style);

  document.title = 'Mentoria Black — Gestão Financeira V52';
  const footer = document.querySelector('.footer');
  if(footer) footer.textContent = footer.textContent.replace(/V50|V51|V39|V38/g,'V52');

})();
