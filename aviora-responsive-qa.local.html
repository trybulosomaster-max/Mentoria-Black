<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>AVIORA — Quadro responsivo local</title>
 <style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#202124}body{display:grid;place-items:start center;padding:16px}iframe{display:block;border:1px solid #584b32;background:#070807;box-shadow:0 20px 70px #0008}</style>
</head>
<body>
 <iframe id="qaFrame" title="Preview responsivo AVIORA"></iframe>
 <script>
  const query=new URLSearchParams(location.search);
  const width=Math.max(320,Math.min(1600,Number(query.get('width'))||390));
  const height=Math.max(568,Math.min(1400,Number(query.get('height'))||844));
  const tab=query.get('tab')||'dashboard';
  const cache=query.get('cache')||'responsive-qa';
  const frame=document.getElementById('qaFrame');
  frame.width=String(width);frame.height=String(height);
  frame.src=`aviora-v82.preview.local.html?view=app&tab=${encodeURIComponent(tab)}&cache=${encodeURIComponent(cache)}`;
 </script>
</body>
</html>
