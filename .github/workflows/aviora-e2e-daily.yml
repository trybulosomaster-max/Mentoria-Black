name: AVIORA E2E sintético

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: aviora-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","webkit","firefox"]' || '["chromium"]') }}
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Baixar o código sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências de desenvolvimento
        run: npm ci --ignore-scripts

      - name: Instalar navegador isolado
        run: ./node_modules/.bin/playwright install --with-deps "${{ matrix.browser }}"

      - name: Executar regressão E2E sintética
        run: npm run test:e2e -- --project="${{ matrix.browser }}"

      - name: Guardar relatório E2E
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aviora-e2e-report-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

      - name: Guardar traces e screenshots somente em falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aviora-e2e-failure-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
